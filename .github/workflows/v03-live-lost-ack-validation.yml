name: Validate v0.3 Live Lost ACK Runner

on:
  pull_request:
    branches:
      - main
      - verification/v03-release-driver-shell-221
    paths:
      - '.github/workflows/v03-live-lost-ack-validation.yml'
      - 'scripts/v03_lost_ack_live_runner.py'
      - 'scripts/validate_v03_lost_ack_live_runner.py'
      - 'scripts/v03_real_runtime_driver.py'
      - 'scripts/v03_real_runtime_full_preflight.py'
      - 'scripts/v03_real_runtime_fault_injection.py'
      - 'scripts/v03_real_runtime_lost_ack_orchestration.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile two-process lost-ACK runner
        run: python -m py_compile scripts/v03_lost_ack_live_runner.py scripts/validate_v03_lost_ack_live_runner.py
      - name: Prove hard-exit then fresh-process takeover contract
        run: PYTHONPATH=scripts python scripts/validate_v03_lost_ack_live_runner.py
