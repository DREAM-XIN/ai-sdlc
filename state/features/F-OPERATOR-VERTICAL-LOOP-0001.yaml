    4894292495: remove or fail-close the parallel TrustedVerticalExecutor callback ingress
    so production callback translation can only pass through durable dispatch binding,
    durable role-independence reconstruction and mandatory collector content digest
    validation; and preserve complete repeated-REWORK candidate/remediation identity
    lineage plus authoritative latest-remediation predecessor order, with deterministic
    two-round REWORK/restart coverage.'
  status: DONE
