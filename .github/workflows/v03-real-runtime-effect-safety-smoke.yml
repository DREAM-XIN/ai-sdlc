name: v0.3 Real Runtime Effect Safety Smoke
run-name: v0.3 real-runtime effect-safety smoke ${{ github.sha }}

on:
  push:
    branches:
      - verification/v0.3-real-runtime-effect-safety-221
    paths:
      - '.github/workflows/v03-real-runtime-effect-safety-smoke.yml'
      - 'scripts/operator_github_actions_transport.py'
      - 'scripts/validate_operator_github_actions_transport.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v03-real-runtime-effect-safety-smoke.yml'
      - 'scripts/operator_github_actions_transport.py'
      - 'scripts/validate_operator_github_actions_transport.py'

permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write

jobs:
  real-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install runtime validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate transport semantics
        run: python scripts/validate_operator_github_actions_transport.py
      - name: Launch and recover a real gh-aw Reviewer dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          FI_PR_NUMBER: '230'
          FI_FEATURE_ID: 'F-OPERATOR-DECISIONS-NOTIFICATIONS-0001'
          FI_TARGET_REF: 'feature/F-OPERATOR-DECISIONS-NOTIFICATIONS-0001'
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import time
          from urllib import request
          from urllib.parse import quote
          import yaml

          sys.path.insert(0, 'scripts')
          from operator_github_actions_transport import GitHubActionsTransportConfig, GitHubActionsWorkflowTransport
          from operator_vertical import VERTICAL_PROFILE
          from operator_vertical_gh_aw import GhAwVerticalRoleDispatchGateway, GhAwVerticalWorkflowMap

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          token = os.environ['GITHUB_TOKEN']
          pr_number = os.environ['FI_PR_NUMBER']
          feature_id = os.environ['FI_FEATURE_ID']
          target_ref = os.environ['FI_TARGET_REF']
          control_ref = 'main'

          def get_json(url):
              req = request.Request(url, method='GET')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              with request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          pr = get_json(f'{api}/repos/{repo}/pulls/{pr_number}')
          candidate_head = pr['head']['sha']
          if pr['head']['ref'] != target_ref:
              raise SystemExit(f'fixture PR ref changed: {pr["head"]["ref"]}')

          manifest_path = f'state/features/{feature_id}.yaml'
          content = get_json(f'{api}/repos/{repo}/contents/{manifest_path}?ref={quote(target_ref, safe="")}')
          manifest = yaml.safe_load(base64.b64decode(content['content']).decode())
          revision = int(manifest['revision'])

          sha = os.environ['GITHUB_SHA']
          external_key = f'dispatch-fi-real-{sha[:24]}'
          workflow = 'ai-sdlc-gh-aw-reviewer-claude.lock.yml'
          workflows = GhAwVerticalWorkflowMap(
              default_branch=control_ref,
              developer_workflow='ai-sdlc-gh-aw-worker-codex.lock.yml',
              reviewer_workflow=workflow,
              qa_workflow='ai-sdlc-gh-aw-qa-gemini.lock.yml',
          )
          config = GitHubActionsTransportConfig(
              repository=repo,
              token=token,
              api_url=api,
              receipt_poll_attempts=4,
              receipt_poll_seconds=1.0,
          )

          def make_dispatch(generation, dispatch_id):
              return {
                  'operation_id': f'op-fi-real-{sha[:20]}',
                  'operation_generation': generation,
                  'semantic_effect_key': 'fi-' + sha[:40],
                  'external_dispatch_key': external_key,
                  'dispatch_id': dispatch_id,
                  'target_repository': repo,
                  'feature_id': feature_id,
                  'expected_revision': revision,
                  'target_ref': target_ref,
                  'candidate_pr_number': int(pr_number),
                  'candidate_head_sha': candidate_head,
                  'task_id': 'FI-REAL-RUNTIME-REVIEW-RECEIPT',
                  'role': 'reviewer',
                  'current_stage': 'code-review',
                  'operation_profile': VERTICAL_PROFILE,
                  'trusted_context_digest': 'v03-real-runtime-fi',
                  'worker_adapter': 'gh-aw',
              }

          transport_g0 = GitHubActionsWorkflowTransport(config)
          gateway_g0 = GhAwVerticalRoleDispatchGateway(
              workflows=workflows,
              transport=transport_g0,
          )
          _discarded_ack = gateway_g0.launch(dispatch=make_dispatch(0, f'fi-g0-{sha[:16]}'))

          fresh = GitHubActionsWorkflowTransport(config)
          receipt = None
          for _ in range(12):
              observed = fresh.lookup(workflow=workflow, ref=control_ref, dispatch_key=external_key)
              if observed['lookup_state'] == 'LAUNCHED':
                  receipt = observed
                  break
              if observed['lookup_state'] == 'UNKNOWN':
                  time.sleep(2)
                  continue
              time.sleep(2)
          if receipt is None:
              raise SystemExit('real gh-aw dispatch was not durably correlated after lost ACK')

          transport_g1 = GitHubActionsWorkflowTransport(config)
          gateway_g1 = GhAwVerticalRoleDispatchGateway(
              workflows=workflows,
              transport=transport_g1,
          )
          takeover = gateway_g1.launch(dispatch=make_dispatch(1, f'fi-g1-{sha[:16]}'))
          if takeover.get('lookup_state') != 'LAUNCHED' or str(takeover.get('receipt_id')) != str(receipt['receipt_id']):
              raise SystemExit(f'generation takeover did not adopt exact existing receipt: {takeover} vs {receipt}')

          expected_title = f'AI-SDLC gh-aw {external_key}'
          runs = fresh._runs(workflow=workflow, ref=control_ref)
          exact = [row for row in runs if fresh._run_title(row) == expected_title]
          if len(exact) != 1:
              raise SystemExit(f'duplicate real Worker effect count is {len(exact)}, expected 1')

          evidence = {
              'schema_version': 'ai-sdlc.real-runtime-effect-safety-smoke/v1',
              'repository': repo,
              'target_ref': target_ref,
              'feature_id': feature_id,
              'feature_revision': revision,
              'candidate_pr_number': int(pr_number),
              'candidate_head_sha': candidate_head,
              'workflow': workflow,
              'external_dispatch_key': external_key,
              'lost_ack_recovered_receipt_id': str(receipt['receipt_id']),
              'generation_takeover_receipt_id': str(takeover['receipt_id']),
              'matching_real_run_count': len(exact),
              'duplicate_external_effect_count': 0,
          }
          os.makedirs('evidence', exist_ok=True)
          with open('evidence/v03-real-runtime-effect-safety-smoke.json', 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: v03-real-runtime-effect-safety-smoke
          path: evidence/v03-real-runtime-effect-safety-smoke.json
          if-no-files-found: error
      - name: Publish durable smoke receipt to Issue 221
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          token = os.environ['GITHUB_TOKEN']
          run_id = os.environ['RUN_ID']
          status = os.environ['JOB_STATUS']
          sha = os.environ['HEAD_SHA']
          body = (
              '<!-- ai-sdlc-v03-real-runtime-smoke -->\n'
              f'v0.3 real-runtime effect-safety smoke: **{status}**\n'
              f'Run: `{run_id}`\n'
              f'Head: `{sha}`\n'
              f'Branch: `verification/v0.3-real-runtime-effect-safety-221`'
          )
          payload = json.dumps({'body': body}).encode()
          req = request.Request(f'{api}/repos/{repo}/issues/221/comments', data=payload, method='POST')
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')
          req.add_header('Content-Type', 'application/json')
          with request.urlopen(req, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f'failed to publish smoke receipt: HTTP {response.status}')
          PY
