name: Compile isolated v0.3 DeepSeek local Worker proposal

on:
  push:
    branches: ['gh-aw/compile-v03-deepseek-recovery-20261008']
    paths:
      - '.github/workflows/ai-sdlc-gh-aw-worker-deepseek-v03-local.md'
      - '.github/workflows/ai-sdlc-gh-aw-qa-deepseek-v03-local.md'
      - '.github/workflows/materialize-gh-aw-worker-lock.yml'

permissions:
  contents: write

jobs:
  compile-proposal:
    if: ${{ github.ref_name == 'gh-aw/compile-v03-deepseek-recovery-20261008' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
      - name: Install exact gh-aw compiler
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: gh extension install github/gh-aw --pin v0.89.21 --force
      - name: Strict-compile only isolated Developer and QA proposals
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh aw compile ai-sdlc-gh-aw-worker-deepseek-v03-local --strict
          gh aw compile ai-sdlc-gh-aw-qa-deepseek-v03-local --strict
      - name: Commit only compiler-generated proposed locks
        run: |
          set -euo pipefail
          git config user.name 'ai-sdlc[bot]'
          git config user.email 'ai-sdlc[bot]@users.noreply.github.com'
          git add -- .github/workflows/ai-sdlc-gh-aw-worker-deepseek-v03-local.lock.yml .github/workflows/ai-sdlc-gh-aw-qa-deepseek-v03-local.lock.yml
          git diff --cached --quiet && exit 0
          git commit -m 'build(gh-aw): compile isolated DeepSeek Developer and QA proposal'
          git push origin "HEAD:${GITHUB_REF_NAME}"
