name: AI-SDLC Plan

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch/ref containing the Feature Manifest
        required: true
        type: string
      manifest_path:
        description: Feature Manifest path under state/features/
        required: true
        type: string
      policy_path:
        description: Optional repository-local Dispatch Policy override
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      # Installer must replace this placeholder with a reviewed full AI-SDLC commit SHA.
      - name: Build AI-SDLC Commander Plan
        id: control
        uses: DREAM-XIN/ai-sdlc/.github/actions/control@REPLACE_WITH_AI_SDLC_FULL_SHA # ai-sdlc-install-placeholder
        with:
          operation: plan
          repository: ${{ github.repository }}
          target_ref: ${{ inputs.target_ref }}
          manifest_path: ${{ inputs.manifest_path }}
          policy_path: ${{ inputs.policy_path }}

      - name: Publish Commander summary
        if: ${{ always() && steps.control.outputs.summary_path != '' }}
        shell: bash
        run: cat "${{ steps.control.outputs.summary_path }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.control.outputs.commander_plan_path != '' }}
        with:
          name: ai-sdlc-commander-plan
          path: |
            ${{ steps.control.outputs.commander_plan_path }}
            ${{ steps.control.outputs.summary_path }}
            ${{ steps.control.outputs.prompts_path }}

      - name: Propagate invalid Commander result
        if: ${{ steps.control.outputs.exit_code != '0' }}
        shell: bash
        run: exit "${{ steps.control.outputs.exit_code }}"
