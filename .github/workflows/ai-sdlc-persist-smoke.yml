name: AI-SDLC Persist Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/ai-sdlc-persist-smoke.yml'

permissions:
  contents: read

jobs:
  persist-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Build smoke manifest and event
        shell: bash
        run: |
          cat > /tmp/bootstrap.yaml <<'EOF'
          version: 0.1.0
          feature:
            id: F-SMOKE
            title: Persistence workflow smoke test
            risk: low
          profile: small-change
          created_at: '2026-08-07T11:45:00Z'
          EOF
          python scripts/bootstrap_feature.py /tmp/bootstrap.yaml --output state/features/F-SMOKE.yaml
          mkdir -p state/events/F-SMOKE
          cat > state/events/F-SMOKE/EVT-F-SMOKE-START.yaml <<'EOF'
          version: 0.1.0
          id: EVT-F-SMOKE-START
          feature_id: F-SMOKE
          occurred_at: '2026-08-07T11:46:00Z'
          changes:
            - kind: stage
              id: implementation
              status: WORKING
          EOF
      - name: Validate inbox event and build persistence plan
        shell: bash
        env:
          MANIFEST_PATH: state/features/F-SMOKE.yaml
          EVENT_PATH: state/events/F-SMOKE/EVT-F-SMOKE-START.yaml
          TARGET_REF: test/persist-workflow-smoke-20260807
          REPOSITORY: DREAM-XIN/ai-sdlc
        run: |
          python scripts/ingest_feature_event.py \
            "$MANIFEST_PATH" \
            "$EVENT_PATH" \
            --event-path "$EVENT_PATH" \
            --repository "$REPOSITORY" \
            --manifest-path "$MANIFEST_PATH" \
            --target-ref "$TARGET_REF" \
            --output persistence-plan.json
      - name: Materialize updated manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          plan = json.loads(Path('persistence-plan.json').read_text(encoding='utf-8'))
          if plan['outcome'] != 'PLANNED':
              raise SystemExit(f"persistence plan was not PLANNED: {plan}")
          target = Path(plan['plan']['target']['manifest_path'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(plan['plan']['manifest']['content'], encoding='utf-8')
      - name: Validate materialized manifest
        run: python scripts/validate_feature_manifest.py state/features/F-SMOKE.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ai-sdlc-persistence-smoke-plan
          path: persistence-plan.json
