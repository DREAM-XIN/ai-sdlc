name: Validate v0.3 Live Launch Cancel Pair

on:
  pull_request:
    branches:
      - main
      - verification/v03-live-lost-ack-persist-sequence-221
    paths:
      - '.github/workflows/v03-live-launch-cancel-pair-validation.yml'
      - 'scripts/v03_launch_cancel_live_runner.py'
      - 'scripts/validate_v03_launch_cancel_live_runner.py'
      - 'scripts/v03_effect_safety_live_ledger_launch_cancel.py'
      - 'scripts/validate_v03_launch_cancel_orchestration.py'
      - 'scripts/v03_live_evidence_provenance.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile live launch/cancel pair runner and ledger adapter
        run: python -m py_compile scripts/v03_launch_cancel_live_runner.py scripts/validate_v03_launch_cancel_live_runner.py scripts/v03_effect_safety_live_ledger_launch_cancel.py
      - name: Prove shared-effect cancellation fences and strict pair evidence
        run: PYTHONPATH=scripts python scripts/validate_v03_launch_cancel_live_runner.py
      - name: Re-run frozen deterministic launch/cancel orchestration
        run: PYTHONPATH=scripts python scripts/validate_v03_launch_cancel_orchestration.py
