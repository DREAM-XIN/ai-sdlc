name: Cancel Obsolete Public Audit

on:
  push:
    branches:
      - chore/public-settings-snapshot
    paths:
      - '.github/workflows/cancel-obsolete-public-audit.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded full audit run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          run_id = 31294321384
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel',
              data=b'',
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'ai-sdlc-obsolete-audit-cancel',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  if response.status not in {202, 204}:
                      raise RuntimeError(f'unexpected cancellation status {response.status}')
          except urllib.error.HTTPError as error:
              if error.code == 409:
                  print('Superseded audit was already completed; no cancellation needed.')
              else:
                  raise
          PY
