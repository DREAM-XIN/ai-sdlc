  push:
    branches:
      - verification/v0.3-real-runtime-effect-safety-221
    paths:
      - '.github/workflows/v03-effect-safety-deterministic-support.yml'
      - '.github/workflows/v03-real-runtime-full-preflight.yml'
      - 'scripts/v03_effect_safety_matrix.py'
      - 'scripts/v03_effect_safety_matrix_extended.py'
      - 'scripts/v03_effect_safety_matrix_full_support.py'
      - 'scripts/v03_effect_safety_matrix_release_support.py'
      - 'scripts/v03_effect_safety_release_scenarios.py'
      - 'scripts/v03_effect_safety_release_evidence.py'
      - 'scripts/validate_v03_effect_safety_release_evidence.py'
      - 'scripts/v03_real_runtime_prerequisites.py'
      - 'scripts/v03_real_runtime_full_preflight.py'
      - 'scripts/run_v03_real_runtime_full_preflight.py'
      - 'scripts/run_v03_callback_orchestration_support.py'
      - 'scripts/validate_v03_real_runtime_full_preflight.py'
      - 'scripts/v03_real_runtime_fault_injection.py'
      - 'scripts/validate_v03_real_runtime_fault_injection.py'
      - 'scripts/v03_real_runtime_lost_ack_orchestration.py'
      - 'scripts/validate_v03_real_runtime_lost_ack_orchestration.py'
      - 'scripts/validate_v03_launch_cancel_orchestration.py'
      - 'scripts/validate_v03_persist_cancel_orchestration.py'
      - 'scripts/validate_v03_unknown_takeover_orchestration.py'
      - 'scripts/validate_v03_persist_ack_loss_orchestration.py'
      - 'scripts/validate_v03_concurrent_resume_orchestration.py'
      - 'scripts/validate_v03_callback_orchestration.py'
      - 'scripts/validate_operator_github_actions_transport.py'
      - 'scripts/operator_vertical.py'
      - 'scripts/operator_vertical_callback.py'
      - 'scripts/operator_vertical_executor.py'
      - 'scripts/operator_vertical_reconcile.py'
      - 'scripts/operator_store.py'
      - 'scripts/operator_store_model.py'
      - 'scripts/operator_store_git.py'
      - 'scripts/operator_vertical_recovery.py'
      - 'scripts/operator_vertical_store.py'
      - 'scripts/operator_effect_lineage_integration.py'
      - 'scripts/operator_effect_lineage_fences.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v03-effect-safety-deterministic-support.yml'
      - '.github/workflows/v03-real-runtime-full-preflight.yml'
      - 'scripts/v03_effect_safety_matrix.py'
      - 'scripts/v03_effect_safety_matrix_extended.py'
      - 'scripts/v03_effect_safety_matrix_full_support.py'
      - 'scripts/v03_effect_safety_matrix_release_support.py'
