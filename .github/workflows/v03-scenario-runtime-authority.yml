name: Validate v0.3 Scenario Runtime Authority

on:
  pull_request:
    branches:
      - main
      - verification/v03-live-launch-cancel-pair-221
    paths:
      - '.github/workflows/v03-scenario-runtime-authority.yml'
      - 'scripts/v03_scenario_runtime_composition.py'
      - 'scripts/v03_scenario_runtime_preflight.py'
      - 'scripts/validate_v03_scenario_runtime_authority.py'
      - 'scripts/v03_scenario_fixture_pool.py'
      - 'scripts/v03_real_runtime_live_authority.py'
      - 'scripts/operator_v03_reviewer_worker_readiness.py'
      - 'scripts/operator_v03_write_runtime.py'
      - 'scripts/operator_release_feature_event_gateway.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile closed scenario runtime authority
        run: >-
          python -m py_compile
          scripts/v03_scenario_runtime_composition.py
          scripts/v03_scenario_runtime_preflight.py
          scripts/validate_v03_scenario_runtime_authority.py
      - name: Prove all and only nine slots bind exact production authority without launch
        run: PYTHONPATH=scripts python scripts/validate_v03_scenario_runtime_authority.py
