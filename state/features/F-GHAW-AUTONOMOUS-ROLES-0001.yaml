tasks:
- id: F-GHAW-AUTONOMOUS-ROLES-0001-DESIGN-REMEDIATION-1
  kind: remediation
  stage: design
  role: architect
  source_stage: design-review
  feedback: Define a deterministic draft implementation-candidate artifact produced
    by trusted autonomous Developer result persistence, bind it to PR/head evidence,
    preserve/manual coexistence and supersession semantics, and make Reviewer PASS
    resolve/approve that trusted candidate artifact without hard-coded implementation
    artifact ids.
  status: DONE
  runtime: manual
- id: F-GHAW-AUTONOMOUS-ROLES-0001-CODE-REMEDIATION-1
  kind: remediation
  stage: implementation
  role: developer
  source_stage: code-review
  feedback: Bind autonomous Gate-result ingestion to the exact trusted role-worker
    execution provenance. Carry trusted task identity into the Gate worker, pass exact
    control-repository Actions run/workflow identity to the collector, verify that
    run/workflow against the trusted role-worker registry before accepting the Safe
    Output comment, validate result task_id against trusted dispatch identity, and
    add wrong-task/wrong-run/wrong-workflow/Bot-comment-only fail-closed regressions
    without changing candidate SHA, read-only worker, provider routing, Developer
    compatibility, or Gate authority semantics.
  status: DONE
  runtime: manual
