name: AI-SDLC Persist Feature Event

on:
  push:
    paths:
      - 'state/events/**/*.yaml'
      - 'state/events/**/*.yml'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository path to the Feature Manifest
        required: true
        type: string
      event_path:
        description: "Event inbox path: state/events/<feature-id>/<event-id>.yaml"
        required: true
        type: string
      target_ref:
        description: Existing branch/ref to update
        required: true
        type: string
      feature_issue:
        description: Optional Feature Issue number for status output
        required: false
        type: string
      dry_run:
        description: Generate and validate the plan without pushing changes
        required: true
        default: true
        type: boolean
      allow_default_branch:
        description: Explicitly allow persistence directly to the repository default branch
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: runtime
          persist-credentials: false
      - name: Checkout target workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
          path: workspace
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r runtime/requirements-dev.txt

      - name: Resolve automatic Feature Event push
        id: auto
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python runtime/scripts/resolve_feature_event_push.py \
            --repo-dir workspace \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve persistence request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTO_MODE: ${{ steps.auto.outputs.mode }}
          AUTO_EVENT_PATH: ${{ steps.auto.outputs.event_path }}
          AUTO_MANIFEST_PATH: ${{ steps.auto.outputs.manifest_path }}
          AUTO_EVENT_COUNT: ${{ steps.auto.outputs.event_count }}
          MANUAL_EVENT_PATH: ${{ inputs.event_path }}
          MANUAL_MANIFEST_PATH: ${{ inputs.manifest_path }}
          MANUAL_TARGET_REF: ${{ inputs.target_ref }}
          MANUAL_FEATURE_ISSUE: ${{ inputs.feature_issue }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_ALLOW_DEFAULT_BRANCH: ${{ inputs.allow_default_branch }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            {
              echo "mode=$AUTO_MODE"
              echo "event_path=$AUTO_EVENT_PATH"
              echo "manifest_path=$AUTO_MANIFEST_PATH"
              echo "target_ref=$PUSH_REF"
              echo "feature_issue="
              echo "dry_run=false"
              echo "allow_default_branch=false"
              echo "event_count=$AUTO_EVENT_COUNT"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "mode=persist"
              echo "event_path=$MANUAL_EVENT_PATH"
              echo "manifest_path=$MANUAL_MANIFEST_PATH"
              echo "target_ref=$MANUAL_TARGET_REF"
              echo "feature_issue=$MANUAL_FEATURE_ISSUE"
              echo "dry_run=$MANUAL_DRY_RUN"
              echo "allow_default_branch=$MANUAL_ALLOW_DEFAULT_BRANCH"
              echo "event_count=1"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report already-applied Feature Event archive
        if: ${{ steps.request.outputs.mode == 'noop' }}
        shell: bash
        env:
          EVENT_COUNT: ${{ steps.request.outputs.event_count }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
        run: |
          echo "No persistence mutation required."
          echo "$EVENT_COUNT Feature Event file(s) changed on $TARGET_REF and every Event is already recorded at its exact applied revision slot."

      - name: Protect default branch and validate paths
        if: ${{ steps.request.outputs.mode != 'noop' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.request.outputs.manifest_path }}
          EVENT_PATH: ${{ steps.request.outputs.event_path }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_DEFAULT_BRANCH: ${{ steps.request.outputs.allow_default_branch }}
        run: |
          if [[ "$TARGET_REF" == "$DEFAULT_BRANCH" && "$ALLOW_DEFAULT_BRANCH" != "true" ]]; then
            echo "Refusing direct persistence to default branch without allow_default_branch=true"
            exit 1
          fi
          PYTHONPATH=runtime/scripts python - <<'PY'
          import os
          from pathlib import PurePosixPath
          from github_persistence import validate_manifest_path

          manifest = os.environ['MANIFEST_PATH']
          error = validate_manifest_path(manifest)
          if error:
              raise SystemExit(error)

          event = PurePosixPath(os.environ['EVENT_PATH'])
          if event.is_absolute() or '..' in event.parts:
              raise SystemExit('event_path must be repository-relative without parent traversal')
          if len(event.parts) != 4 or event.parts[:2] != ('state', 'events') or event.suffix not in {'.yaml', '.yml'}:
              raise SystemExit('event_path must match state/events/<feature-id>/<event-id>.yaml')
          expected_manifest = PurePosixPath('state', 'features', f'{event.parts[2]}.yaml').as_posix()
          if manifest != expected_manifest:
              raise SystemExit(f'manifest_path must match event feature id: expected {expected_manifest}')
          PY
          test -f "workspace/$MANIFEST_PATH"
          test -f "workspace/$EVENT_PATH"

      - name: Validate inbox event and build persistence plan
        if: ${{ steps.request.outputs.mode != 'noop' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.request.outputs.manifest_path }}
          EVENT_PATH: ${{ steps.request.outputs.event_path }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          FEATURE_ISSUE: ${{ steps.request.outputs.feature_issue }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(
            "workspace/$MANIFEST_PATH"
            "workspace/$EVENT_PATH"
            --event-path "$EVENT_PATH"
            --repository "$REPOSITORY"
            --manifest-path "$MANIFEST_PATH"
            --target-ref "$TARGET_REF"
            --output persistence-plan.json
          )
          if [[ -n "$FEATURE_ISSUE" ]]; then
            if [[ ! "$FEATURE_ISSUE" =~ ^[0-9]+$ ]]; then
              echo "feature_issue must be numeric"
              exit 1
            fi
            args+=(--issue "$FEATURE_ISSUE")
          fi
          python runtime/scripts/ingest_feature_event.py "${args[@]}"
      - name: Materialize updated manifest
        if: ${{ steps.request.outputs.mode != 'noop' }}
        shell: python
        run: |
          import json
          from pathlib import Path
          plan = json.loads(Path('persistence-plan.json').read_text(encoding='utf-8'))
          if plan['outcome'] != 'PLANNED':
              raise SystemExit('persistence plan was not PLANNED')
          target = Path('workspace') / plan['plan']['target']['manifest_path']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(plan['plan']['manifest']['content'], encoding='utf-8')
      - name: Validate materialized manifest
        if: ${{ steps.request.outputs.mode != 'noop' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.request.outputs.manifest_path }}
        run: python runtime/scripts/validate_feature_manifest.py "workspace/$MANIFEST_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.request.outputs.mode != 'noop' }}
        with:
          name: ai-sdlc-persistence-plan
          path: persistence-plan.json
      - name: Commit and push
        if: ${{ steps.request.outputs.mode != 'noop' && steps.request.outputs.dry_run != 'true' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.request.outputs.manifest_path }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_DEFAULT_BRANCH: ${{ steps.request.outputs.allow_default_branch }}
        run: |
          precondition_args=(
            --repo-dir workspace
            --target-ref "$TARGET_REF"
            --default-branch "$DEFAULT_BRANCH"
          )
          if [[ "$ALLOW_DEFAULT_BRANCH" == "true" ]]; then
            precondition_args+=(--allow-default-branch)
          fi
          python runtime/scripts/verify_git_write_precondition.py "${precondition_args[@]}"

          git -C workspace config user.name "ai-sdlc[bot]"
          git -C workspace config user.email "ai-sdlc[bot]@users.noreply.github.com"
          git -C workspace add -- "$MANIFEST_PATH"
          if git -C workspace diff --cached --quiet; then
            echo "No manifest changes to persist"
            exit 0
          fi
          git -C workspace commit -m "chore(ai-sdlc): persist feature event"
          git -C workspace push origin "HEAD:$TARGET_REF"
