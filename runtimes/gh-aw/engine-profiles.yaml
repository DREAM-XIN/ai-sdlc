# Provider workers inherit lifecycle/remediation behavior and effective model audit pins from the canonical worker source.
# Materialization trigger for F-GHAW-DOMESTIC-PROVIDERS-0001; not intended for Feature branch transfer.
version: 0.1.0
profiles:
  copilot:
    engine: copilot
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker.md
    worker_workflow: ai-sdlc-gh-aw-worker.lock.yml
    credential: COPILOT_GITHUB_TOKEN
    maturity: reference
  codex:
    engine: codex
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker-codex.md
    worker_workflow: ai-sdlc-gh-aw-worker-codex.lock.yml
    credential: OPENAI_API_KEY
    credential_aliases:
      - CODEX_API_KEY
    maturity: reference
  claude:
    engine: claude
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker-claude.md
    worker_workflow: ai-sdlc-gh-aw-worker-claude.lock.yml
    credential: ANTHROPIC_API_KEY
    maturity: reference
  gemini:
    engine: gemini
    engine_version: "0.52.0"
    model: gemini-3.5-flash-lite
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker-gemini.md
    worker_workflow: ai-sdlc-gh-aw-worker-gemini.lock.yml
    credential: GEMINI_API_KEY
    maturity: reference
  deepseek:
    engine: copilot
    provider: deepseek
    protocol: openai-compatible
    provider_type: openai
    wire_api: completions
    base_url: https://api.deepseek.com
    network_host: api.deepseek.com
    model: deepseek-chat
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker-deepseek.md
    worker_workflow: ai-sdlc-gh-aw-worker-deepseek.lock.yml
    credential: DEEPSEEK_API_KEY
    maturity: experimental
  qwen:
    engine: copilot
    provider: qwen
    protocol: openai-compatible
    provider_type: openai
    wire_api: completions
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    network_host: dashscope.aliyuncs.com
    model: qwen3.7-plus
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker-qwen.md
    worker_workflow: ai-sdlc-gh-aw-worker-qwen.lock.yml
    credential: DASHSCOPE_API_KEY
    maturity: experimental
  glm:
    engine: copilot
    provider: glm
    protocol: openai-compatible
    provider_type: openai
    wire_api: completions
    base_url: https://open.bigmodel.cn/api/paas/v4
    network_host: open.bigmodel.cn
    model: glm-5.2
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker-glm.md
    worker_workflow: ai-sdlc-gh-aw-worker-glm.lock.yml
    credential: ZHIPUAI_API_KEY
    maturity: experimental
  minimax:
    engine: copilot
    provider: minimax
    protocol: openai-compatible
    provider_type: openai
    wire_api: completions
    base_url: https://api.minimaxi.com/v1
    network_host: api.minimaxi.com
    model: MiniMax-M2.7
    worker_source: .github/workflows/ai-sdlc-gh-aw-worker-minimax.md
    worker_workflow: ai-sdlc-gh-aw-worker-minimax.lock.yml
    credential: MINIMAX_API_KEY
    maturity: experimental
