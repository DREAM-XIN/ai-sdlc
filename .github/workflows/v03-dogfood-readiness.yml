name: v0.3 Real Dogfood Readiness
on:
  workflow_dispatch:

env:
    HAS_COPILOT_GITHUB_TOKEN: ${{ github.token != '' }}
    HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    HAS_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY != '' }}
    HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    HAS_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    HAS_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY != '' }}
    HAS_ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY != '' }}
    HAS_MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY != '' }}

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt

      - name: Inspect presence and reverify immutable upstream evidence without effects
        env:
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
          HAS_AI_SDLC_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN != '' }}
          HAS_RUNTIME_APP_CLIENT_ID: ${{ vars.AI_SDLC_DOGFOOD_RECOVERY_APP_CLIENT_ID != '' }}
          HAS_RUNTIME_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_DOGFOOD_RECOVERY_APP_PRIVATE_KEY != '' }}
          HAS_LEGACY_RUNTIME_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY != '' }}
          HAS_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID != '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence
          PYTHONPATH=scripts python - <<'PY'
          import json, os
          from pathlib import Path
          from v03_dogfood_live_gate import assemble_dogfood_live_gate, public_gate
          required = {
              "DEEPSEEK_API_KEY": "HAS_AI_SDLC_DEEPSEEK_API_KEY",
              "AI_SDLC_OPERATOR_ADMIN_TOKEN": "HAS_OPERATOR_ADMIN_TOKEN",
              "AI_SDLC_DOGFOOD_RECOVERY_APP_CLIENT_ID": "HAS_RUNTIME_APP_CLIENT_ID",
              "AI_SDLC_DOGFOOD_RECOVERY_APP_PRIVATE_KEY": "HAS_RUNTIME_APP_PRIVATE_KEY",
              "AI_SDLC_OPERATOR_APP_INTEGRATION_ID": "HAS_OPERATOR_APP_INTEGRATION_ID",
          }
          missing = [name for name, signal in required.items() if os.environ.get(signal) != "true"]
          result = dict(schema_version="ai-sdlc.v03-dogfood-readiness/v1", missing_configuration=missing,
                        installation_commit_sha=os.environ["GITHUB_SHA"], model_called=False,
                        worker_dispatched=False, operator_store_mutated=False, release_eligible=False)
          try:
              gate = assemble_dogfood_live_gate(scenario="happy_path", env=os.environ,
                                                checkout_sha=os.environ["GITHUB_SHA"])
              result["upstream_gate"] = public_gate(gate)
              result["status"] = "READY" if not missing else "BLOCKED_CONFIGURATION"
          except Exception as exc:
              result["status"] = "BLOCKED_UPSTREAM"
              result["upstream_error"] = str(exc)

          # Read-only diagnostics for the frozen unresolved dispatch. These are
          # observations, never external-effect invalidation or release authority.
          # READ_ONLY_ACTIONS_DIAGNOSTIC_BEGIN
          from collections import Counter
          from urllib import request, error, parse

          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def make_actions_get(token, opener=None):
              safe_opener = opener or request.build_opener(NoRedirect())
              def actions_get(suffix):
                  req = request.Request(
                      "https://api.github.com/repos/DREAM-XIN/ai-sdlc" + suffix,
                      method="GET",
                  )
                  req.add_header("Authorization", "Bearer " + token)
                  req.add_header("Accept", "application/vnd.github+json")
                  req.add_header("X-GitHub-Api-Version", "2022-11-28")
                  try:
                      with safe_opener.open(req, timeout=20) as response:
                          return response.status, json.load(response)
                  except error.HTTPError as exc:
                      return exc.code, None
                  except Exception:
                      return None, None
              return actions_get

          def scan_actions_runs(actions_get, max_pages=20):
              ids, rows, reported_count = [], [], None
              for page in range(1, max_pages + 1):
                  status, payload = actions_get(
                      "/actions/runs?event=workflow_dispatch&per_page=100&page=" + str(page)
                  )
                  if status != 200 or not isinstance(payload, dict):
                      return dict(complete=False, ids=ids, rows=rows, count=reported_count,
                                  error=dict(page=page, reason="http_or_payload_error",
                                             http_status=status))
                  page_rows, current_count = payload.get("workflow_runs"), payload.get("total_count")
                  if not isinstance(page_rows, list) or type(current_count) is not int or current_count < 0:
                      return dict(complete=False, ids=ids, rows=rows, count=reported_count,
                                  error=dict(page=page, reason="malformed_collection"))
                  if reported_count is None:
                      reported_count = current_count
                  if current_count != reported_count:
                      return dict(complete=False, ids=ids, rows=rows, count=reported_count,
                                  error=dict(page=page, reason="changing_total_count"))
                  page_ids = []
                  for row in page_rows:
                      if not isinstance(row, dict) or type(row.get("id")) is not int:
                          return dict(complete=False, ids=ids, rows=rows, count=reported_count,
                                      error=dict(page=page, reason="malformed_run"))
                      page_ids.append(row["id"])
                  if len(set(page_ids)) != len(page_ids) or any(run_id in ids for run_id in page_ids):
                      return dict(complete=False, ids=ids, rows=rows, count=reported_count,
                                  error=dict(page=page, reason="duplicate_run_ids"))
                  ids.extend(page_ids)
                  rows.extend(page_rows)
                  if len(ids) == reported_count:
                      return dict(complete=True, ids=ids, rows=rows, count=reported_count, error=None)
                  if not page_rows or len(ids) > reported_count:
                      return dict(complete=False, ids=ids, rows=rows, count=reported_count,
                                  error=dict(page=page, reason="incomplete_collection"))
              return dict(complete=False, ids=ids, rows=rows, count=reported_count,
                          error=dict(page=max_pages, reason="page_cap_exhausted"))

          def diagnose_dispatch(bindings, external_dispatch_key, actions_get, max_pages=20):
              diagnostic = dict(
                  external_dispatch_key=external_dispatch_key,
                  credential_source="github.token",
                  read_only=True,
                  release_eligible=False,
                  resolution_authority=False,
                  workflow_registration=[],
                  matching_runs=[],
                  mismatched_runs=[],
                  collection_complete=False,
              )
              candidates = []
              for binding in bindings:
                  workflow = binding.worker_workflow
                  expected_path = ".github/workflows/" + workflow
                  status, metadata = actions_get(
                      "/actions/workflows/" + parse.quote(workflow, safe="")
                  )
                  workflow_id = metadata.get("id") if isinstance(metadata, dict) else None
                  observed_path = metadata.get("path") if isinstance(metadata, dict) else None
                  resolved = (
                      status == 200
                      and type(workflow_id) is int
                      and workflow_id > 0
                      and observed_path == expected_path
                  )
                  record = dict(
                      role=binding.role,
                      workflow=workflow,
                      expected_path=expected_path,
                      http_status=status,
                      workflow_id=workflow_id,
                      observed_path=observed_path,
                      state=metadata.get("state") if isinstance(metadata, dict) else None,
                      binding_valid=False,
                  )
                  if not resolved:
                      record["binding_error"] = "registration_not_exact"
                  diagnostic["workflow_registration"].append(record)
                  if resolved:
                      candidates.append((workflow_id, observed_path, record))
              pair_counts = Counter((workflow_id, path) for workflow_id, path, _ in candidates)
              allowed = set()
              for workflow_id, path, record in candidates:
                  if pair_counts[(workflow_id, path)] == 1:
                      record["binding_valid"] = True
                      allowed.add((workflow_id, path))
                  else:
                      record["binding_error"] = "ambiguous_registration"

              first = scan_actions_runs(actions_get, max_pages=max_pages)
              second = scan_actions_runs(actions_get, max_pages=max_pages)
              diagnostic["scan_passes"] = [
                  dict(complete=scan["complete"], observed_run_count=len(scan["ids"]),
                       reported_run_count=scan["count"], error=scan["error"])
                  for scan in (first, second)
              ]
              stable = (
                  first["complete"]
                  and second["complete"]
                  and first["count"] == second["count"]
                  and first["ids"] == second["ids"]
              )
              if not stable:
                  diagnostic["collection_error"] = dict(reason="unstable_or_incomplete_collection")
                  return diagnostic

              diagnostic["collection_complete"] = True
              diagnostic["observed_run_count"] = len(second["ids"])
              diagnostic["reported_run_count"] = second["count"]
              title = "AI-SDLC gh-aw " + external_dispatch_key
              selected_fields = (
                  "id", "workflow_id", "path", "event", "head_branch",
                  "head_sha", "status", "conclusion",
              )
              for row in second["rows"]:
                  if row.get("display_title") != title:
                      continue
                  selected = {field: row.get(field) for field in selected_fields}
                  identity = (row.get("workflow_id"), row.get("path"))
                  if identity in allowed and row.get("event") == "workflow_dispatch":
                      diagnostic["matching_runs"].append(selected)
                  else:
                      selected["mismatch_reason"] = "workflow_identity_or_event_mismatch"
                      diagnostic["mismatched_runs"].append(selected)
              return diagnostic
          # READ_ONLY_ACTIONS_DIAGNOSTIC_END

          actions_get = make_actions_get(os.environ["AI_SDLC_ACTIONS_READ_TOKEN"])
          key = "dispatch-d774674fa60b1708668a28ff73c43fe4334eebe1"
          bindings = gate.bindings if "gate" in locals() else ()
          result["dispatch_diagnostic"] = diagnose_dispatch(bindings, key, actions_get)
          # Historical Worker failure alone never proves recovery. Require
          # immutable GitHub-provenanced old-401/new-200 facts AND the old
          # signing Secret's removal before claiming readiness to ATTEMPT the
          # separately fenced protected-CAS recovery. No Worker or Store write.
          from v03_dogfood_runtime_driver import (
              observe_historical_worker_for_review, _load_pinned_revocation_observation,
          )
          try:
              result["historical_worker_observation"] = observe_historical_worker_for_review(
                  actions_read_token=os.environ["AI_SDLC_ACTIONS_READ_TOKEN"],
              )
              result["recovery_error"] = "bounded recovery still requires independently verified provider revocation"
              if result["status"] == "READY":
                  if os.environ.get("HAS_LEGACY_RUNTIME_APP_PRIVATE_KEY") != "false":
                      result["status"] = "BLOCKED_LEGACY_CREDENTIAL"
                      result["recovery_error"] = "legacy App private-key Secret must be deleted before bounded recovery"
                  else:
                      proof = _load_pinned_revocation_observation(os.environ)
                      result["provider_revocation_run_id"] = proof["run_id"]
                      result["recovery_error"] = "none"
                      # READY means only that a separately protected live
                      # recovery may perform its own fresh checks and CAS.
          except Exception as exc:
              result["recovery_error"] = str(exc)
              if result["status"] == "READY":
                  result["status"] = "BLOCKED_RECOVERY_EVIDENCE"
          result["worker_provider_coverage"] = [
              dict(role=row.role, selected_profile=row.selected_profile,
                   deepseek_in_frozen_candidates="deepseek" in row.candidate_order)
              for row in bindings
          ]

          Path("evidence/readiness.json").write_text(json.dumps(result, indent=2, sort_keys=True)+"\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-dogfood-readiness
          path: evidence/readiness.json
          if-no-files-found: error
      - name: Publish readiness receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '"<!-- ai-sdlc-v03-dogfood-readiness -->\nDogfood readiness: **" + .status + "**\nMain: `" + .installation_commit_sha + "`\nMissing configuration: " + (.missing_configuration | join(", ")) + "\nUpstream error: " + (.upstream_error // "none") + "\nRecovery blocker: " + (.recovery_error // "none") + "\nNo model, Worker, Store or lifecycle effects were executed."' evidence/readiness.json > evidence/receipt.md
          gh issue comment 239 --repo "$GITHUB_REPOSITORY" --body-file evidence/receipt.md
          jq -e '.status == "READY"' evidence/readiness.json >/dev/null
