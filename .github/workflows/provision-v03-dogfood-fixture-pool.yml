name: Provision trusted v0.3 dogfood fixture pool

on:
  workflow_dispatch:

permissions: {}

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject non-main dogfood fixture provisioning
        run: |
          echo 'v0.3 dogfood fixture provisioning is authorized only from refs/heads/main.' >&2
          exit 1

  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install trusted provisioning dependencies
        run: pip install -r requirements-dev.txt

      - name: Prove exact trusted-main checkout and closed inventory
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence
          PYTHONPATH=scripts python - <<'PY' > evidence/v03-dogfood-fixture-pool-inventory.json
          import json
          from v03_dogfood_fixture_pool import inventory_document
          print(json.dumps(inventory_document(), indent=2, sort_keys=True))
          PY

      - name: Provision or exactly resume all three fixed dogfood slots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=scripts python scripts/provision_v03_dogfood_fixture_pool.py
          test -s evidence/v03-dogfood-fixture-pool/pool.json

      - name: Upload durable dogfood fixture receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-dogfood-fixture-pool
          path: |
            evidence/v03-dogfood-fixture-pool-inventory.json
            evidence/v03-dogfood-fixture-pool/*.json
          if-no-files-found: warn

      - name: Publish bounded fixture-pool receipt to Issue 345
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import request

          path = Path('evidence/v03-dogfood-fixture-pool/pool.json')
          pool = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          lines = [
              '<!-- ai-sdlc-v03-dogfood-fixture-pool -->',
              f"Trusted-main v0.3 dogfood fixture pool job: **{os.environ['JOB_STATUS']}**",
              f"Run: `{os.environ['RUN_ID']}`",
              f"Provisioning head: `{os.environ['HEAD_SHA']}`",
          ]
          if pool:
              lines += [
                  f"Pool profile: `{pool.get('pool_profile', '')}`",
                  f"Slot count: `{pool.get('slot_count', '')}`",
                  f"Inventory digest: `{pool.get('inventory_digest', '')}`",
                  f"Slot receipt digest: `{pool.get('slot_receipt_digest', '')}`",
                  f"Model calls during provisioning: `{pool.get('model_call_count', '')}`",
                  f"Worker launches during provisioning: `{pool.get('worker_launch_count', '')}`",
                  f"Operator Store semantic mutations during provisioning: `{pool.get('operator_store_semantic_mutation_count', '')}`",
                  'Release eligible: **false** — fixture provisioning is prerequisite evidence only.',
              ]
          else:
              lines.append('No complete pool receipt was retained; no dogfood slot is accepted as release evidence.')
          payload = json.dumps({'body': '\n'.join(lines)}).encode()
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          req = request.Request(
              f"{api}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/345/comments",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=20) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(1)
          PY
