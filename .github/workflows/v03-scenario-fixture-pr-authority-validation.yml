name: Validate v0.3 Fixture PR Authority

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/provision-v03-real-runtime-fixture.yml'
      - '.github/workflows/v03-scenario-fixture-pr-authority-validation.yml'
      - 'scripts/v03_real_runtime_fixture_pr_authority.py'
      - 'scripts/validate_v03_real_runtime_fixture_pr_authority.py'
      - 'scripts/validate_v03_real_runtime_fixture_provisioner.py'
      - 'scripts/provision_v03_scenario_fixture_pool.py'
      - 'scripts/validate_v03_scenario_fixture_pool.py'
      - 'scripts/validate_v03_scenario_fixture_pr_authority.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile fixed and scenario fixture PR authority surfaces
        run: >-
          python -m py_compile
          scripts/v03_real_runtime_fixture_pr_authority.py
          scripts/validate_v03_real_runtime_fixture_pr_authority.py
          scripts/provision_v03_scenario_fixture_pool.py
          scripts/validate_v03_scenario_fixture_pr_authority.py
      - name: Prove original fixed-fixture PR recovery/create authority fails closed
        run: PYTHONPATH=scripts python scripts/validate_v03_real_runtime_fixture_pr_authority.py
      - name: Re-run complete original fixed-fixture provisioner validation
        run: PYTHONPATH=scripts python scripts/validate_v03_real_runtime_fixture_provisioner.py
      - name: Prove scenario fixture PR recovery/create authority fails closed
        run: PYTHONPATH=scripts python scripts/validate_v03_scenario_fixture_pr_authority.py
      - name: Re-run complete bounded scenario fixture pool validation
        run: PYTHONPATH=scripts python scripts/validate_v03_scenario_fixture_pool.py
