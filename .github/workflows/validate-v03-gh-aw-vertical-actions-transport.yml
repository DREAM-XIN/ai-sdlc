name: Validate Trusted v0.3 Vertical gh-aw Actions Transport

on:
  pull_request:
    paths:
      - "scripts/operator_vertical_gh_aw.py"
      - "scripts/operator_vertical_gh_aw_actions_transport.py"
      - "scripts/validate_operator_vertical_gh_aw_actions_transport.py"
      - "scripts/validate_operator_vertical_gh_aw_actions_transport_preflight.py"
      - ".github/workflows/validate-v03-gh-aw-vertical-actions-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=scripts python scripts/validate_operator_vertical_gh_aw_actions_transport.py
      - run: PYTHONPATH=scripts python scripts/validate_operator_vertical_gh_aw_actions_transport_preflight.py
