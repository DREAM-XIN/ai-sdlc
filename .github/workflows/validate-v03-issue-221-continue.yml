name: Validate v0.3 Issue 221 Continuation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v03-issue-221-auto-continue.yml'
      - '.github/workflows/validate-v03-issue-221-continue.yml'
      - 'scripts/v03_issue_221_continue.py'
      - 'scripts/validate_v03_issue_221_continue.py'
      - 'scripts/v03_effect_safety_final_live_ledger.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile continuation driver
        run: python -m py_compile scripts/v03_issue_221_continue.py scripts/validate_v03_issue_221_continue.py
      - name: Validate resume and targeted scheduling without live effects
        run: PYTHONPATH=scripts python scripts/validate_v03_issue_221_continue.py
      - name: Verify final release evidence contract remains closed
        run: PYTHONPATH=scripts python scripts/validate_v03_effect_safety_final_live_ledger.py
