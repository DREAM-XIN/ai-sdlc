name: Validate v0.3 Dogfood Live Gate

on:
  pull_request:
    paths:
      - '.github/workflows/ai-sdlc-gh-aw-reviewer-deepseek-v03-bounded-local.md'
      - '.github/workflows/ai-sdlc-gh-aw-reviewer-deepseek-v03-bounded-local.lock.yml'
      - '.github/workflows/ai-sdlc-gh-aw-qa-deepseek-v03-bounded-local.md'
      - '.github/workflows/ai-sdlc-gh-aw-qa-deepseek-v03-bounded-local.lock.yml'
      - '.github/workflows/ai-sdlc-gh-aw-reviewer-deepseek-v03-release-local.md'
      - '.github/workflows/ai-sdlc-gh-aw-reviewer-deepseek-v03-release-local.lock.yml'
      - '.github/workflows/ai-sdlc-gh-aw-qa-deepseek-v03-release-local.md'
      - '.github/workflows/ai-sdlc-gh-aw-qa-deepseek-v03-release-local.lock.yml'
      - '.github/workflows/ai-sdlc-gh-aw-developer-deepseek-v03-local.md'
      - '.github/workflows/ai-sdlc-gh-aw-developer-deepseek-v03-local.lock.yml'
      - '.github/workflows/v03-dogfood-readiness.yml'
      - 'scripts/v03_dogfood_issue221_compatibility.py'
      - 'scripts/validate_v03_dogfood_issue221_compatibility.py'
      - 'release/v0.3-dogfood-session-policy.json'
      - 'scripts/v03_dogfood_session_policy.py'
      - 'scripts/validate_v03_dogfood_session_policy.py'
      - 'scripts/v03_dogfood_live_gate.py'
      - 'scripts/validate_v03_dogfood_live_gate.py'
      - 'scripts/v03_dogfood_fixture_pool.py'
      - 'scripts/validate_v03_dogfood_fixture_pool.py'
      - 'scripts/v03_dogfood_fixture_pr_authority.py'
      - 'scripts/provision_v03_dogfood_fixture.py'
      - 'scripts/v03_dogfood_full_composition.py'
      - 'scripts/v03_dogfood_runtime_preflight.py'
      - 'scripts/validate_v03_dogfood_runtime_composition.py'
      - 'scripts/v03_dogfood_openai_host.py'
      - 'scripts/validate_v03_dogfood_openai_host.py'
      - 'scripts/v03_dogfood_production_provenance.py'
      - 'scripts/validate_v03_dogfood_production_provenance.py'
      - 'scripts/v03_dogfood_scenario_runner.py'
      - 'scripts/validate_v03_dogfood_scenario_runner.py'
      - 'scripts/v03_dogfood_runtime_driver.py'
      - 'scripts/validate_v03_dogfood_runtime_driver.py'
      - 'scripts/v03_dogfood_release_finalizer.py'
      - 'scripts/validate_v03_dogfood_release_finalizer.py'
      - 'scripts/v03_dogfood_post_run_finalizer.py'
      - 'scripts/v03_dogfood_execution_bindings.py'
      - 'scripts/v03_effect_safety_final_live_ledger.py'
      - 'scripts/operator_openai_responses_production.py'
      - 'scripts/v03_dogfood_trusted_provenance.py'
      - 'scripts/validate_v03_dogfood_evidence.py'
      - 'runtimes/gh-aw/engine-profiles.yaml'
      - '.github/workflows/v03-real-dogfood-scenario.yml'
      - '.github/workflows/v03-finalize-real-dogfood-scenario.yml'
      - '.github/workflows/validate-v03-dogfood-live-gate.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Validate immutable Issue 221 evidence compatibility
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_issue221_compatibility.py
      - name: Validate closed real-dogfood upstream gate
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_live_gate.py
      - name: Validate exact default-branch session Decision policy
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_session_policy.py
      - name: Validate independent real-dogfood fixture pool
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_fixture_pool.py
      - name: Validate Responses-only real-dogfood production composition
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_runtime_composition.py
      - name: Validate bounded real OpenAI Responses dogfood host
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_openai_host.py
      - name: Validate bounded production dogfood scenario runner
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_scenario_runner.py
      - name: Setup pinned detector conclusion scripts
        uses: github/gh-aw-actions/setup@924af5fdc64061cfbf66fb584c8b07e2ac230c60
        with:
          destination: ${{ runner.temp }}/v03-detector-test-actions
      - name: Validate pinned detector semantic failures before Safe Outputs
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/v03-detector-test-actions/install_threat_detect_binary.sh" v0.5.2 --artifact-base-url https://github.com/github/gh-aw-threat-detection/releases/download --sha256-amd64 b4ecda6a8f1ee09913c40b58e5e9d3337d2173618d41b1bfdef9207e4e7959b9 --sha256-arm64 f6260a0f9ad72bcb67c7af19c4ce262ca34e2c3d5ccbf912832a8bd277200904 --rootless
          PYTHONPATH=scripts python - <<'PY'
          import os
          from pathlib import Path
          from validate_v03_dogfood_runtime_driver import recovery_pinned_detector_semantic_tests
          recovery_pinned_detector_semantic_tests(
              Path('.'), Path.home() / '.local/bin/threat-detect',
              Path(os.environ['RUNNER_TEMP']) / 'v03-detector-test-actions/conclude_threat_detection.sh',
          )
          PY
      - name: Validate trusted-main dogfood runtime driver
        if: ${{ !cancelled() }}
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_runtime_driver.py
      - name: Observe immutable historical Worker through read-only GitHub API
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json, os
          from pathlib import Path
          from v03_dogfood_runtime_driver import observe_historical_worker_for_review
          doc = observe_historical_worker_for_review(
              actions_read_token=os.environ["AI_SDLC_ACTIONS_READ_TOKEN"],
          )
          assert doc["recovery_authority"] is False and doc["future_attempts_fenced"] is False
          assert doc["provider_invalidation"] is False and doc["release_eligible"] is False
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/historical-worker-observation.json").write_text(
              json.dumps(doc, indent=2, sort_keys=True) + chr(10),
          )
          print(json.dumps(doc, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: v03-historical-worker-observation
          path: evidence/historical-worker-observation.json
          if-no-files-found: error
      - name: Validate trusted production dogfood provenance
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_production_provenance.py
      - name: Validate closed dogfood release-run finalizer
        run: PYTHONPATH=scripts python scripts/validate_v03_dogfood_release_finalizer.py
      - name: Validate trusted post-run finalizer imports
        run: PYTHONPATH=scripts python -m py_compile scripts/v03_dogfood_post_run_finalizer.py

      - name: Validate embedded read-only readiness diagnostic
        run: |
          python - <<'PY'
          import io
          import json
          from pathlib import Path
          from types import SimpleNamespace
          from urllib import error
          import yaml

          workflow = yaml.safe_load(Path(".github/workflows/v03-dogfood-readiness.yml").read_text())
          step = next(row for row in workflow["jobs"]["inspect"]["steps"]
                      if row.get("name") == "Inspect presence and reverify immutable upstream evidence without effects")
          source = step["run"].split("python - <<'PY'\n", 1)[1].rsplit("\nPY", 1)[0]
          compile(source, "readiness-diagnostic", "exec")
          pure = source.split("# READ_ONLY_ACTIONS_DIAGNOSTIC_BEGIN\n", 1)[1].split(
              "# READ_ONLY_ACTIONS_DIAGNOSTIC_END", 1
          )[0]
          namespace = {"json": json}
          exec(pure, namespace)
          NoRedirect = namespace["NoRedirect"]
          make_actions_get = namespace["make_actions_get"]
          scan_actions_runs = namespace["scan_actions_runs"]
          diagnose_dispatch = namespace["diagnose_dispatch"]

          assert NoRedirect().redirect_request(None, None, 302, "redirect", {}, "https://example.invalid") is None

          class Response(io.BytesIO):
              status = 200
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  self.close()

          class RecordingOpener:
              def __init__(self, payload=None, exc=None):
                  self.payload, self.exc, self.requests = payload, exc, []
              def open(self, req, timeout):
                  self.requests.append((req, timeout))
                  if self.exc:
                      raise self.exc
                  return Response(json.dumps(self.payload).encode())

          token = "diagnostic-test-token"
          opener = RecordingOpener({"ok": True})
          assert make_actions_get(token, opener)("/probe") == (200, {"ok": True})
          req, timeout = opener.requests[0]
          assert req.get_method() == "GET" and req.data is None and timeout == 20
          assert req.full_url.endswith("/probe")
          assert token in req.get_header("Authorization")
          http_error = error.HTTPError("https://example.invalid", 403, "private-error", {},
                                       io.BytesIO(b"private-response-body"))
          failure = make_actions_get(token, RecordingOpener(exc=http_error))("/probe")
          assert failure == (403, None)
          assert token not in repr(failure) and "private-response-body" not in repr(failure)

          binding = SimpleNamespace(role="Developer", worker_workflow="worker.yml")
          registration = {"id": 77, "path": ".github/workflows/worker.yml", "state": "active"}
          key = "dispatch-test"
          def reader_for(scans, registration_payload=registration, registration_status=200):
              pages = list(scans)
              def read(suffix):
                  if suffix.startswith("/actions/workflows/"):
                      return registration_status, registration_payload
                  assert pages, "unexpected scan request"
                  return 200, pages.pop(0)
              return read

          exact = {"id": 10, "workflow_id": 77, "path": ".github/workflows/worker.yml",
                   "event": "workflow_dispatch", "display_title": "AI-SDLC gh-aw " + key,
                   "head_branch": "main", "head_sha": "a" * 40, "status": "completed",
                   "conclusion": "success"}
          stable = [{"total_count": 1, "workflow_runs": [exact]},
                    {"total_count": 1, "workflow_runs": [dict(exact)]}]
          result = diagnose_dispatch([binding], key, reader_for(stable))
          assert result["collection_complete"] is True
          assert [row["id"] for row in result["matching_runs"]] == [10]
          assert result["mismatched_runs"] == []
          assert result["resolution_authority"] is False and result["release_eligible"] is False

          collision = dict(exact, id=11, workflow_id=88, path=".github/workflows/other.yml")
          result = diagnose_dispatch(
              [binding], key,
              reader_for([{"total_count": 1, "workflow_runs": [collision]},
                          {"total_count": 1, "workflow_runs": [dict(collision)]}]),
          )
          assert result["matching_runs"] == []
          assert result["mismatched_runs"][0]["mismatch_reason"] == "workflow_identity_or_event_mismatch"

          malformed = lambda suffix: (200, {"total_count": "1", "workflow_runs": []})
          assert scan_actions_runs(malformed)["complete"] is False
          duplicate_payload = {"total_count": 2, "workflow_runs": [exact, dict(exact)]}
          assert scan_actions_runs(lambda suffix: (200, duplicate_payload))["error"]["reason"] == "duplicate_run_ids"

          changing_pages = iter([
              (200, {"total_count": 2, "workflow_runs": [exact]}),
              (200, {"total_count": 3, "workflow_runs": [dict(exact, id=12)]}),
          ])
          changed = scan_actions_runs(lambda suffix: next(changing_pages))
          assert changed["error"]["reason"] == "changing_total_count"

          capped = scan_actions_runs(
              lambda suffix: (200, {"total_count": 2, "workflow_runs": [exact]}),
              max_pages=1,
          )
          assert capped["error"]["reason"] == "page_cap_exhausted"

          drift_a, drift_b = dict(exact, id=20), dict(exact, id=21)
          drift = diagnose_dispatch(
              [binding], key,
              reader_for([{"total_count": 1, "workflow_runs": [drift_a]},
                          {"total_count": 1, "workflow_runs": [drift_b]}]),
          )
          assert drift["collection_complete"] is False
          assert drift["collection_error"]["reason"] == "unstable_or_incomplete_collection"

          empty = diagnose_dispatch(
              [binding], key,
              reader_for([{"total_count": 0, "workflow_runs": []},
                          {"total_count": 0, "workflow_runs": []}]),
          )
          assert empty["collection_complete"] is True and empty["matching_runs"] == []
          assert empty["resolution_authority"] is False and empty["release_eligible"] is False

          unresolved = diagnose_dispatch(
              [binding], key,
              reader_for([{"total_count": 1, "workflow_runs": [exact]},
                          {"total_count": 1, "workflow_runs": [dict(exact)]}],
                         registration_payload=None, registration_status=404),
          )
          assert unresolved["matching_runs"] == [] and len(unresolved["mismatched_runs"]) == 1
          assert unresolved["workflow_registration"][0]["binding_valid"] is False
          print("Readiness diagnostic security and stability tests: PASS")
          PY

  compile-recovery-developer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned recovery compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.89.21 --force
      - name: Strict compile fixed recovery Developer source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile ai-sdlc-gh-aw-developer-deepseek-v03-local --strict
      - name: Export mechanically hardened recovery lock
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          path = Path(".github/workflows/ai-sdlc-gh-aw-developer-deepseek-v03-local.lock.yml")
          raw = path.read_bytes()
          upstream = raw.decode()
          metadata = json.loads(upstream.splitlines()[0].split(": ", 1)[1])
          assert metadata["compiler_version"] == "v0.89.21" and metadata["strict"] is True
          source = path.with_suffix("").with_suffix(".md").read_text()
          body_hash = hashlib.sha256(source.split("\n---\n", 1)[1].rstrip("\n").encode()).hexdigest()
          assert metadata["body_hash"] == body_hash
          trigger = "          GH_AW_CI_TRIGGER_TOKEN: $" + "{{ secrets.GH_AW_CI_TRIGGER_TOKEN }}\n"
          # Inspected compiler input text, never a checkout setting in this workflow.
          old_persist_scalar = "persist-credentials: " + str(True).lower()
          replacements = [
              (',"GH_AW_CI_TRIGGER_TOKEN"', "", 1),
              ("#   - GH_AW_CI_TRIGGER_TOKEN\n", "", 1),
              (trigger, "", 1),
              (old_persist_scalar, "persist-credentials: false", 2),
          ]
          hardened = upstream
          for old, new, count in replacements:
              assert hardened.count(old) == count, (old, hardened.count(old), count)
              hardened = hardened.replace(old, new)
          assert "GH_AW_CI_TRIGGER_TOKEN" not in hardened
          assert old_persist_scalar not in hardened
          upstream_blob = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          proof = {
              "schema": "ai-sdlc.v03-recovery-lock-transform/v1",
              "compiler": "gh-aw-v0.89.21-strict", "upstream_blob_sha": upstream_blob,
              "persist_credentials_false": 2, "removed_trigger_lines": 3,
              "removed_trigger_references": 4,
              "body_hash_from": body_hash, "body_hash_to": body_hash,
          }
          lines = hardened.splitlines(keepends=True)
          lines.insert(1, "# ai-sdlc-recovery-lock-transform: " + json.dumps(proof, separators=(",", ":")) + "\n")
          hardened = "".join(lines).encode()
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/recovery-developer.upstream.lock.yml").write_bytes(raw)
          Path("evidence/recovery-developer.hardened.lock.yml").write_bytes(hardened)
          Path("evidence/recovery-developer-transform.json").write_text(json.dumps(proof, indent=2) + "\n")
          print("RECOVERY_COMPILER_PROOF=" + json.dumps(proof, sort_keys=True))
          print("RECOVERY_LOCK_BASE64=" + base64.b64encode(hardened).decode())
          checked_in = subprocess.check_output(["git", "show", "HEAD:" + str(path)])
          assert checked_in == hardened, "checked-in recovery lock differs from strict compiled hardening"
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v03-recovery-developer-compiled
          path: evidence/recovery-developer*
          if-no-files-found: error

  compile-release-gates:
    strategy:
      fail-fast: false
      matrix:
        role: [reviewer, qa]
    env:
      GATE_ROLE: ${{ matrix.role }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned release Gate compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.89.21 --force
      - name: Strict compile fixed release Gate source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GATE_ROLE" in reviewer|qa) ;; *) exit 1 ;; esac
          gh aw compile "ai-sdlc-gh-aw-$GATE_ROLE-deepseek-v03-release-local" --strict
      - name: Export mechanically hardened release Gate lock
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          role = os.environ["GATE_ROLE"]
          assert role in {"reviewer", "qa"}
          path = Path(f".github/workflows/ai-sdlc-gh-aw-{role}-deepseek-v03-release-local.lock.yml")
          raw = path.read_bytes()
          upstream = raw.decode()
          metadata = json.loads(upstream.splitlines()[0].split(": ", 1)[1])
          assert metadata["compiler_version"] == "v0.89.21" and metadata["strict"] is True
          source = path.with_suffix("").with_suffix(".md").read_text()
          body_hash = hashlib.sha256(source.split("\n---\n", 1)[1].rstrip("\n").encode()).hexdigest()
          assert metadata["body_hash"] == body_hash
          assert "GH_AW_CI_TRIGGER_TOKEN" not in upstream
          # Inspected compiler input text, never a checkout setting in this workflow.
          old_persist_scalar = "persist-credentials: " + str(True).lower()
          assert old_persist_scalar not in upstream
          checkout_scalars = re.findall(r"(?m)^\s+persist-credentials: ([^\n]+)$", upstream)
          assert checkout_scalars and all(value == "false" for value in checkout_scalars)
          replacements = []
          hardened = upstream
          for old, new, count in replacements:
              assert hardened.count(old) == count, (old, hardened.count(old), count)
              hardened = hardened.replace(old, new)
          assert "GH_AW_CI_TRIGGER_TOKEN" not in hardened
          assert old_persist_scalar not in hardened
          upstream_blob = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          proof = {
              "schema": "ai-sdlc.v03-release-gate-lock-transform/v1",
              "compiler": "gh-aw-v0.89.21-strict", "upstream_blob_sha": upstream_blob,
              "persist_credentials_false": 0, "removed_trigger_lines": 0,
              "removed_trigger_references": 0,
              "body_hash_from": body_hash, "body_hash_to": body_hash,
          }
          lines = hardened.splitlines(keepends=True)
          lines.insert(1, "# ai-sdlc-release-gate-lock-transform: " + json.dumps(proof, separators=(",", ":")) + "\n")
          hardened = "".join(lines).encode()
          Path("evidence").mkdir(exist_ok=True)
          Path(f"evidence/release-{role}.upstream.lock.yml").write_bytes(raw)
          Path(f"evidence/release-{role}.hardened.lock.yml").write_bytes(hardened)
          Path(f"evidence/release-{role}-transform.json").write_text(json.dumps(proof, indent=2) + "\n")
          print("RELEASE_GATE_COMPILER_PROOF=" + json.dumps(proof, sort_keys=True))
          print("RELEASE_GATE_LOCK_BASE64=" + base64.b64encode(hardened).decode())
          checked_in = subprocess.check_output(["git", "show", "HEAD:" + str(path)])
          assert checked_in == hardened, "checked-in release Gate lock differs from strict compiled hardening"
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v03-release-${{ matrix.role }}-compiled
          path: evidence/release-${{ matrix.role }}*
          if-no-files-found: error

  compile-bounded-gates:
    strategy:
      fail-fast: false
      matrix:
        role: [reviewer, qa]
    env:
      GATE_ROLE: ${{ matrix.role }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Install pinned bounded Gate compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.89.21 --force
      - name: Strict compile fixed bounded Gate source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GATE_ROLE" in reviewer|qa) ;; *) exit 1 ;; esac
          gh aw compile "ai-sdlc-gh-aw-$GATE_ROLE-deepseek-v03-bounded-local" --strict
      - name: Derive and verify exact bounded Gate lock
        run: |
          python3 - <<'PY'
          import base64, copy, hashlib, json, os, shlex, subprocess
          from pathlib import Path
          import yaml, jsonschema, urllib.request
          role = os.environ["GATE_ROLE"]
          assert role in {"reviewer", "qa"}
          path = Path(f".github/workflows/ai-sdlc-gh-aw-{role}-deepseek-v03-bounded-local.lock.yml")
          raw = path.read_bytes()
          upstream = raw.decode()
          metadata = json.loads(upstream.splitlines()[0].split(": ", 1)[1])
          assert metadata["compiler_version"] == "v0.89.21" and metadata["strict"] is True
          source = path.with_suffix("").with_suffix(".md").read_text()
          body_hash = hashlib.sha256(source.split("\n---\n", 1)[1].rstrip("\n").encode()).hexdigest()
          assert metadata["body_hash"] == body_hash
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  assert key not in result, "duplicate JSON key"
                  result[key] = value
              return result
          workflow = yaml.safe_load(upstream)
          steps = workflow["jobs"]["detection"]["steps"]
          engines = [s for s in steps if s.get("id") == "detection_agentic_execution"]
          assert len(engines) == 1
          engine = engines[0]
          env = engine["env"]
          assert str(env["GH_AW_HARNESS_MAX_RETRIES"]) == "0"
          assert env["COPILOT_MODEL"] == "deepseek-chat"
          assert env["COPILOT_PROVIDER_BASE_URL"] == "https://api.deepseek.com"
          assert env["COPILOT_PROVIDER_TYPE"] == "openai" and env["COPILOT_PROVIDER_WIRE_API"] == "completions"
          assert "threat-detect --engine copilot --retries 0 --output " in engine["run"]
          installs = [s for s in steps if "install_copilot_cli.sh" in s.get("run", "")]
          assert len(installs) == 1
          assert shlex.split(installs[0]["run"]) == ["bash", "$"+"{RUNNER_TEMP}/gh-aw/actions/install_copilot_cli.sh", "1.0.90"]
          lines = engine["run"].splitlines()
          assert sum(line.startswith("awf --config ") for line in lines) == 1
          config_lines = []
          for line in lines:
              if not line.startswith("printf "):
                  continue
              words = shlex.split(line)
              if len(words) >= 2 and words[-2:] == [">", "$"+"{RUNNER_TEMP}/gh-aw/awf-config.json"]:
                  config_lines.append(line)
          assert len(config_lines) == 1
          old_line = config_lines[0]
          def parse_config(line):
              tokens = shlex.split(line)
              assert len(tokens) == 5 and tokens[:2] == ["printf", r"%s\n"]
              assert tokens[3:] == [">", "$"+"{RUNNER_TEMP}/gh-aw/awf-config.json"]
              literal = tokens[2]
              credit = "$"+"{GH_AW_MAX_AI_CREDITS}"
              assert literal.count(credit) == 1
              assert literal.count(r"\$schema") == 1
              decoded = literal.replace(credit, "400").replace(r"\$schema", "$schema")
              assert "$"+"{" not in decoded and "$(" not in decoded
              return json.loads(decoded, object_pairs_hook=unique)
          original_config = parse_config(old_line)
          assert type(original_config["apiProxy"]["maxRuns"]) is int and original_config["apiProxy"]["maxRuns"] == 500
          assert "maxTurns" not in original_config["apiProxy"]
          # This byte delta is admitted only after strict structural decoding of this unique detector config.
          old_token, new_token = r'\"maxRuns\":500,', r'\"maxRuns\":50,'
          assert old_line.count(old_token) == 1
          new_line = old_line.replace(old_token, new_token, 1)
          derived_config = parse_config(new_line)
          expected_config = copy.deepcopy(original_config)
          expected_config["apiProxy"]["maxRuns"] = 50
          assert derived_config == expected_config and type(derived_config["apiProxy"]["maxRuns"]) is int
          assert type(derived_config["apiProxy"]["maxRuns"]) is not bool
          url = "https://raw.githubusercontent.com/github/gh-aw-firewall/744bd7387c4ae8a6c2d38200f6f63a781804e892/src/awf-config-schema.json"
          with urllib.request.urlopen(url, timeout=30) as response:
              schema_bytes = response.read(1048577)
          assert len(schema_bytes) <= 1048576
          assert hashlib.sha1(b"blob " + str(len(schema_bytes)).encode() + b"\0" + schema_bytes).hexdigest() == "f2938160535d5611a44b45d8e0ff1bff69d60832"
          schema = json.loads(schema_bytes, object_pairs_hook=unique)
          jsonschema.validate(original_config, schema)
          jsonschema.validate(derived_config, schema)
          assert upstream.count(old_line) == 1
          derived = upstream.replace(old_line, new_line, 1)
          parsed_derived = yaml.safe_load(derived)
          expected_workflow = copy.deepcopy(workflow)
          expected_engine = next(s for s in expected_workflow["jobs"]["detection"]["steps"] if s.get("id") == "detection_agentic_execution")
          assert expected_engine["run"].count(old_line) == 1
          expected_engine["run"] = expected_engine["run"].replace(old_line, new_line, 1)
          assert parsed_derived == expected_workflow
          assert derived.count(new_line) == 1 and derived.replace(new_line, old_line, 1).encode() == raw
          assert "GH_AW_CI_TRIGGER_TOKEN" not in derived
          for job in parsed_derived["jobs"].values():
              for step in job.get("steps", []):
                  if str(step.get("uses", "")).startswith("actions/checkout@"):
                      assert step["with"]["persist-credentials"] is False
          upstream_blob = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          proof = {
              "schema": "ai-sdlc.v03-bounded-gate-lock-transform/v1",
              "compiler": "gh-aw-v0.89.21-strict",
              "upstream_blob_sha": upstream_blob,
              "upstream_sha256": hashlib.sha256(raw).hexdigest(),
              "body_hash": body_hash,
              "detector_native_max_runs_from": 500,
              "detector_native_max_runs_to": 50,
              "detector_cli_version": "1.0.90",
              "cli_version_origin": "compiler-derived",
              "allowed_delta": "unique detection AWF apiProxy.maxRuns integer only",
              "inverse_raw_equal": True,
          }
          out_lines = derived.splitlines(keepends=True)
          out_lines.insert(1, "# ai-sdlc-bounded-gate-lock-transform: " + json.dumps(proof, separators=(",", ":")) + "\n")
          hardened = "".join(out_lines).encode()
          Path("evidence").mkdir(exist_ok=True)
          Path(f"evidence/bounded-{role}.upstream.lock.yml").write_bytes(raw)
          Path(f"evidence/bounded-{role}.derived.lock.yml").write_bytes(hardened)
          Path(f"evidence/bounded-{role}-transform.json").write_text(json.dumps(proof, indent=2) + "\n")
          print("BOUNDED_GATE_COMPILER_PROOF=" + json.dumps(proof, sort_keys=True))
          print("BOUNDED_GATE_LOCK_BASE64=" + base64.b64encode(hardened).decode())
          checked_in = subprocess.check_output(["git", "show", "HEAD:" + str(path)])
          assert checked_in == hardened, "checked-in bounded Gate lock differs from exact compiler-derived transform"
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-bounded-${{ matrix.role }}-compiled
          path: evidence/bounded-${{ matrix.role }}*
          if-no-files-found: error
