status_taxonomy:
  unresolved:
    meaning: required capability is not yet implemented or not proven at the required bounded scope
  implemented-awaiting-release-evidence:
    meaning: reviewed implementation or Feature evidence exists, but required release-level integration, real-runtime, or dogfood proof is still missing
  resolved-by-feature-evidence:
    meaning: durable independently reviewed Feature evidence fully closes this blocker at the exact scope represented by the blocker
  resolved-by-release-dogfood:
    meaning: durable release-level end-to-end or fault-injection evidence closes this blocker

