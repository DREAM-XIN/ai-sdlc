version: 0.3.0
status: planning
base_version: 0.2.0
tracking_issue: '#205'
final_manifest: release/v0.3.0.yaml

release_theme: ai-operated-sdlc
canonical_api_version: ai-sdlc.operator/v1
operation_event_version: ai-sdlc.operation-event/v1

release_intent: >-
  Productize the existing deterministic AI-SDLC control kernel behind a
  durable, typed AI Operator surface so users can operate an installed Feature
  through natural-language AI clients without moving lifecycle authority into
  the model, worker, client session, or Operator store.

required_release_slice:
  starting_condition: installed-project-with-eligible-feature
  lifecycle:
    - ai-client-capability-discovery-status-and-inbox
    - durable-operation-start-or-discovery
    - developer
    - independent-code-review
    - durable-review-remediation-when-required
    - independent-re-review
    - qa-verification
    - needs-user-or-done
  user_experience:
    repeated_continue_messages_required: false
    routine_manual_github_operations_after_installation: false
    session_survival_required: true
    prior_operation_id_required_for_new_session_discovery: false

canonical_tool_surface:
  - system.capabilities
  - project.inspect
  - feature.status
  - operator.inbox
  - operation.start
  - operation.status
  - operation.resume
  - operation.cancel
  - decision.list
  - decision.respond
  - notification.list
  - notification.ack

required_workstreams:
  - id: operator-canonical-api-and-clients
    status: proposed
    includes:
      - exact-api-version-ai-sdlc-operator-v1
      - capability-discovery
      - operator-inbox-new-session-discovery
      - structured-error-model
      - actor-client-service-identity-separation
      - expected-revision-contract
      - semantic-idempotency-contract
      - mcp-read-only-bootstrap
      - release-slice-write-capable-client-adapter
      - second-independent-client-integration
      - tool-schema-and-conformance-tests

  - id: durable-operation-store
    status: proposed
    includes:
      - protected-trusted-control-plane-state-ref
      - append-only-versioned-operation-events
      - deterministic-operation-projection
      - git-ref-cas-writer
      - active-operation-claim
      - semantic-dispatch-claim
      - callback-correlation
      - cancellation-and-orphan-result-handling
      - operation-recovery

  - id: operator-vertical-loop
    status: proposed
    includes:
      - developer-dispatch
      - trusted-developer-result-translation
      - independent-reviewer-dispatch
      - trusted-review-verdict-translation
      - durable-developer-remediation
      - independent-re-review
      - qa-dispatch
      - trusted-verification-verdict-translation

  - id: operator-recovery-and-concurrency
    status: proposed
    includes:
      - stale-revision-reread-and-replan
      - duplicate-request-suppression
      - duplicate-callback-suppression
      - callback-order-safety
      - active-operation-race-safety
      - semantic-dispatch-race-safety
      - worker-timeout-policy
      - ci-failure-remediation
      - pr-head-change-invalidation
      - persist-ack-loss-recovery
      - cancellation-callback-race-safety
      - concurrent-resume-safety

  - id: operator-decisions-authorization-notifications
    status: proposed
    includes:
      - bounded-decision-object
      - exact-revision-ref-sha-policy-authorization-binding
      - trusted-authorization-policy-resolution
      - concurrent-decision-response-safety
      - operation-cancel-feature-cancel-separation
      - notification-outbox
      - notification-ack
      - new-session-discovery

  - id: v0-3-planning-manifest-validation
    status: proposed
    includes:
      - deterministic-v0-3-draft-contract
      - repository-ci-validation

worker_result_contract:
  trusted_context_owner: trusted-runtime-or-collector
  trusted_context:
    - operation-id
    - dispatch-id
    - target-repository
    - feature-id
    - expected-revision
    - target-ref
    - task-id
    - role
    - runtime-receipt-identity
  worker_payload:
    - status
    - artifacts
    - evidence
    - findings
    - role-specific-payload
  worker_may_override_trusted_context: false
  arbitrary_executable_feature_events: forbidden
  trusted_translation_required: true
  translator_rules_worker_controlled: false
  required_translators:
    - developer-result-translator
    - review-verdict-translator
    - verification-verdict-translator

authorization_model:
  trusted_sources:
    - protected-default-branch-configuration
    - installation-level-configuration
    - trusted-control-repository-policy
  feature_branch_can_tighten: true
  feature_branch_can_expand: false
  policy_change_requires_independent_review: true
  generic_natural_language_approval_is_sufficient: false
  decision_binding:
    - decision-id
    - decision-type
    - feature-id
    - operation-id-when-applicable
    - expected-revision
    - target-ref
    - candidate-head-sha-when-applicable
    - allowed-choice
    - trusted-policy-ref-or-digest
    - responder-user-identity
    - responder-client-identity
    - expiry
  consume_time_policy_recheck_required: true

operation_store:
  authority: trusted-control-repository
  target_feature_branch_storage: forbidden
  reference_state_ref: refs/heads/ai-sdlc-operator-state
  state_ref_selection_source: trusted-installation-or-control-policy
  state_ref_writer: trusted-operator-collector-recovery-only
  git_ref_compare_and_set_required: true
  append_only_journal: required
  immutable_operation_events: required
  deterministic_projection: required
  schema_version: ai-sdlc.operation-event/v1
  conceptual_layout:
    operations: state/operator/v1/operations/<operation-id>/events/
    dispatch_claims: state/operator/v1/claims/dispatch/
    active_feature_claims: state/operator/v1/claims/feature/
    decisions: state/operator/v1/decisions/
    notifications: state/operator/v1/notifications/
    projections: state/operator/v1/projections/

operation_model:
  lifecycle_authority: false
  long_lived_chat_dependency: forbidden
  execution_style: short-execution-plus-event-driven-resume
  active_operation_invariant: >-
    For one target repository and Feature, at most one nonterminal active
    Operation generation may own automatic progression unless a trusted atomic
    supersession records and fences the prior generation.
  semantic_dispatch_invariant: >-
    For one target repository, Feature, revision, stage, semantic task, role and
    operation generation, at most one active valid Worker dispatch may exist.
  semantic_dispatch_claim_before_worker_launch: required
  top_level_states:
    - RUNNING
    - WAITING_EXTERNAL
    - NEEDS_USER
    - BLOCKED
    - DONE
    - CANCELLED
  terminal_states:
    - DONE
    - CANCELLED
  suspended_recoverable_states:
    - BLOCKED
  waiting_external:
    - WAITING_WORKER
    - WAITING_CI
    - WAITING_PR
    - WAITING_CALLBACK
  needs_user:
    - NEEDS_CLARIFICATION
    - NEEDS_AUTHORIZATION
    - NEEDS_ACCEPTANCE
    - NEEDS_CREDENTIAL_SETUP

cancellation_model:
  operation_cancel_is_feature_cancel: false
  post_cancel_new_dispatch: forbidden
  late_worker_receipt_recording: allowed-for-audit
  late_worker_result_auto_translation_or_persist: forbidden
  late_worker_result_disposition: orphaned
  previously_confirmed_persist_remains_authoritative: true

notification_outbox:
  required: true
  required_types:
    - decision.requested
    - operation.blocked
    - operation.completed
    - authorization.expiring
  acknowledgement_capability: notification.ack
  new_session_discovery:
    - unfinished-operations
    - pending-decisions
    - unread-notifications

acceptance_policy:
  default_standard_feature:
    ai_recommendation_allowed: true
    ai_recommendation_is_human_acceptance_evidence: false
    human_product_decision_required: true

required_tests:
  tool_contract:
    - exact-api-version
    - unsupported-version-response
    - capability-discovery
    - operator-inbox-without-prior-operation-id
    - invalid-schema-rejection
    - structured-error-codes
    - idempotency
    - expected-revision-rejection
  authorization_adversarial:
    - feature-policy-expansion-rejected
    - broader-credential-scope-rejected
    - developer-gate-pass-rejected
    - reviewer-prohibited-write-rejected
    - stale-authorization-replay-rejected
    - wrong-ref-authorization-replay-rejected
    - wrong-sha-merge-authorization-rejected
    - expired-decision-rejected
    - concurrent-decision-response-single-consumption
  operation_replay_and_concurrency:
    - duplicate-callback
    - out-of-order-callback
    - duplicate-worker-completion
    - active-operation-claim-race
    - concurrent-runner-dispatch-claim-race
    - persist-success-response-loss
    - projection-rebuild
    - client-session-loss-and-resume
    - operation-cancel-worker-callback-race
    - orphaned-worker-result-no-auto-persist
    - unsafe-recovery-blocks-without-speculative-dispatch
  client_conformance:
    minimum_independent_paths: 2
    at_least_one_write_capable_ai_client_adapter: true
  planning_manifest:
    deterministic_ci_validation_required: true

required_dogfood:
  happy_path:
    status: pending
    requirement: vertical-loop-without-repeated-user-continue
  review_remediation:
    status: pending
    requirement: reviewer-change-request-through-remediation-re-review-and-qa
  session_recovery:
    status: pending
    requirement: new-session-discovers-durable-operation-and-user-items-without-prior-operation-id
  failure_injection:
    status: pending
    required_cases:
      - stale-revision
      - duplicate-callback
      - active-operation-race
      - dispatch-claim-race
      - operation-cancel-worker-callback-race
      - persist-acknowledgement-loss
  external_transport_matrix:
    status: pending-release-decision
    requirement: preserve-v0.2-public-private-trust-boundaries

