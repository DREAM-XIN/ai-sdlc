name: Materialize AI-SDLC gh-aw Worker Locks

# Dedicated gh-aw/compile-* branches exist only to materialize compiler-generated worker sources and lock files; pushing a trusted source/provider change here is the supported one-shot materialization path.
on:
  push:
    branches:
      - 'gh-aw/compile-*'
    paths:
      - '.github/workflows/ai-sdlc-gh-aw-worker.md'
      - '.github/workflows/ai-sdlc-gh-aw-worker-*.md'
      - '.github/workflows/materialize-gh-aw-worker-lock.yml'
      - 'runtimes/gh-aw/engine-profiles.yaml'
      - 'scripts/gh_aw_provider_registry.py'
      - 'scripts/render_gh_aw_workers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: pip install 'PyYAML>=6.0,<7'
      - name: Render all trusted engine workers
        run: python scripts/render_gh_aw_workers.py --all
      - name: Verify rendered sources with strict Registry load
        run: python scripts/render_gh_aw_workers.py --all --check
      - name: Install pinned gh-aw compiler
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: gh extension install github/gh-aw --pin v0.83.4 --force
      - name: Strict-compile every engine profile
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY' > /tmp/workers.txt
          from gh_aw_provider_registry import load_registry
          for profile in load_registry().profiles:
              source = profile.worker_source.split('/')[-1]
              if not source.endswith('.md'):
                  raise SystemExit('worker_source must end in .md')
              print(source[:-3])
          PY
          while IFS= read -r worker; do
            gh aw compile "$worker" --strict
          done < /tmp/workers.txt
      - name: Commit rendered sources and generated lock files
        run: |
          set -euo pipefail
          git config user.name "ai-sdlc[bot]"
          git config user.email "ai-sdlc[bot]@users.noreply.github.com"
          PYTHONPATH=scripts python - <<'PY' > /tmp/generated.txt
          from gh_aw_provider_registry import load_registry
          for profile in load_registry().profiles:
              if profile.profile_id != 'copilot':
                  print(profile.worker_source)
              print('.github/workflows/' + profile.worker_workflow)
          PY
          while IFS= read -r generated; do
            test -f "$generated"
            git add -- "$generated"
          done < /tmp/generated.txt
          if git diff --cached --quiet; then
            echo "Rendered worker sources and compiled lock files are already current."
            exit 0
          fi
          git commit -m "build(gh-aw): materialize trusted engine workers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
