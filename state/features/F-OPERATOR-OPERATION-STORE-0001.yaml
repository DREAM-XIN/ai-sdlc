tasks:
- id: F-OPERATOR-OPERATION-STORE-0001-REQ-REMEDIATION-1
  kind: remediation
  stage: requirement
  role: product
  source_stage: requirement-review
  feedback: Keep a trusted internal unfinished-Operation query primitive, but do not
    make canonical operator.inbox available while Decision/Notification backing is
    absent under the frozen all-three-arrays response schema; keep operator.inbox
    CAPABILITY_UNAVAILABLE until a later reviewed workstream can satisfy complete
    semantics or an independently approved canonical partial-availability contract
    exists.
  status: DONE
  runtime: manual
- id: F-OPERATOR-OPERATION-STORE-0001-DESIGN-REMEDIATION-1
  kind: remediation
  stage: design
  role: architect
  source_stage: design-review
  feedback: Define a trusted fail-closed production boundary that verifies/provisions
    actual protection for the Operator state ref before semantic writes are enabled,
    including safe first-ref initialization and protected/unprotected/unknown tests;
    and redesign semantic reservations plus consumed feature/dispatch claims so each
    durable artifact is immutable after creation, with evolving launch/receipt/callback/takeover/release/Persist
    state represented by immutable Operation journal events (or equivalently immutable
    records), leaving only projection cache replaceable.
  status: DONE
  runtime: manual
- id: F-OPERATOR-OPERATION-STORE-0001-CODE-REMEDIATION-1
  kind: remediation
  stage: implementation
  role: developer
  source_stage: code-review
  feedback: Replace the local-only Operator state-ref writer with a real durable remote
    control-repository CAS path that reads the exact remote state ref, writes only
    against that expected SHA, re-fetches and semantically re-plans on remote conflict,
    and proves persistence across fresh checkout/concurrent writers; add a concrete
    trusted production protection verifier that proves the exact remote state ref
    is protected from repository/ruleset authority, fails closed as UNKNOWN/UNPROTECTED
    on ambiguity/absence, and cannot be substituted by the StaticProtectionVerifier
    in the normal production write path.
  status: DONE
  runtime: manual
