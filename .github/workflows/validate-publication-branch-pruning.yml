name: Validate Publication Branch Pruning

on:
  pull_request:
    paths:
      - 'scripts/prune_publication_pr_branches.py'
      - '.github/workflows/validate-publication-branch-pruning.yml'
      - '.github/workflows/prune-merged-branches.yml'
      - '.github/branch-prune-trigger'

permissions:
  contents: read
  pull-requests: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/prune_publication_pr_branches.py --self-test

  live-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Configure read-authenticated origin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Compute live deletion plan without writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prune_publication_pr_branches.py
