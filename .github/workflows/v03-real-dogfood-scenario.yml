name: v0.3 Real Release Dogfood Scenario
run-name: v0.3 real dogfood ${{ inputs.scenario }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Frozen v0.3 real release dogfood scenario
        required: true
        type: choice
        options:
          - happy_path
          - review_remediation
          - session_recovery

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  dogfood:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate trusted installation and provider configuration
        env:
          ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          APP_CLIENT_ID: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.AI_SDLC_OPENAI_MODEL }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          test -n "${APP_CLIENT_ID:-}"
          test -n "${APP_PRIVATE_KEY:-}"
          case "${APP_INTEGRATION_ID:-}" in *[!0-9]*|'') exit 1 ;; esac
          test "$APP_INTEGRATION_ID" -gt 0
          test -n "${ANTHROPIC_API_KEY:-}${COPILOT_GITHUB_TOKEN:-}${GEMINI_API_KEY:-}"
          test -n "${OPENAI_API_KEY:-}"
          test -n "${OPENAI_MODEL:-}"

      - name: Create bounded Runtime App Feature Event token
        id: event-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.event-token.outputs.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt

      - name: Prove exact trusted-main checkout before mutation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Execute one frozen real dogfood scenario
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.event-token.outputs.app-slug }}
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
          AI_SDLC_EVENT_WRITE_TOKEN: ${{ steps.event-token.outputs.token }}
          AI_SDLC_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SDLC_OPENAI_MODEL: ${{ vars.AI_SDLC_OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_SDLC_DOGFOOD_OBSERVATION_PATH: evidence/v03-dogfood/${{ inputs.scenario }}-observation.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=scripts python scripts/v03_dogfood_runtime_driver.py --mode run --scenario "${{ inputs.scenario }}"
          test -s "evidence/v03-dogfood/${{ inputs.scenario }}-observation.json"
          jq -e '.release_eligible == false and .provenance_verified == false' "evidence/v03-dogfood/${{ inputs.scenario }}-observation.json" >/dev/null

      - name: Upload raw scenario observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-real-dogfood-${{ inputs.scenario }}
          path: evidence/v03-dogfood/
          if-no-files-found: warn

      - name: Publish non-authoritative run receipt to Issue 239
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SCENARIO: ${{ inputs.scenario }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path="evidence/v03-dogfood/${SCENARIO}-observation.json"
          operation_id=''
          final_status=''
          if [[ -s "$path" ]]; then
            operation_id=$(jq -r '.operation_id // ""' "$path")
            final_status=$(jq -r '.final_status // ""' "$path")
          fi
          gh issue comment 239 --repo "$GITHUB_REPOSITORY" --body "<!-- ai-sdlc-v03-real-dogfood -->
v0.3 real dogfood scenario \`$SCENARIO\`: **$JOB_STATUS**
Run: \`$RUN_ID\`
Trusted-main head: \`$HEAD_SHA\`
Operation: \`${operation_id:-unavailable}\`
Observed final state: \`${final_status:-unavailable}\`

This is a raw trusted-main execution receipt only. It is **not release evidence and not release-eligible** until the existing dogfood evidence contract plus independent production provenance verifier reconstruct and validate the exact candidate, workflow runs, runtime receipt, milestones, Decisions/Notifications, and persisted state."
