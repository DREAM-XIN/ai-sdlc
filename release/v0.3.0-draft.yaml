release_policy:
  keep_version_at_current_release_until_candidate_ready: true
  change_VERSION_during_planning: false
  create_release_candidate_manifest_during_planning: false
  require_green_repository_validation: true
  require_two_supported_ai_client_adapter_conformance: true
  require_one_write_capable_ai_client_adapter: true
  require_repeated_cross_repo_dogfood: true
  production_callers_pin_full_commit_sha: true

deferred_v0_3_x:
  - full-product-requirement-architecture-design-orchestration
  - broader-role-autonomy-beyond-release-slice
  - project-takeover-install-upgrade
  - enhanced-client-notification-delivery

deferred_later:
