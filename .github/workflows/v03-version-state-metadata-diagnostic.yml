name: v0.3 Exact Ruleset Version Metadata Diagnostic

on:
  push:
    branches:
      - diagnostics/v03-version-state-metadata-263

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/diagnostics/v03-version-state-metadata-263'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify exact-version state metadata without exposing values
        env:
          ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          OPERATOR_APP_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          RULESET_ID: '20775740'
          STATE_REF: refs/heads/ai-sdlc-operator-state
        shell: python
        run: |
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          token = os.environ['ADMIN_TOKEN']
          repository = os.environ['EXPECTED_REPOSITORY']
          app_id = int(os.environ['OPERATOR_APP_ID'])
          ruleset_id = int(os.environ['RULESET_ID'])
          state_ref = os.environ['STATE_REF']
          if not token or '/' not in repository or app_id <= 0:
              raise SystemExit('trusted diagnostic configuration missing')

          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ai-sdlc-v03-version-state-metadata-diagnostic',
          }

          def get(path):
              req = Request(f'{api}{path}', headers=headers, method='GET')
              try:
                  with urlopen(req, timeout=20) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except HTTPError as exc:
                  return exc.code, None
              except (URLError, TimeoutError, OSError, ValueError):
                  return 0, None

          detail_status, detail = get(f'/repos/{repository}/rulesets/{ruleset_id}?includes_parents=true')
          history_status, history = get(f'/repos/{repository}/rulesets/{ruleset_id}/history?per_page=1&page=1')
          if detail_status != 200 or history_status != 200 or not isinstance(history, list) or len(history) != 1:
              raise SystemExit('live detail/history unavailable')
          summary = history[0]
          version_id = summary.get('version_id') if isinstance(summary, dict) else None
          if not isinstance(version_id, int) or version_id <= 0:
              raise SystemExit('live version id unavailable')
          version_status, version = get(f'/repos/{repository}/rulesets/{ruleset_id}/history/{version_id}')
          state = version.get('state') if isinstance(version, dict) else None
          if version_status != 200 or not isinstance(state, dict):
              raise SystemExit('live exact-version state unavailable')

          authority = (
              'id', 'name', 'target', 'source_type', 'source',
              'enforcement', 'conditions', 'bypass_actors', 'rules',
          )
          known_metadata = ('created_at', 'updated_at', 'node_id', '_links')
          extra = [key for key in state if key not in authority]
          unknown_extra = [key for key in extra if key not in known_metadata]

          expected = {
              'id': ruleset_id,
              'name': 'AI-SDLC Operator Store Writer',
              'target': 'branch',
              'source_type': 'Repository',
              'source': repository,
              'enforcement': 'active',
              'conditions': {'ref_name': {'include': [state_ref], 'exclude': []}},
              'bypass_actors': [
                  {'actor_id': app_id, 'actor_type': 'Integration', 'bypass_mode': 'always'}
              ],
              'rules': [
                  {'type': 'creation'},
                  {'type': 'update', 'parameters': {'update_allows_fetch_and_merge': False}},
              ],
          }

          normalized = {field: state.get(field) for field in authority}
          if normalized.get('rules') == [{'type': 'creation'}, {'type': 'update'}]:
              normalized['rules'] = expected['rules']
          mismatch = [field for field in authority if normalized.get(field) != expected.get(field)]

          links = state.get('_links')
          evidence = {
              'schema': 'ai-sdlc.v03-version-state-metadata-diagnostic/v1',
              'detail_status': detail_status,
              'history_status': history_status,
              'version_status': version_status,
              'known_metadata_presence': {field: field in state for field in known_metadata},
              'created_at_shape': 'string' if isinstance(state.get('created_at'), str) else ('absent' if 'created_at' not in state else type(state.get('created_at')).__name__),
              'updated_at_shape': 'string' if isinstance(state.get('updated_at'), str) else ('absent' if 'updated_at' not in state else type(state.get('updated_at')).__name__),
              'node_id_shape': 'string' if isinstance(state.get('node_id'), str) else ('absent' if 'node_id' not in state else type(state.get('node_id')).__name__),
              'links_shape': (
                  'dict:self+html'
                  if isinstance(links, dict) and set(links) == {'self', 'html'}
                  else ('absent' if '_links' not in state else type(links).__name__)
              ),
              'extra_key_count': len(extra),
              'unknown_extra_key_count': len(unknown_extra),
              'authority_mismatch_fields_after_rules_normalization': mismatch,
              'detail_state_identity_matches': all(state.get(field) == detail.get(field) for field in authority if field != 'rules'),
              'raw_values_retained': False,
              'mutation_performed': False,
              'release_evidence': False,
          }
          print(json.dumps(evidence, sort_keys=True))
