name: Validate v0.3 Dispatch Recovery Trio

on:
  pull_request:
    branches:
      - main
      - verification/v03-scenario-runtime-authority-312
    paths:
      - '.github/workflows/v03-dispatch-recovery-trio-validation.yml'
      - '.github/workflows/v03-live-dispatch-recovery-trio.yml'
      - 'scripts/v03_scenario_runtime_driver.py'
      - 'scripts/v03_effect_safety_live_ledger_authority_set.py'
      - 'scripts/validate_v03_scenario_runtime_driver_and_authority_set.py'
      - 'scripts/v03_dispatch_recovery_live_runner.py'
      - 'scripts/validate_v03_dispatch_recovery_live_runner.py'
      - 'scripts/v03_scenario_runtime_composition.py'
      - 'scripts/v03_scenario_runtime_preflight.py'
      - 'scripts/v03_scenario_fixture_pool.py'
      - 'scripts/v03_effect_safety_live_ledger.py'
      - 'scripts/v03_effect_safety_live_ledger_launch_cancel.py'
      - 'scripts/v03_live_evidence_provenance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile #314 closed live support
        run: >-
          python -m py_compile
          scripts/v03_scenario_runtime_driver.py
          scripts/v03_effect_safety_live_ledger_authority_set.py
          scripts/validate_v03_scenario_runtime_driver_and_authority_set.py
          scripts/v03_dispatch_recovery_live_runner.py
          scripts/validate_v03_dispatch_recovery_live_runner.py
      - name: Prove closed scenario driver and multi-authority ledger
        run: PYTHONPATH=scripts python scripts/validate_v03_scenario_runtime_driver_and_authority_set.py
      - name: Prove dispatch/recovery fault wrappers are zero-effect and fail-closed
        run: PYTHONPATH=scripts python scripts/validate_v03_dispatch_recovery_live_runner.py
