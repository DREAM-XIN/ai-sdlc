name: Validate AI-SDLC gh-aw Worker Compile

on:
  pull_request:
    paths:
      - '.github/workflows/ai-sdlc-gh-aw-worker.md'
      - '.github/workflows/ai-sdlc-gh-aw-worker-*.md'
      - '.github/workflows/ai-sdlc-gh-aw-reviewer-*.md'
      - '.github/workflows/ai-sdlc-gh-aw-qa-*.md'
      - '.github/workflows/compile-gh-aw-worker.yml'
      - '.github/workflows/materialize-gh-aw-worker-lock.yml'
      - 'runtimes/gh-aw/engine-profiles.yaml'
      - 'runtimes/gh-aw/profile-routing.yaml'
      - 'runtimes/gh-aw/role-workers.yaml'
      - 'scripts/gh_aw_provider_registry.py'
      - 'scripts/gh_aw_role_workers.py'
      - 'scripts/render_gh_aw_workers.py'
      - 'scripts/render_gh_aw_role_workers.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.registry.outputs.workers }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Registry dependency
        run: pip install 'PyYAML>=6.0,<7'
      - name: Discover trusted workers from validated registries
        id: registry
        run: |
          PYTHONPATH=scripts python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from gh_aw_provider_registry import load_registry
          from gh_aw_role_workers import load_role_workers
          items=[]
          for profile in load_registry().profiles:
              items.append({'id':'profile-' + profile.profile_id,'kind':'profile','profile':profile.profile_id,'source':profile.worker_source,'lock':profile.worker_workflow})
          for worker in load_role_workers():
              items.append({'id':'role-' + worker.id,'kind':'role','profile':worker.profile,'source':worker.worker_source,'lock':worker.worker_workflow})
          items.append({
              'id':'local-reviewer-deepseek-v03',
              'kind':'local',
              'profile':'deepseek',
              'source':'.github/workflows/ai-sdlc-gh-aw-reviewer-deepseek-v03-local.md',
              'lock':'ai-sdlc-gh-aw-reviewer-deepseek-v03-local.lock.yml',
          })
          print('workers=' + json.dumps(items,separators=(',',':')))
          PY

  validate-compile:
    needs: discover
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.discover.outputs.workers) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: pip install 'PyYAML>=6.0,<7'
      - name: Verify trusted worker source
        env:
          KIND: ${{ matrix.worker.kind }}
          PROFILE: ${{ matrix.worker.profile }}
          SOURCE: ${{ matrix.worker.source }}
        run: |
          if [[ "$KIND" == "profile" ]]; then
            python scripts/render_gh_aw_workers.py --profile "$PROFILE" --check
          elif [[ "$KIND" == "role" ]]; then
            PYTHONPATH=scripts python scripts/render_gh_aw_role_workers.py --check
          else
            test -f "$SOURCE"
          fi
      - name: Install pinned gh-aw compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.89.21 --force
      - name: Compile worker with strict validation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.worker.source }}
        run: |
          source_name="${SOURCE##*/}"
          [[ "$source_name" == *.md ]]
          gh aw compile "${source_name%.md}" --strict
      - name: Verify expected lock path
        run: test -f ".github/workflows/${{ matrix.worker.lock }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-gh-aw-${{ matrix.worker.id }}-lock
          path: .github/workflows/${{ matrix.worker.lock }}


  # Temporary bootstrap job for this PR only; remove after the compiler-generated lock is committed.
  materialize-local-deepseek:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install 'PyYAML>=6.0,<7'
      - name: Install pinned gh-aw compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.89.21 --force
      - name: Strict-compile local DeepSeek Reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile "ai-sdlc-gh-aw-reviewer-deepseek-v03-local" --strict
      - name: Commit compiler-generated lock to PR head
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "ai-sdlc[bot]"
          git config user.email "ai-sdlc[bot]@users.noreply.github.com"
          git add .github/workflows/ai-sdlc-gh-aw-reviewer-deepseek-v03-local.lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(gh-aw): materialize local DeepSeek reviewer lock"
          git push origin "HEAD:$HEAD_REF"
