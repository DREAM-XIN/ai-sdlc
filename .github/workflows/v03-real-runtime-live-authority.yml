name: Validate v0.3 Real Runtime Live Authority

on:
  pull_request:
    branches:
      - main
      - verification/v03-full-runtime-composition-prep-221
    paths:
      - '.github/workflows/v03-real-runtime-live-authority.yml'
      - 'scripts/v03_real_runtime_live_authority.py'
      - 'scripts/validate_v03_real_runtime_live_authority.py'
      - 'scripts/v03_real_runtime_full_composition.py'
      - 'scripts/operator_vertical_policy_state.py'
      - 'scripts/operator_store_github_protection_v03_trusted.py'
      - 'scripts/postverify_v03_vertical_policy_state.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile trusted-main live authority bootstrap
        run: python -m py_compile scripts/v03_real_runtime_live_authority.py scripts/validate_v03_real_runtime_live_authority.py
      - name: Prove PR validation is zero-effect and fail-closed
        run: PYTHONPATH=scripts python scripts/validate_v03_real_runtime_live_authority.py
