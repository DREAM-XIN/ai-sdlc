name: Verify v0.3 Runtime App permission grants
run-name: "v0.3 Runtime App permission probe"
on:
  push:
    branches:
      - 'dogfood/gh-aw-diagnose-permissions-20261008'
    paths:
      - 'dogfood/gh-aw-diagnose.yaml'
permissions:
  contents: read
jobs:
  verify-permissions:
    if: github.repository == 'DREAM-XIN/ai-sdlc' && github.ref == 'refs/heads/dogfood/gh-aw-diagnose-permissions-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check presence of existing trusted Runtime App credentials
        env:
          HAS_CLIENT_ID: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          test "$HAS_CLIENT_ID" = true
          test "$HAS_PRIVATE_KEY" = true
      - name: Mint exact-repository token with existing Worker required permissions
        id: probe-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Record permission grant result without repository effects
        env:
          PROBE_TOKEN: ${{ steps.probe-token.outputs.token }}
          APP_SLUG: ${{ steps.probe-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.probe-token.outputs.installation-id }}
        run: |
          set -euo pipefail
          test -n "$PROBE_TOKEN"
          test "$APP_SLUG" = dream-xin-ai-sdlc-runtime-operator
          test "$INSTALLATION_ID" = 153325330
          echo 'Runtime App permission probe: PASS'
          echo 'Exact repository: DREAM-XIN/ai-sdlc'
          echo 'Contents, Issues, Pull requests: write grant accepted by GitHub'
          echo 'No model, Worker, Feature Event, Store write or release evidence was produced.'
