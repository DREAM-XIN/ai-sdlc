name: Provision trusted v0.3 scenario fixture pool

on:
  workflow_dispatch:

permissions: {}

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject non-main fixture pool provisioning
        run: |
          echo 'v0.3 scenario fixture pool provisioning is authorized only from refs/heads/main.' >&2
          exit 1

  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install trusted provisioning dependencies
        run: pip install -r requirements-dev.txt

      - name: Prove exact trusted-main checkout and closed inventory
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence
          PYTHONPATH=scripts python scripts/v03_scenario_fixture_pool.py > evidence/v03-scenario-fixture-pool-inventory.json

      - name: Provision or exactly resume all nine fixed fixture slots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=scripts python scripts/provision_v03_scenario_fixture_pool.py
          test -s evidence/v03-scenario-fixture-pool/pool.json

      - name: Upload durable pool receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-scenario-fixture-pool
          path: |
            evidence/v03-scenario-fixture-pool-inventory.json
            evidence/v03-scenario-fixture-pool/*.json
          if-no-files-found: warn

      - name: Publish bounded pool receipt to Issue 310
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import request

          pool_path = Path('evidence/v03-scenario-fixture-pool/pool.json')
          pool = json.loads(pool_path.read_text(encoding='utf-8')) if pool_path.is_file() else {}
          slot_files = sorted(Path('evidence/v03-scenario-fixture-pool').glob('[0-9][0-9]-*.json'))
          lines = [
              '<!-- ai-sdlc-v03-scenario-fixture-pool -->',
              f"Trusted-main v0.3 scenario fixture pool job: **{os.environ['JOB_STATUS']}**",
              f"Run: `{os.environ['RUN_ID']}`",
              f"Provisioning head: `{os.environ['HEAD_SHA']}`",
          ]
          if pool:
              lines += [
                  f"Pool profile: `{pool.get('pool_profile', '')}`",
                  f"Slot count: `{pool.get('slot_count', '')}`",
                  f"Inventory digest: `{pool.get('inventory_digest', '')}`",
                  f"Slot receipt digest: `{pool.get('slot_receipt_digest', '')}`",
                  f"Worker launches during provisioning: `{pool.get('worker_launch_count', '')}`",
                  f"Operator Store semantic mutations during provisioning: `{pool.get('operator_store_semantic_mutation_count', '')}`",
                  'Release eligible: **false** — fixture provisioning is a prerequisite only.',
              ]
          else:
              lines.append(
                  f"No complete pool receipt was retained. Partial per-slot receipts retained: `{len(slot_files)}`. "
                  'Issue #310 remains unresolved and no partial slot is accepted as #221 release evidence.'
              )
          body = json.dumps({'body': '\n'.join(lines)}).encode()
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          req = request.Request(
              f'{api}/repos/{repo}/issues/310/comments',
              data=body,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=20) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(1)
          PY
