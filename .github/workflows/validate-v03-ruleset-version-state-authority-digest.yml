name: Validate v0.3 Ruleset Version State Authority Digest

on:
  pull_request:
    paths:
      - "scripts/operator_store_github_ruleset_causal_current.py"
      - "scripts/validate_v03_ruleset_version_state_authority_digest.py"
      - ".github/workflows/validate-v03-ruleset-version-state-authority-digest.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: PYTHONPATH=scripts python scripts/validate_v03_ruleset_version_state_authority_digest.py
