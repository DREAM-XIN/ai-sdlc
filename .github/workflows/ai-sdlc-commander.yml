name: AI-SDLC Commander

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Commander operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - bootstrap
      target_ref:
        description: Existing branch/ref containing AI-SDLC state/input files
        required: true
        type: string
      manifest_path:
        description: Feature Manifest path under state/features/
        required: true
        type: string
      bootstrap_path:
        description: Repository-relative Bootstrap YAML path (required for bootstrap operation)
        required: false
        type: string
      policy_path:
        description: Optional target-repository Dispatch Policy override; empty uses trusted runtime default
        required: false
        default: ''
        type: string
      persist_bootstrap:
        description: Commit bootstrapped Manifest to target_ref
        required: true
        default: false
        type: boolean
      allow_default_branch:
        description: Explicitly allow bootstrap persistence to the default branch
        required: true
        default: false
        type: boolean

jobs:
  plan:
    if: ${{ inputs.operation == 'plan' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: runtime
          persist-credentials: false
      - name: Checkout target state
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_ref }}
          path: workspace
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r runtime/requirements-dev.txt
      - name: Validate repository input paths
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          POLICY_PATH: ${{ inputs.policy_path }}
        run: |
          PYTHONPATH=runtime/scripts python - <<'PY'
          import os
          from pathlib import PurePosixPath
          from github_persistence import validate_manifest_path

          manifest = os.environ['MANIFEST_PATH']
          error = validate_manifest_path(manifest)
          if error:
              raise SystemExit(error)

          policy_value = os.environ['POLICY_PATH']
          if policy_value:
              policy = PurePosixPath(policy_value)
              if policy.is_absolute() or '..' in policy.parts:
                  raise SystemExit('policy_path must be repository-relative without parent traversal')
              if policy.suffix not in {'.yaml', '.yml'}:
                  raise SystemExit('policy_path must be a YAML file')
              if not policy.parts or policy.parts[0] not in {'dispatch', '.ai-sdlc'}:
                  raise SystemExit('policy_path override must be under dispatch/ or .ai-sdlc/')
          PY
          test -f "workspace/$MANIFEST_PATH"
          if [[ -n "$POLICY_PATH" ]]; then
            test -f "workspace/$POLICY_PATH"
          fi
      - name: Build Commander Plan
        id: commander
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          POLICY_PATH: ${{ inputs.policy_path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          policy_args=(--policy runtime/dispatch/default.yaml)
          if [[ -n "$POLICY_PATH" ]]; then
            policy_args=(--policy "workspace/$POLICY_PATH")
          fi

          project_args=()
          if [[ -f workspace/.ai-sdlc/project.yaml ]]; then
            project_args=(--project workspace/.ai-sdlc/project.yaml --project-ref .ai-sdlc/project.yaml)
          fi

          set +e
          python runtime/scripts/commander.py plan "workspace/$MANIFEST_PATH" \
            --repository "$REPOSITORY" \
            "${policy_args[@]}" \
            "${project_args[@]}" \
            > commander-plan.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Render GitHub transport
        run: |
          python runtime/scripts/github_commander_transport.py commander-plan.json \
            --summary commander-summary.md \
            --prompts chatgpt-web-prompts.txt
          cat commander-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-commander-plan
          path: |
            commander-plan.json
            commander-summary.md
            chatgpt-web-prompts.txt
      - name: Propagate invalid Commander result
        if: ${{ steps.commander.outputs.exit_code != '0' }}
        shell: bash
        env:
          COMMANDER_EXIT: ${{ steps.commander.outputs.exit_code }}
        run: |
          echo "Commander returned exit code $COMMANDER_EXIT"
          exit "$COMMANDER_EXIT"

  bootstrap:
    if: ${{ inputs.operation == 'bootstrap' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: runtime
          persist-credentials: false
      - name: Checkout target workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_ref }}
          path: workspace
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r runtime/requirements-dev.txt
      - name: Validate bootstrap inputs
        shell: bash
        env:
          BOOTSTRAP_PATH: ${{ inputs.bootstrap_path }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          PYTHONPATH=runtime/scripts python - <<'PY'
          import os
          from pathlib import PurePosixPath
          from github_persistence import validate_manifest_path

          bootstrap_value = os.environ['BOOTSTRAP_PATH']
          if not bootstrap_value:
              raise SystemExit('bootstrap_path is required for bootstrap operation')
          bootstrap = PurePosixPath(bootstrap_value)
          if bootstrap.is_absolute() or '..' in bootstrap.parts or bootstrap.suffix not in {'.yaml', '.yml'}:
              raise SystemExit('bootstrap_path must be a repository-relative YAML file without parent traversal')

          error = validate_manifest_path(os.environ['MANIFEST_PATH'])
          if error:
              raise SystemExit(error)
          PY
          test -f "workspace/$BOOTSTRAP_PATH"
      - name: Bootstrap Feature Manifest
        shell: bash
        env:
          BOOTSTRAP_PATH: ${{ inputs.bootstrap_path }}
        run: |
          python runtime/scripts/commander.py bootstrap "workspace/$BOOTSTRAP_PATH" \
            --output bootstrap-manifest.yaml
          python runtime/scripts/validate_feature_manifest.py bootstrap-manifest.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-bootstrap-manifest
          path: bootstrap-manifest.yaml
      - name: Persist bootstrapped Manifest
        if: ${{ inputs.persist_bootstrap }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          TARGET_REF: ${{ inputs.target_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_DEFAULT_BRANCH: ${{ inputs.allow_default_branch }}
        run: |
          precondition_args=(
            --repo-dir workspace
            --target-ref "$TARGET_REF"
            --default-branch "$DEFAULT_BRANCH"
          )
          if [[ "$ALLOW_DEFAULT_BRANCH" == "true" ]]; then
            precondition_args+=(--allow-default-branch)
          fi
          python runtime/scripts/verify_git_write_precondition.py "${precondition_args[@]}"

          mkdir -p -- "workspace/$(dirname -- "$MANIFEST_PATH")"
          cp -- bootstrap-manifest.yaml "workspace/$MANIFEST_PATH"
          git -C workspace config user.name "ai-sdlc[bot]"
          git -C workspace config user.email "ai-sdlc[bot]@users.noreply.github.com"
          git -C workspace add -- "$MANIFEST_PATH"
          if git -C workspace diff --cached --quiet; then
            echo "No bootstrap changes to persist"
            exit 0
          fi
          git -C workspace commit -m "chore(ai-sdlc): bootstrap feature manifest"
          git -C workspace push origin "HEAD:$TARGET_REF"
