name: Public Release Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/validate_public_history.py'
      - 'scripts/audit_public_actions_history.py'
      - 'scripts/validate_public_release_audit_examples.py'
      - '.github/workflows/public-release-audit.yml'
      - 'docs/public-release-readiness.md'
  pull_request:
    paths:
      - 'scripts/validate_public_history.py'
      - 'scripts/audit_public_actions_history.py'
      - 'scripts/validate_public_release_audit_examples.py'
      - '.github/workflows/public-release-audit.yml'
      - 'docs/public-release-readiness.md'

permissions:
  contents: read
  actions: read

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/validate_public_release_audit_examples.py

  audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch all publishable Git refs
        shell: bash
        run: |
          git fetch --all --tags --prune
          git fetch --force origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge'

      - name: Scan current tracked tree
        id: current_tree
        continue-on-error: true
        run: python scripts/validate_public_readiness.py

      - name: Scan complete reachable Git history
        id: history
        continue-on-error: true
        run: |
          python scripts/validate_public_history.py \
            --json-output public-history-audit.json \
            --markdown-output public-history-audit.md

      - name: Audit retained Actions logs and artifacts
        id: actions_audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_public_actions_history.py \
            --json-output public-actions-audit.json \
            --markdown-output public-actions-audit.md

      - name: Publish audit summary, commit status, and enforce gate
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_TREE_OUTCOME: ${{ steps.current_tree.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
          ACTIONS_OUTCOME: ${{ steps.actions_audit.outcome }}
        run: |
          STATUS_STATE=failure
          DECISION='PUBLIC-READY-AUDIT: BLOCKED'
          if [[ "$CURRENT_TREE_OUTCOME" == 'success' && "$HISTORY_OUTCOME" == 'success' && "$ACTIONS_OUTCOME" == 'success' ]]; then
            STATUS_STATE=success
            DECISION='PUBLIC-READY-AUDIT: PASS'
          fi
          export STATUS_STATE DECISION

          {
            echo '# AI-SDLC Public Release Audit'
            echo
            echo "Repository: \`${GITHUB_REPOSITORY}\`"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Current tracked tree: \`${CURRENT_TREE_OUTCOME}\`"
            echo
            if [[ -f public-history-audit.md ]]; then cat public-history-audit.md; fi
            echo
            if [[ -f public-actions-audit.md ]]; then cat public-actions-audit.md; fi
            echo
            echo '## Decision'
            echo
            echo "**${DECISION}**"
          } >> "$GITHUB_STEP_SUMMARY"

          # These reports contain only finding type and location, never matched
          # credential values. Print them on failure so a BLOCKED run can be
          # diagnosed from retained job logs without exposing secrets.
          if [[ "$HISTORY_OUTCOME" != 'success' && -f public-history-audit.md ]]; then
            echo '--- redacted full-history findings ---'
            cat public-history-audit.md
          fi
          if [[ "$ACTIONS_OUTCOME" != 'success' && -f public-actions-audit.md ]]; then
            echo '--- redacted historical Actions findings ---'
            cat public-actions-audit.md
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          token = os.environ['GITHUB_TOKEN']
          state = os.environ['STATUS_STATE']
          decision = os.environ['DECISION']
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = json.dumps({
              'state': state,
              'context': 'public-release-audit',
              'description': decision,
              'target_url': run_url,
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'ai-sdlc-public-release-audit',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status not in {200, 201}:
                  raise RuntimeError(f'unexpected commit-status response: {response.status}')
          PY

          test "$CURRENT_TREE_OUTCOME" = 'success'
          test "$HISTORY_OUTCOME" = 'success'
          test "$ACTIONS_OUTCOME" = 'success'
