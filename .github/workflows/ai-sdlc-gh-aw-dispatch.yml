name: AI-SDLC gh-aw Dispatch

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Non-default branch containing the Feature Manifest and runtime policy
        required: true
        type: string
      manifest_path:
        description: Feature Manifest under state/features/
        required: true
        type: string
      policy_path:
        description: Dispatch Policy containing a gh-aw/autonomous route
        required: true
        type: string
      project_path:
        description: Optional Project Adapter path
        required: false
        default: .ai-sdlc/project.yaml
        type: string
      worker_workflow:
        description: Compiled gh-aw worker workflow filename
        required: true
        default: ai-sdlc-gh-aw-worker.lock.yml
        type: string
      dry_run:
        description: Build the dispatch plan without reserving state or triggering the worker
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.adapter.outputs.outcome }}
      plan_b64: ${{ steps.adapter.outputs.plan_b64 }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: runtime
          persist-credentials: false
      - name: Checkout target workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_ref }}
          path: workspace
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r runtime/requirements-dev.txt
      - name: Validate runtime input paths
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          POLICY_PATH: ${{ inputs.policy_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
          WORKER_WORKFLOW: ${{ inputs.worker_workflow }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          PYTHONPATH=runtime/scripts python - <<'PY'
          import os, re
          from pathlib import PurePosixPath
          from github_persistence import validate_manifest_path
          error = validate_manifest_path(os.environ['MANIFEST_PATH'])
          if error:
              raise SystemExit(error)
          for label in ('POLICY_PATH', 'PROJECT_PATH'):
              value = os.environ[label]
              if not value and label == 'PROJECT_PATH':
                  continue
              path = PurePosixPath(value)
              if path.is_absolute() or '..' in path.parts or path.suffix not in {'.yaml', '.yml'}:
                  raise SystemExit(f'{label.lower()} must be a repository-relative YAML path without parent traversal')
          if not re.fullmatch(r'[A-Za-z0-9._-]+\.ya?ml', os.environ['WORKER_WORKFLOW']):
              raise SystemExit('worker_workflow must be a workflow filename, not an arbitrary path')
          PY
          git -C workspace check-ref-format --branch "$TARGET_REF" >/dev/null
          test -f "workspace/$MANIFEST_PATH"
          test -f "workspace/$POLICY_PATH"
          test ! -L "workspace/$MANIFEST_PATH"
          test ! -L "workspace/$POLICY_PATH"
          if [[ -n "$PROJECT_PATH" && -e "workspace/$PROJECT_PATH" ]]; then
            test -f "workspace/$PROJECT_PATH"
            test ! -L "workspace/$PROJECT_PATH"
          fi
      - name: Build Commander Plan
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          POLICY_PATH: ${{ inputs.policy_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          project_args=()
          if [[ -n "$PROJECT_PATH" && -f "workspace/$PROJECT_PATH" ]]; then
            project_args=(--project "workspace/$PROJECT_PATH" --project-ref "$PROJECT_PATH")
          fi
          python runtime/scripts/commander.py plan "workspace/$MANIFEST_PATH" \
            --repository "$REPOSITORY" \
            --policy "workspace/$POLICY_PATH" \
            "${project_args[@]}" > commander-plan.json
      - name: Build gh-aw Dispatch Plan
        id: adapter
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          POLICY_PATH: ${{ inputs.policy_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
          WORKER_WORKFLOW: ${{ inputs.worker_workflow }}
          TARGET_REF: ${{ inputs.target_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          project_args=()
          if [[ -n "$PROJECT_PATH" && -f "workspace/$PROJECT_PATH" ]]; then
            project_args=(--project "workspace/$PROJECT_PATH" --project-ref "$PROJECT_PATH")
          fi
          python runtime/scripts/gh_aw_adapter.py plan \
            "workspace/$MANIFEST_PATH" commander-plan.json \
            --repository "$REPOSITORY" \
            --target-ref "$TARGET_REF" \
            --worker-workflow "$WORKER_WORKFLOW" \
            --policy "workspace/$POLICY_PATH" \
            "${project_args[@]}" \
            --output gh-aw-dispatch-plan.json
          outcome=$(python -c "import json; print(json.load(open('gh-aw-dispatch-plan.json'))['outcome'])")
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "plan_b64=$(base64 -w0 gh-aw-dispatch-plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-gh-aw-dispatch-plan
          path: |
            commander-plan.json
            gh-aw-dispatch-plan.json
      - name: Report no gh-aw route
        if: ${{ steps.adapter.outputs.outcome == 'NO_DISPATCH' }}
        shell: bash
        run: echo "Commander Plan contains no gh-aw/autonomous dispatch. Nothing was triggered." >> "$GITHUB_STEP_SUMMARY"

  execute:
    if: ${{ !inputs.dry_run && needs.plan.outputs.outcome == 'PLANNED' }}
    needs: plan
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: runtime
          persist-credentials: false
      - name: Checkout target workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_ref }}
          path: workspace
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r runtime/requirements-dev.txt
      - name: Restore and validate dispatch plan
        shell: bash
        env:
          PLAN_B64: ${{ needs.plan.outputs.plan_b64 }}
          TARGET_REF: ${{ inputs.target_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          printf '%s' "$PLAN_B64" | base64 -d > gh-aw-dispatch-plan.json
          git -C workspace check-ref-format --branch "$TARGET_REF" >/dev/null
          if [[ "$TARGET_REF" == "$DEFAULT_BRANCH" ]]; then
            echo "gh-aw autonomous dispatch must target a non-default branch" >&2
            exit 2
          fi
          test -f "workspace/$MANIFEST_PATH"
          python - <<'PY'
          import json, os
          result = json.load(open('gh-aw-dispatch-plan.json'))
          if result.get('outcome') != 'PLANNED':
              raise SystemExit('execute job requires a PLANNED gh-aw dispatch')
          plan = result['plan']
          if plan['target_ref'] != os.environ['TARGET_REF']:
              raise SystemExit('dispatch plan target_ref changed between jobs')
          if len(plan['dispatches']) != 1:
              raise SystemExit('v0.1 execute job requires exactly one gh-aw dispatch')
          PY
      - name: Reserve stage as WORKING
        id: reserve
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          TARGET_REF: ${{ inputs.target_ref }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          occurred_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          python runtime/scripts/gh_aw_adapter.py start-event gh-aw-dispatch-plan.json \
            --occurred-at "$occurred_at" \
            --output start-event.yaml
          EVENT_PATH=$(python - <<'PY'
          import yaml
          event = yaml.safe_load(open('start-event.yaml'))
          print(f"state/events/{event['feature_id']}/{event['id']}.yaml")
          PY
          )
          echo "event_path=$EVENT_PATH" >> "$GITHUB_OUTPUT"
          python runtime/scripts/ingest_feature_event.py \
            "workspace/$MANIFEST_PATH" start-event.yaml \
            --event-path "$EVENT_PATH" \
            --repository "$REPOSITORY" \
            --manifest-path "$MANIFEST_PATH" \
            --target-ref "$TARGET_REF" \
            --output start-persistence-plan.json
          mkdir -p -- "workspace/$(dirname -- "$EVENT_PATH")"
          cp -- start-event.yaml "workspace/$EVENT_PATH"
          MANIFEST_PATH="$MANIFEST_PATH" python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('start-persistence-plan.json').read_text(encoding='utf-8'))
          target = Path('workspace') / os.environ['MANIFEST_PATH']
          target.write_text(plan['plan']['manifest']['content'], encoding='utf-8')
          PY
          python runtime/scripts/validate_feature_manifest.py "workspace/$MANIFEST_PATH"
          python runtime/scripts/verify_git_write_precondition.py \
            --repo-dir workspace \
            --target-ref "$TARGET_REF" \
            --default-branch "$DEFAULT_BRANCH"
          git -C workspace config user.name "ai-sdlc[bot]"
          git -C workspace config user.email "ai-sdlc[bot]@users.noreply.github.com"
          git -C workspace add -- "$MANIFEST_PATH" "$EVENT_PATH"
          git -C workspace commit -m "ai-sdlc: reserve gh-aw runtime stage"
          git -C workspace push origin "HEAD:$TARGET_REF"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-sdlc-gh-aw-start-reservation
          path: |
            gh-aw-dispatch-plan.json
            start-event.yaml
            start-persistence-plan.json
      - name: Dispatch compiled gh-aw worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          result = json.load(open('gh-aw-dispatch-plan.json'))
          plan = result['plan']
          dispatch = plan['dispatches'][0]
          cmd = ['gh', 'workflow', 'run', dispatch['workflow'], '--repo', plan['repository'], '--ref', dispatch['ref']]
          for key, value in dispatch['inputs'].items():
              cmd.extend(['--field', f'{key}={value}'])
          print('Dispatching', dispatch['task_id'], 'to', dispatch['workflow'])
          subprocess.run(cmd, check=True)
          PY
          # If dispatch fails after START persistence, the Feature intentionally remains WORKING.
          # AI-SDLC intentionally does not guess a rollback/block transition here.
          # Operators can retry dispatch or persist an explicit BLOCKED event with evidence.
