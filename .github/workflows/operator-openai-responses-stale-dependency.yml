name: Validate OpenAI Responses Stale Dependency

on:
  push:
    branches:
      - feature/F-OPERATOR-OPENAI-RESPONSES-ADAPTER-0001
    paths:
      - '.github/workflows/operator-openai-responses-stale-dependency.yml'
      - 'scripts/operator_openai_responses_production.py'
      - 'scripts/validate_operator_openai_responses_stale_callback.py'
      - 'scripts/validate_operator_openai_responses_stale_dependency.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/operator-openai-responses-stale-dependency.yml'
      - 'scripts/operator_openai_responses_production.py'
      - 'scripts/validate_operator_openai_responses_stale_callback.py'
      - 'scripts/validate_operator_openai_responses_stale_dependency.py'

permissions:
  contents: read

jobs:
  stale-dependency-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate stale dependency probe and WU8 proof surface
        run: python scripts/validate_operator_openai_responses_stale_dependency.py
      - name: Compile production and WU8 gates
        run: |
          python -m py_compile scripts/operator_openai_responses_production.py
          python -m py_compile scripts/validate_operator_openai_responses_stale_callback.py
