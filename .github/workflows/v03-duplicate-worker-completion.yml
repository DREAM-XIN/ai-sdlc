name: Validate v0.3 Duplicate Worker Completion

on:
  pull_request:
    branches:
      - main
      - verification/v03-effect-safety-remaining-current-stack-221
    paths:
      - '.github/workflows/v03-duplicate-worker-completion.yml'
      - 'scripts/v03_duplicate_worker_completion_collector.py'
      - 'scripts/validate_v03_duplicate_worker_completion.py'
      - 'scripts/operator_vertical_gh_aw_github_source.py'
      - 'scripts/operator_vertical_gh_aw_collector.py'
      - 'scripts/operator_vertical_callback.py'
      - 'scripts/operator_vertical_recovery.py'
      - 'scripts/operator_vertical_store.py'
      - 'scripts/v03_real_runtime_lost_ack_orchestration.py'
      - 'scripts/validate_v03_real_runtime_lost_ack_orchestration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile duplicate-completion replay fence
        run: python -m py_compile scripts/v03_duplicate_worker_completion_collector.py scripts/validate_v03_duplicate_worker_completion.py
      - name: Prove same first-attempt completion is adopted/Persisted once
        run: PYTHONPATH=scripts python scripts/validate_v03_duplicate_worker_completion.py
