name: Validate Persist Reconcile Classification

on:
  push:
    branches:
      - runtime/persist-reconcile-classification
    paths:
      - '.github/workflows/operator-persist-reconcile-classification.yml'
      - 'scripts/operator_vertical_reconcile_classified.py'
      - 'scripts/operator_vertical_runtime.py'
      - 'scripts/validate_operator_persist_reconcile_classification.py'
  pull_request:
    branches:
      - runtime/vertical-feature-persist-gateway
    paths:
      - '.github/workflows/operator-persist-reconcile-classification.yml'
      - 'scripts/operator_vertical_reconcile_classified.py'
      - 'scripts/operator_vertical_runtime.py'
      - 'scripts/validate_operator_persist_reconcile_classification.py'
      - 'scripts/operator_vertical_reconcile.py'
      - 'scripts/operator_vertical_store.py'
      - 'scripts/operator_vertical_feature_persist_gateway.py'

permissions:
  contents: read

jobs:
  persist-reconcile-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile restored classification runtime and validator
        run: python -m py_compile scripts/operator_vertical_reconcile_classified.py scripts/operator_vertical_runtime.py scripts/validate_operator_persist_reconcile_classification.py
      - name: Validate deterministic/transient/cancelled Persist classification
        run: python scripts/validate_operator_persist_reconcile_classification.py
      - name: Re-run accepted Vertical reconcile regression suite
        run: python scripts/validate_operator_vertical_reconcile.py
      - name: Re-run accepted Vertical recovery regression suite
        run: python scripts/validate_operator_vertical_recovery.py
      - name: Re-run restored generation-bound Persist gateway regression
        run: python scripts/validate_operator_vertical_feature_persist_gateway.py
      - name: Prove production runtime selects classified executor
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import ast
          import inspect
          import textwrap
          import operator_vertical_runtime

          source = inspect.getsource(operator_vertical_runtime.build_trusted_vertical_runtime)
          tree = ast.parse(textwrap.dedent(source))
          constructed = {
              node.func.id
              for node in ast.walk(tree)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
          }
          assert 'FailureClassifyingTrustedRecoveringVerticalExecutor' in constructed
          assert 'TrustedRecoveringVerticalExecutor' not in constructed
          print('Production vertical runtime selects failure-classifying recovery executor')
          PY
