name: Validate Trusted v0.3 gh-aw First-Attempt Run Lease

on:
  pull_request:
    paths:
      - "scripts/operator_vertical_gh_aw_attempt_binding.py"
      - "scripts/operator_vertical_gh_aw_content_binding.py"
      - "scripts/operator_vertical_gh_aw_github_source.py"
      - "scripts/operator_vertical_gh_aw_collector.py"
      - "scripts/validate_operator_vertical_gh_aw_attempt_binding.py"
      - "scripts/validate_operator_vertical_gh_aw_attempt_recovery.py"
      - "scripts/validate_operator_vertical_gh_aw_content_binding.py"
      - "scripts/validate_operator_vertical_gh_aw_github_source.py"
      - ".github/workflows/validate-v03-gh-aw-vertical-attempt-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=scripts python scripts/validate_operator_vertical_gh_aw_attempt_binding.py
      - run: PYTHONPATH=scripts python scripts/validate_operator_vertical_gh_aw_attempt_recovery.py
