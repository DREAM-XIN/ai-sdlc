tasks:
- id: F-OPERATOR-EFFECT-LINEAGE-0001-CODE-REMEDIATION-1
  kind: remediation
  stage: implementation
  role: developer
  source_stage: code-review
  feedback: 'Close exactly the three MAJOR findings from independent Code Review /
    PR Review 4898019303: make Effect Resolution re-verify fresh trusted Feature/candidate/profile-policy
    truth and replace caller-shaped strong evidence with a real trusted evidence verifier/source;
    replace LegacyMigrationEvidence.unique_lineage_proven and caller-selected causal
    slot/task assertions with durable Store/Feature/profile reconstruction that proves
    one unique lineage or remains LEGACY_UNRESOLVED_LINEAGE; and replace default booleans
    for effect_lineage_required/old_writers_quiesced with protected installation/runtime
    rollout state plus an authoritative mixed-writer fence that rejects old raw reservation/claim/authorization
    writers after enforcement. Add the deterministic adversarial cases required by
    code-review.md and preserve the accepted stale-runner/lineage/CAS semantics.'
  status: DONE
  runtime: manual
- id: F-OPERATOR-EFFECT-LINEAGE-0001-CODE-REMEDIATION-2
  kind: remediation
  stage: implementation
  role: developer
  source_stage: code-review
  feedback: 'Close only the remaining MAJOR from independent Code Re-review v2 / PR
    Review 4898427815: Effect Resolution must re-verify current protected/default-branch/installation
    resolution policy truth at application time instead of trusting a passed EffectResolutionAuthority
    object as current; bind proposal/resolution application and strong-evidence capability
    selection to the current trusted policy epoch/digest, reject stale Authority/verifier
    state after policy change, and add a deterministic case where only trusted_policy_digest/current
    protected policy changes while candidate/ref/revision/profile remain unchanged.
    Preserve the already-closed legacy migration, mixed-writer rollout/fence, stale-runner,
    candidate-lineage, CAS and release-contract semantics.'
  status: DONE
  runtime: manual
