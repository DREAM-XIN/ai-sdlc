name: AI-SDLC Persist Feature Event

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository path to the Feature Manifest
        required: true
        type: string
      event_path:
        description: "Event inbox path: state/events/<feature-id>/<event-id>.yaml"
        required: true
        type: string
      target_ref:
        description: Existing branch/ref to update
        required: true
        type: string
      feature_issue:
        description: Optional Feature Issue number for status output
        required: false
        type: string
      dry_run:
        description: Generate and validate the plan without pushing changes
        required: true
        default: true
        type: boolean
      allow_default_branch:
        description: Explicitly allow persistence directly to the repository default branch
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: runtime
          persist-credentials: false
      - name: Checkout target workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r runtime/requirements-dev.txt
      - name: Protect default branch and validate paths
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          EVENT_PATH: ${{ inputs.event_path }}
          TARGET_REF: ${{ inputs.target_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_DEFAULT_BRANCH: ${{ inputs.allow_default_branch }}
        run: |
          if [[ "$TARGET_REF" == "$DEFAULT_BRANCH" && "$ALLOW_DEFAULT_BRANCH" != "true" ]]; then
            echo "Refusing direct persistence to default branch without allow_default_branch=true"
            exit 1
          fi
          PYTHONPATH=runtime/scripts python - <<'PY'
          import os
          from pathlib import PurePosixPath
          from github_persistence import validate_manifest_path

          manifest = os.environ['MANIFEST_PATH']
          error = validate_manifest_path(manifest)
          if error:
              raise SystemExit(error)

          event = PurePosixPath(os.environ['EVENT_PATH'])
          if event.is_absolute() or '..' in event.parts:
              raise SystemExit('event_path must be repository-relative without parent traversal')
          if len(event.parts) != 4 or event.parts[:2] != ('state', 'events') or event.suffix not in {'.yaml', '.yml'}:
              raise SystemExit('event_path must match state/events/<feature-id>/<event-id>.yaml')
          PY
          test -f "workspace/$MANIFEST_PATH"
          test -f "workspace/$EVENT_PATH"
      - name: Validate inbox event and build persistence plan
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          EVENT_PATH: ${{ inputs.event_path }}
          TARGET_REF: ${{ inputs.target_ref }}
          FEATURE_ISSUE: ${{ inputs.feature_issue }}
          REPOSITORY: ${{ github.repository }}
        run: |
          args=(
            "workspace/$MANIFEST_PATH"
            "workspace/$EVENT_PATH"
            --event-path "$EVENT_PATH"
            --repository "$REPOSITORY"
            --manifest-path "$MANIFEST_PATH"
            --target-ref "$TARGET_REF"
            --output persistence-plan.json
          )
          if [[ -n "$FEATURE_ISSUE" ]]; then
            if [[ ! "$FEATURE_ISSUE" =~ ^[0-9]+$ ]]; then
              echo "feature_issue must be numeric"
              exit 1
            fi
            args+=(--issue "$FEATURE_ISSUE")
          fi
          python runtime/scripts/ingest_feature_event.py "${args[@]}"
      - name: Materialize updated manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          plan = json.loads(Path('persistence-plan.json').read_text(encoding='utf-8'))
          if plan['outcome'] != 'PLANNED':
              raise SystemExit('persistence plan was not PLANNED')
          target = Path('workspace') / plan['plan']['target']['manifest_path']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(plan['plan']['manifest']['content'], encoding='utf-8')
      - name: Validate materialized manifest
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: python runtime/scripts/validate_feature_manifest.py "workspace/$MANIFEST_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-sdlc-persistence-plan
          path: persistence-plan.json
      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          git -C workspace config user.name "ai-sdlc[bot]"
          git -C workspace config user.email "ai-sdlc[bot]@users.noreply.github.com"
          git -C workspace add -- "$MANIFEST_PATH"
          if git -C workspace diff --cached --quiet; then
            echo "No manifest changes to persist"
            exit 0
          fi
          git -C workspace commit -m "chore(ai-sdlc): persist feature event"
          git -C workspace push origin "HEAD:$TARGET_REF"
