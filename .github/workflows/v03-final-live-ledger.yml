name: v0.3 Final Issue 221 Live Ledger

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main final ledger aggregation
        run: exit 1

  aggregate-final-ledger:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - run: pip install -r requirements-dev.txt

      - name: Aggregate exact-main provenance-bound live records
        env:
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=scripts python scripts/v03_effect_safety_final_live_ledger.py
          test -s evidence/v03-final-live-ledger/v03-effect-safety-final-selection.json
          test -s evidence/v03-final-live-ledger/v03-effect-safety-final-ledger.json

      - name: Upload immutable final ledger selection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-effect-safety-final-live-ledger
          path: evidence/v03-final-live-ledger/
          if-no-files-found: warn

      - name: Publish final closed-ledger result to Issue 221
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib import request

          root = Path('evidence/v03-final-live-ledger')
          ledger_path = root / 'v03-effect-safety-final-ledger.json'
          selection_path = root / 'v03-effect-safety-final-selection.json'
          ledger = json.loads(ledger_path.read_text()) if ledger_path.is_file() else {}
          selection = json.loads(selection_path.read_text()) if selection_path.is_file() else {}
          exact_pass = bool(
              os.environ['JOB_STATUS'] == 'success'
              and ledger.get('status') == 'PASS'
              and ledger.get('overall_issue_221_pass') is True
              and ledger.get('accepted_record_count') == 11
              and ledger.get('accepted_workflow_run_count') == 11
              and len(ledger.get('satisfied_scenarios') or []) == 13
              and ledger.get('unresolved_scenarios') == []
              and ledger.get('deterministic_evidence_accepted') is False
              and selection.get('trusted_main_head_sha') == os.environ['HEAD_SHA']
          )
          lines = [
              '<!-- ai-sdlc-v03-final-live-ledger -->',
              f"v0.3 final Issue #221 closed live ledger: **{'PASS' if exact_pass else 'BLOCKED'}**",
              f"Aggregation run: `{os.environ['RUN_ID']}`",
              f"Trusted-main head: `{os.environ['HEAD_SHA']}`",
          ]
          if exact_pass:
              lines.extend([
                  'Satisfied rows: **13/13**',
                  'Accepted provenance-bound records: **11**',
                  'Distinct source workflow runs: **11**',
                  f"Zero-measurement coverage: `{', '.join(ledger.get('observed_zero_measurements') or [])}`",
                  'Deterministic evidence accepted: **false**',
                  '',
                  'This receipt proves the closed Issue #221 real-runtime matrix only.',
                  'It does not by itself claim v0.3 release readiness; real dogfood and final release governance remain separate gates.',
              ])
          else:
              lines.extend([
                  f"Job status: `{os.environ['JOB_STATUS']}`",
                  f"Ledger status: `{ledger.get('status', 'MISSING')}`",
                  f"Satisfied rows: `{len(ledger.get('satisfied_scenarios') or [])}/13`",
                  f"Unresolved rows: `{json.dumps(ledger.get('unresolved_scenarios', []), separators=(',', ':'))}`",
                  '',
                  'No Issue #221 PASS is claimed unless all 11 distinct exact-main provenance-bound records close all 13 rows.',
              ])
          body = json.dumps({'body': '\n'.join(lines)}).encode()
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          req = request.Request(
              f'{api}/repos/{repo}/issues/221/comments',
              data=body,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(1)
          if not exact_pass:
              raise SystemExit(1)
          PY
