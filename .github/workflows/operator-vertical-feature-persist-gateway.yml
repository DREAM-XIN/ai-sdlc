name: Validate Operator Vertical Feature Persist Gateway

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/operator_vertical_feature_persist_gateway.py'
      - 'scripts/validate_operator_vertical_feature_persist_gateway.py'
      - 'scripts/operator_release_feature_event_gateway.py'
      - 'scripts/operator_vertical.py'
      - 'scripts/operator_vertical_store.py'
      - 'scripts/operator_vertical_recovery.py'
      - 'scripts/operator_store.py'
      - 'scripts/operator_store_backends.py'
      - 'scripts/operator_store_model.py'
      - 'scripts/validate.py'
      - '.github/workflows/operator-vertical-feature-persist-gateway.yml'
  push:
    branches:
      - runtime/vertical-feature-persist-gateway
    paths:
      - 'scripts/operator_vertical_feature_persist_gateway.py'
      - 'scripts/validate_operator_vertical_feature_persist_gateway.py'
      - 'scripts/operator_release_feature_event_gateway.py'
      - 'scripts/operator_vertical.py'
      - 'scripts/operator_vertical_store.py'
      - 'scripts/operator_vertical_recovery.py'
      - 'scripts/operator_store.py'
      - 'scripts/operator_store_backends.py'
      - 'scripts/operator_store_model.py'
      - 'scripts/validate.py'
      - '.github/workflows/operator-vertical-feature-persist-gateway.yml'

permissions:
  contents: read

jobs:
  vertical-feature-persist-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate generation-bound durable Vertical Feature Persist gateway
        run: python scripts/validate_operator_vertical_feature_persist_gateway.py
