name: v0.3 Finalize Real Release Dogfood Scenario
run-name: v0.3 finalize dogfood ${{ inputs.scenario }} source ${{ inputs.source_run_id }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Frozen v0.3 real release dogfood scenario
        required: true
        type: choice
        options: [happy_path, review_remediation, session_recovery]
      source_run_id:
        description: Successful v0.3 Real Release Dogfood Scenario workflow run id
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt

      - name: Prove exact trusted-main source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$SOURCE_RUN_ID" in *[!0-9]*|'') exit 1 ;; esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          test "$(jq -r .event <<<"$run")" = workflow_dispatch
          test "$(jq -r .status <<<"$run")" = completed
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_branch <<<"$run")" = main
          test "$(jq -r .head_sha <<<"$run")" = "$GITHUB_SHA"
          test "$(jq -r .path <<<"$run")" = '.github/workflows/v03-real-dogfood-scenario.yml'
          mkdir -p evidence/raw
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "v03-real-dogfood-$SCENARIO" --dir evidence/raw
          test -s "evidence/raw/$SCENARIO-observation.json"
          jq -e --arg s "$SCENARIO" '.scenario == $s and .release_eligible == false and .provenance_verified == false' "evidence/raw/$SCENARIO-observation.json" >/dev/null

      - name: Re-read protected runtime truth and finalize canonical release-run
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ vars.AI_SDLC_OPERATOR_APP_SLUG }}
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
          AI_SDLC_EVENT_WRITE_TOKEN: ${{ secrets.AI_SDLC_DOGFOOD_FINALIZER_DISTINCT_EVENT_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          test -n "${AI_SDLC_OPERATOR_ADMIN_TOKEN:-}"
          test -n "${AI_SDLC_OPERATOR_APP_INTEGRATION_ID:-}"
          test -n "${AI_SDLC_OPERATOR_APP_SLUG:-}"
          test -n "${AI_SDLC_EVENT_WRITE_TOKEN:-}"
          PYTHONPATH=scripts python scripts/v03_dogfood_post_run_finalizer.py \
            --scenario '${{ inputs.scenario }}' \
            --observation 'evidence/raw/${{ inputs.scenario }}-observation.json' \
            --source-run-id '${{ inputs.source_run_id }}' \
            --finalizer-run-id "$GITHUB_RUN_ID" \
            --output 'evidence/final/${{ inputs.scenario }}-release-run.json'
          jq -e '.evidence_kind == "release-run" and .verdict == "PASS" and .release_eligible == true' 'evidence/final/${{ inputs.scenario }}-release-run.json' >/dev/null

      - name: Upload verified canonical release-run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-verified-dogfood-${{ inputs.scenario }}
          path: evidence/final/${{ inputs.scenario }}-release-run.json
          if-no-files-found: error

      - name: Publish verified receipt to Issue 239
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          path="evidence/final/$SCENARIO-release-run.json"
          digest=$(sha256sum "$path" | awk '{print $1}')
          gh issue comment 239 --repo "$GITHUB_REPOSITORY" --body "<!-- ai-sdlc-v03-verified-real-dogfood -->
          v0.3 real dogfood \`$SCENARIO\`: **verified canonical release-run produced**
          Finalizer run: \`$GITHUB_RUN_ID\`
          Exact trusted-main head: \`$GITHUB_SHA\`
          Source scenario run: \`${{ inputs.source_run_id }}\`
          Artifact: \`v03-verified-dogfood-$SCENARIO\`
          SHA-256: \`$digest\`

          This receipt is bound to the closed schema/semantic validator plus production provenance verifier. It does not by itself declare v0.3 release-ready."

  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
