name: Validate Backed Operator MCP Launcher

on:
  push:
    branches:
      - runtime/operator-production-composition-244
    paths:
      - '.github/workflows/operator-mcp-production-launcher.yml'
      - 'scripts/operator_mcp_production.py'
      - 'scripts/operator_production_bundle.py'
      - 'scripts/operator_production_store_backends.py'
      - 'scripts/validate_operator_mcp_production_launcher.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/operator-mcp-production-launcher.yml'
      - 'scripts/operator_mcp_production.py'
      - 'scripts/operator_production_bundle.py'
      - 'scripts/operator_production_store_backends.py'
      - 'scripts/validate_operator_mcp_production_launcher.py'

permissions:
  contents: read

jobs:
  validate-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate strict backed MCP production launcher
        run: python scripts/validate_operator_mcp_production_launcher.py
