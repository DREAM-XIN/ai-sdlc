name: Validate Operator Runtime Config

on:
  push:
    branches:
      - runtime/operator-production-composition-244
    paths:
      - '.github/workflows/operator-runtime-config.yml'
      - 'spec/operator/runtime-config.schema.json'
      - 'scripts/operator_production_runtime.py'
      - 'scripts/validate_operator_runtime_config.py'
      - 'examples/operator/production-runtime-config.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/operator-runtime-config.yml'
      - 'spec/operator/runtime-config.schema.json'
      - 'scripts/operator_production_runtime.py'
      - 'scripts/validate_operator_runtime_config.py'
      - 'examples/operator/production-runtime-config.yaml'

permissions:
  contents: read

jobs:
  runtime-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate runtime configuration contract
        run: python scripts/validate_operator_runtime_config.py
