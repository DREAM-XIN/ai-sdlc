name: Validate v0.3 Full Runtime Preflight

on:
  pull_request:
    branches:
      - main
      - verification/v03-duplicate-worker-completion-221
    paths:
      - '.github/workflows/v03-full-runtime-preflight.yml'
      - 'scripts/v03_real_runtime_full_preflight.py'
      - 'scripts/validate_v03_real_runtime_full_preflight.py'
      - 'scripts/v03_real_runtime_full_composition.py'
      - 'scripts/v03_real_runtime_live_authority.py'
      - 'scripts/operator_v03_reviewer_worker_readiness.py'
      - 'scripts/provision_v03_real_runtime_fixture.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile full trusted preflight
        run: python -m py_compile scripts/v03_real_runtime_full_preflight.py scripts/validate_v03_real_runtime_full_preflight.py
      - name: Prove exact main/policy/reviewer/fixture binding without launch
        run: PYTHONPATH=scripts python scripts/validate_v03_real_runtime_full_preflight.py
