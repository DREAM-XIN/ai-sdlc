name: AI-SDLC Persist Event

on:
  push:
    paths:
      - 'state/events/**/*.yaml'
      - 'state/events/**/*.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch/ref containing the Feature Manifest and Event Inbox file
        required: true
        type: string
      manifest_path:
        description: Feature Manifest path under state/features/
        required: true
        type: string
      event_path:
        description: Event Inbox path under state/events/<feature-id>/
        required: true
        type: string
      feature_issue:
        description: Optional numeric Feature Issue
        required: false
        default: ''
        type: string
      dry_run:
        description: Validate/materialize without committing or pushing
        required: true
        default: true
        type: boolean
      allow_default_branch:
        description: Explicitly permit persistence to the default branch
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve automatic Feature Event push
        id: auto
        if: ${{ github.event_name == 'push' }}
        shell: python
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          import subprocess
          from pathlib import PurePosixPath

          before = os.environ['BEFORE_SHA']
          after = os.environ['AFTER_SHA']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', before) or not re.fullmatch(r'[0-9a-fA-F]{40}', after):
              raise SystemExit('before and after must be full 40-character commit SHAs')
          if before == '0' * 40:
              raise SystemExit('automatic persistence does not accept a branch-creation push; commit the event in a subsequent push')

          result = subprocess.run(
              ['git', 'diff', '--name-only', '--diff-filter=AM', before, after],
              check=True,
              capture_output=True,
              text=True,
          )
          eligible = []
          for raw in result.stdout.splitlines():
              path = PurePosixPath(raw.strip())
              if path.is_absolute() or '..' in path.parts:
                  continue
              if len(path.parts) != 4 or path.parts[:2] != ('state', 'events'):
                  continue
              if path.suffix not in {'.yaml', '.yml'}:
                  continue
              eligible.append(path.as_posix())
          if len(eligible) != 1:
              raise SystemExit(
                  'automatic persistence requires exactly one added/modified Feature Event in the push; '
                  f'found {len(eligible)}: {eligible}'
              )

          event = PurePosixPath(eligible[0])
          manifest = PurePosixPath('state', 'features', f'{event.parts[2]}.yaml').as_posix()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'event_path={event.as_posix()}\n')
              handle.write(f'manifest_path={manifest}\n')

      - name: Resolve persistence request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTO_EVENT_PATH: ${{ steps.auto.outputs.event_path }}
          AUTO_MANIFEST_PATH: ${{ steps.auto.outputs.manifest_path }}
          MANUAL_EVENT_PATH: ${{ inputs.event_path }}
          MANUAL_MANIFEST_PATH: ${{ inputs.manifest_path }}
          MANUAL_TARGET_REF: ${{ inputs.target_ref }}
          MANUAL_FEATURE_ISSUE: ${{ inputs.feature_issue }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_ALLOW_DEFAULT_BRANCH: ${{ inputs.allow_default_branch }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            {
              echo "event_path=$AUTO_EVENT_PATH"
              echo "manifest_path=$AUTO_MANIFEST_PATH"
              echo "target_ref=$PUSH_REF"
              echo "feature_issue="
              echo "persist=true"
              echo "allow_default_branch=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "event_path=$MANUAL_EVENT_PATH"
              echo "manifest_path=$MANUAL_MANIFEST_PATH"
              echo "target_ref=$MANUAL_TARGET_REF"
              echo "feature_issue=$MANUAL_FEATURE_ISSUE"
              if [[ "$MANUAL_DRY_RUN" == "true" ]]; then echo "persist=false"; else echo "persist=true"; fi
              echo "allow_default_branch=$MANUAL_ALLOW_DEFAULT_BRANCH"
            } >> "$GITHUB_OUTPUT"
          fi

      # Installer must replace this placeholder with a reviewed full AI-SDLC commit SHA.
      - name: Apply AI-SDLC Feature Event
        id: control
        uses: DREAM-XIN/ai-sdlc/.github/actions/control@REPLACE_WITH_AI_SDLC_FULL_SHA # ai-sdlc-install-placeholder
        with:
          operation: persist
          repository: ${{ github.repository }}
          target_ref: ${{ steps.request.outputs.target_ref }}
          manifest_path: ${{ steps.request.outputs.manifest_path }}
          event_path: ${{ steps.request.outputs.event_path }}
          feature_issue: ${{ steps.request.outputs.feature_issue }}
          persist: ${{ steps.request.outputs.persist }}
          allow_default_branch: ${{ steps.request.outputs.allow_default_branch }}
          default_branch: ${{ github.event.repository.default_branch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.control.outputs.persistence_plan_path != '' }}
        with:
          name: ai-sdlc-persistence-plan
          path: ${{ steps.control.outputs.persistence_plan_path }}

      - name: Propagate invalid persistence result
        if: ${{ steps.control.outputs.exit_code != '0' }}
        shell: bash
        run: exit "${{ steps.control.outputs.exit_code }}"
