name: Validate OpenAI Responses Lane-B Event Seam

on:
  push:
    branches:
      - feature/F-OPERATOR-OPENAI-RESPONSES-ADAPTER-0001
    paths:
      - '.github/workflows/operator-openai-responses-lane-b-event-seam.yml'
      - 'scripts/validate_operator_openai_responses_lane_b.py'
      - 'scripts/validate_operator_openai_responses_lane_b_event_seam.py'
      - 'scripts/validate_operator_openai_responses_lane_b_event_scope.py'
      - 'scripts/operator_*feature_event*.py'
      - 'spec/feature-event.schema.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/operator-openai-responses-lane-b-event-seam.yml'
      - 'scripts/validate_operator_openai_responses_lane_b.py'
      - 'scripts/validate_operator_openai_responses_lane_b_event_seam.py'
      - 'scripts/validate_operator_openai_responses_lane_b_event_scope.py'
      - 'scripts/operator_*feature_event*.py'
      - 'spec/feature-event.schema.json'

permissions:
  contents: read

jobs:
  exact-event-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile prepared Lane-B harness
        run: python -m py_compile scripts/validate_operator_openai_responses_lane_b.py
      - name: Validate real exact-revision Event transport seam
        run: python scripts/validate_operator_openai_responses_lane_b_event_seam.py
      - name: Validate exact Event seam scope fencing
        run: python scripts/validate_operator_openai_responses_lane_b_event_scope.py
