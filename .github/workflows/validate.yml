name: Validate AI-SDLC protocol

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'profiles/**'
      - 'gates/**'
      - 'examples/**'
      - 'scripts/**'
      - 'requirements-dev.txt'
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'profiles/**'
      - 'gates/**'
      - 'examples/**'
      - 'scripts/**'
      - 'requirements-dev.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/validate_feature_examples.py
