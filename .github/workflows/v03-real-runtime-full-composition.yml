name: Validate v0.3 Full Runtime Composition

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v03-real-runtime-full-composition.yml'
      - 'scripts/v03_real_runtime_full_composition.py'
      - 'scripts/validate_v03_real_runtime_full_composition.py'
      - 'scripts/operator_v03_write_runtime.py'
      - 'scripts/operator_v03_vertical_production_runtime.py'
      - 'scripts/operator_vertical_runtime.py'
      - 'scripts/operator_vertical_gh_aw.py'
      - 'scripts/operator_vertical_gh_aw_actions_transport.py'
      - 'scripts/operator_vertical_gh_aw_attempt_binding.py'
      - 'scripts/operator_vertical_gh_aw_github_source.py'
      - 'scripts/operator_decision_feature_truth.py'
      - 'scripts/operator_release_feature_event_gateway.py'
      - 'scripts/provision_v03_real_runtime_fixture.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile full-runtime composition
        run: python -m py_compile scripts/v03_real_runtime_full_composition.py scripts/validate_v03_real_runtime_full_composition.py
      - name: Prove fixed-fixture single-runtime zero-effect composition
        run: PYTHONPATH=scripts python scripts/validate_v03_real_runtime_full_composition.py
