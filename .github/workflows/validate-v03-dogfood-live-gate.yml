name: Synthetic CLI observability proof (no model)
on:
  pull_request:
    paths:
      - '.github/workflows/validate-v03-dogfood-live-gate.yml'
      - 'scripts/validate_v03_detector_protocol_replay.mjs'
permissions:
  contents: read
jobs:
  synthetic-cli-observability:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 581 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install pinned CLI and isolated image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 120 https://github.com/github/copilot-cli/releases/download/v1.0.90/copilot-linux-x64.tar.gz -o "$RUNNER_TEMP/v03-joined-copilot.tar.gz"
          echo "7ebcce0f8a76b826e34c76f214361916b130ca9cf1571adf267fbda38f92b4b6  $RUNNER_TEMP/v03-joined-copilot.tar.gz" | sha256sum --check --status
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          dest = Path(os.environ["RUNNER_TEMP"]) / "v03-joined-copilot"
          dest.mkdir(mode=0o700)
          with tarfile.open(Path(os.environ["RUNNER_TEMP"]) / "v03-joined-copilot.tar.gz", "r:gz") as archive:
              entries = archive.getmembers()
              assert 0 < len(entries) <= 64 and sum(e.size for e in entries) <= 524288000
              for entry in entries:
                  path = PurePosixPath(entry.name)
                  assert not path.is_absolute() and ".." not in path.parts and "\\" not in entry.name
                  assert entry.isdir() or entry.isfile()
                  assert 0 <= entry.size <= 314572800
              archive.extractall(dest, filter="data")
          assert (dest / "copilot").is_file() and not (dest / "copilot").is_symlink()
          PY
          docker pull ghcr.io/github/gh-aw-firewall/agent:0.28.23@sha256:2c78aaba1c108e130e2d6d01e4f2cca334ea04c53e6f258913ac34173fe7e3b2
      - name: Verify native protocol capture with isolated synthetic tools
        shell: bash
        run: |
          set -euo pipefail
          name="v03-observe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          timeout --signal=TERM --kill-after=15s 120s docker run --name "$name" --pull=never --rm --init \
            --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --read-only --workdir /tmp \
            --tmpfs "/tmp:rw,nosuid,nodev,exec,uid=$(id -u),gid=$(id -g),mode=700" \
            --mount "type=bind,src=$RUNNER_TEMP/v03-joined-copilot,dst=/inputs/copilot,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/validate_v03_detector_protocol_replay.mjs,dst=/inputs/replay.mjs,readonly" \
            --env HOME=/tmp/home --env PATH=/usr/local/bin:/usr/bin:/bin \
            --entrypoint node \
            ghcr.io/github/gh-aw-firewall/agent:0.28.23@sha256:2c78aaba1c108e130e2d6d01e4f2cca334ea04c53e6f258913ac34173fe7e3b2 \
            /inputs/replay.mjs /inputs/copilot/copilot /tmp/observe
