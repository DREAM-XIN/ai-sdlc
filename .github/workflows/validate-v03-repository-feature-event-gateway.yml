name: Validate v0.3 Repository Feature Event Gateway

on:
  pull_request:
    paths:
      - 'scripts/operator_release_feature_event_gateway.py'
      - 'scripts/validate_operator_release_feature_event_gateway.py'
      - 'scripts/validate_operator_repository_feature_event_gateway.py'
      - 'scripts/resolve_feature_event_push.py'
      - '.github/workflows/ai-sdlc-persist.yml'
      - '.github/workflows/validate-v03-repository-feature-event-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_operator_release_feature_event_gateway.py
      - run: PYTHONPATH=scripts python scripts/validate_operator_repository_feature_event_gateway.py
