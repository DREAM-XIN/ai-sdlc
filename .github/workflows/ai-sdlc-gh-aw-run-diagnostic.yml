name: Pin current historical Worker credential identity
on:
  push:
    branches: ['dogfood/gh-aw-diagnose-key-fence-20261008']
    paths: ['dogfood/gh-aw-diagnose.yaml']
permissions:
  contents: write
jobs:
  pin-key:
    if: ${{ github.repository == 'DREAM-XIN/ai-sdlc' && github.ref_name == 'dogfood/gh-aw-diagnose-key-fence-20261008' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Pin public fingerprint without exposing the private key
        id: fingerprint
        env:
          APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          APP_CLIENT_ID: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "$APP_PRIVATE_KEY"
          test "$APP_CLIENT_ID" = Iv23libojxnnuF43petx
          public_fingerprint="$(printf '%s' "$APP_PRIVATE_KEY" | openssl pkey -pubout -outform DER | sha256sum | cut -d ' ' -f 1)"
          [[ "$public_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          printf 'public_fingerprint=%s\n' "$public_fingerprint" >> "$GITHUB_OUTPUT"
      - name: Authenticate the pinned key with read-only repository grant
        id: probe
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          owner: DREAM-XIN
          repositories: ai-sdlc
          permission-contents: read
          skip-token-revoke: false
      - name: Persist non-authoritative public identity diagnostic
        env:
          APP_SLUG: ${{ steps.probe.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.probe.outputs.installation-id }}
          PUBLIC_FINGERPRINT: ${{ steps.fingerprint.outputs.public_fingerprint }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = dream-xin-ai-sdlc-runtime-operator
          test "$INSTALLATION_ID" = 153325330
          python - <<'PY'
          import json, os
          doc = {
              "schema_version": "ai-sdlc.v03-historical-worker-credential-observation/v1",
              "repository": "dream-xin/ai-sdlc",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha": os.environ["GITHUB_SHA"],
              "historical_worker_run_id": 37204777409,
              "historical_workflow_blob_sha": "e618477192ef8cde47cf36a9b162aee1069f3eef",
              "credential_identity": "AI_SDLC_RUNTIME_APP_PRIVATE_KEY",
              "client_id": "Iv23libojxnnuF43petx",
              "app_slug": os.environ["APP_SLUG"],
              "installation_id": int(os.environ["INSTALLATION_ID"]),
              "public_key_sha256": os.environ["PUBLIC_FINGERPRINT"],
              "current_key_authentication": "ACCEPTED",
              "provider_invalidation": False,
              "future_attempts_fenced": False,
              "recovery_authority": False,
              "release_eligible": False,
          }
          with open("dogfood/gh-aw-key-identity.json", "w", encoding="utf-8") as f:
              json.dump(doc, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(doc, sort_keys=True))
          PY
          git config user.name 'ai-sdlc[bot]'
          git config user.email 'ai-sdlc[bot]@users.noreply.github.com'
          git add -- dogfood/gh-aw-key-identity.json
          git commit -m 'dogfood: pin public identity of current historical Worker key'
          git push origin "HEAD:${GITHUB_REF_NAME}"
