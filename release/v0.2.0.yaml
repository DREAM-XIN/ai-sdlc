known_release_blockers: []

cleared_release_evidence:
  feature_context_dogfood:
    issue: '#128'
    pull_request: '#144'
    validation_runs: ['31299038228', '31299047295']
    final_revision: 10
    result: pass
  private_repeated_dogfood:
    target: private-dogfood-target-a
    final_revision: 7
    code_gate: PASS
    verification_gate: PASS
    result: pass
  public_external_full_lifecycle:
    lifecycle: requirement-through-release-gate
    result: pass
  installation_preflight_matrix:
    materially_different_private_targets: 2
    result: pass
  publication_safety:
    public_release_audit_run: '31298771874'
    result: pass

release_decision:
  repeated_cross_repo_matrix: narrowed
  required_lifecycle_targets:
    - public-external-full-lifecycle
    - private-target-a-repeated-lifecycle
  deferred_not_blocking:
    - id: private-target-b-security-hardening
      feature: F-PASSWORD-MANAGER-CRYPTO-COMPAT-0001
      observed_state: implementation-WORKING
      disposition: post-v0.2-hardening
      gate_waiver: false
  rationale: >-
    The completed lifecycle matrix already proves full standard-feature execution
    in a public external target and independent review/verification in a private
    repeated-dogfood target, while installation preflight is proven across two
    materially different private repositories. The remaining security-sensitive
    target is deferred without changing its Feature state or Gate outcomes.

release_policy:
  publish_tag_after_blockers_clear: true
  production_caller_pin: full-commit-sha
  require_green_repository_validation: true
  require_required_pr_gate: true
  require_repeated_cross_repo_dogfood: true
  repeated_cross_repo_matrix: narrowed-by-explicit-release-decision
