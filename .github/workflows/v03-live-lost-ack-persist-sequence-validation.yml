name: Validate v0.3 Live Lost ACK Persist Sequence

on:
  pull_request:
    branches:
      - main
      - verification/v03-live-evidence-provenance-221
    paths:
      - '.github/workflows/v03-live-lost-ack-persist-sequence-validation.yml'
      - 'scripts/v03_lost_ack_persist_live_sequence.py'
      - 'scripts/validate_v03_lost_ack_persist_live_sequence.py'
      - 'scripts/v03_lost_ack_live_runner.py'
      - 'scripts/v03_persist_ack_loss_live_runner.py'
      - 'scripts/v03_live_evidence_provenance.py'
      - 'scripts/v03_effect_safety_live_ledger.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile four-process live sequence wrapper
        run: python -m py_compile scripts/v03_lost_ack_persist_live_sequence.py scripts/validate_v03_lost_ack_persist_live_sequence.py
      - name: Prove exact provenance and two-of-thirteen ledger scope
        run: PYTHONPATH=scripts python scripts/validate_v03_lost_ack_persist_live_sequence.py
