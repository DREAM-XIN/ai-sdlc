name: Validate v0.3 Real Runtime Fixture Provisioner

on:
  pull_request:
    paths:
      - 'scripts/provision_v03_real_runtime_fixture.py'
      - 'scripts/validate_v03_real_runtime_fixture_provisioner.py'
      - 'scripts/validate_v03_real_runtime_fixture_resume.py'
      - 'scripts/validate_feature_manifest.py'
      - '.github/workflows/provision-v03-real-runtime-fixture.yml'
      - '.github/workflows/validate-v03-real-runtime-fixture-provisioner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=scripts python scripts/validate_v03_real_runtime_fixture_provisioner.py
      - run: PYTHONPATH=scripts python scripts/validate_v03_real_runtime_fixture_resume.py
