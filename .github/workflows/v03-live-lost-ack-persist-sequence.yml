name: v0.3 Live Lost ACK and Persist Sequence

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main live release sequence
        run: exit 1

  live-sequence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate trusted installation configuration
        env:
          ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          APP_CLIENT_ID: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          test -n "${APP_CLIENT_ID:-}"
          test -n "${APP_PRIVATE_KEY:-}"
          case "${APP_INTEGRATION_ID:-}" in *[!0-9]*|'') exit 1 ;; esac
          test "$APP_INTEGRATION_ID" -gt 0

      - name: Create bounded Runtime App Feature Event token
        id: event-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.event-token.outputs.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt

      - name: Lost ACK phase 1 — exact launch then hard process crash
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.event-token.outputs.app-slug }}
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
          AI_SDLC_EVENT_WRITE_TOKEN: ${{ steps.event-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence
          set +e
          PYTHONPATH=scripts python scripts/v03_lost_ack_persist_live_sequence.py --phase lost-ack-phase1
          rc=$?
          set -e
          test "$rc" -eq 86
          test -s evidence/v03-live-lost-ack-phase1.json

      - name: Lost ACK phase 2 — fresh process G1 same-key takeover and adoption
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.event-token.outputs.app-slug }}
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
          AI_SDLC_EVENT_WRITE_TOKEN: ${{ steps.event-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=scripts python scripts/v03_lost_ack_persist_live_sequence.py --phase lost-ack-phase2
          test -s evidence/v03-live-lost-ack.json

      - name: Persist ACK-loss phase 1 — same Worker result, exact Event write, hard crash before local ACK
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.event-token.outputs.app-slug }}
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
          AI_SDLC_EVENT_WRITE_TOKEN: ${{ steps.event-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          set +e
          PYTHONPATH=scripts python scripts/v03_lost_ack_persist_live_sequence.py --phase persist-phase1
          rc=$?
          set -e
          test "$rc" -eq 87
          test -s evidence/v03-live-persist-ack-loss-phase1.json

      - name: Persist ACK-loss phase 2 — fresh exact lookup, seal provenance, evaluate closed ledger
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.event-token.outputs.app-slug }}
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
          AI_SDLC_EVENT_WRITE_TOKEN: ${{ steps.event-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=scripts python scripts/v03_lost_ack_persist_live_sequence.py --phase persist-phase2-finalize
          test -s evidence/v03-live-persist-ack-loss.json
          test -s evidence/v03-effect-safety-live-authority.json
          test -s evidence/v03-live-lost-ack-persist-provenance.json
          test -s evidence/v03-effect-safety-live-ledger-partial.json

      - name: Upload exact two-scenario live evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-live-lost-ack-persist-sequence
          path: |
            evidence/v03-live-lost-ack-phase1.json
            evidence/v03-live-lost-ack.json
            evidence/v03-live-persist-ack-loss-phase1.json
            evidence/v03-live-persist-ack-loss.json
            evidence/v03-effect-safety-live-authority.json
            evidence/v03-live-lost-ack-persist-provenance.json
            evidence/v03-effect-safety-live-ledger-partial.json
          if-no-files-found: warn

      - name: Publish exact partial-ledger result to Issue 221
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import request
          ledger_path = Path('evidence/v03-effect-safety-live-ledger-partial.json')
          provenance_path = Path('evidence/v03-live-lost-ack-persist-provenance.json')
          ledger = json.loads(ledger_path.read_text()) if ledger_path.is_file() else {}
          provenance = json.loads(provenance_path.read_text()) if provenance_path.is_file() else {}
          lines = [
              '<!-- ai-sdlc-v03-live-lost-ack-persist-sequence -->',
              f"v0.3 live lost-ACK/Persist sequence job: **{os.environ['JOB_STATUS']}**",
              f"Run: `{os.environ['RUN_ID']}`",
              f"Trusted-main head: `{os.environ['HEAD_SHA']}`",
          ]
          if ledger and provenance:
              lines += [
                  f"Ledger status: **{ledger.get('status', '')}**",
                  f"Satisfied Issue #221 rows: `{', '.join(ledger.get('satisfied_scenarios') or [])}`",
                  f"Unresolved row count: `{len(ledger.get('unresolved_scenarios') or [])}`",
                  f"Evidence record: `{provenance.get('record_id', '')}`",
                  f"Artifact SHA-256: `{provenance.get('artifact_sha256', '')}`",
                  'This run is intentionally only 2/13 rows; overall Issue #221 remains unresolved.',
              ]
          else:
              lines.append('No final provenance-bound partial ledger was retained; neither live row is accepted as release evidence.')
          body = json.dumps({'body': '\n'.join(lines)}).encode()
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          req = request.Request(
              f"{api}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/221/comments",
              data=body,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=20) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(1)
          PY
