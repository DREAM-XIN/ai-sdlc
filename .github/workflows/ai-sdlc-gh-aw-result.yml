name: AI-SDLC gh-aw Result

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target Feature repository in owner/repo form; empty means current repository
        required: false
        default: ''
        type: string
      target_ref:
        description: Non-default Feature branch/ref that owns the authoritative Manifest
        required: true
        type: string
      worker_result_json:
        description: gh-aw-worker-result-v0.1 JSON payload
        required: true
        type: string
      persist:
        description: Commit the validated Feature Event and updated Manifest
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  result:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target repository identity
        id: target
        shell: bash
        env:
          INPUT_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          repository="${INPUT_REPOSITORY:-$GITHUB_REPOSITORY}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "target_repository must be owner/repo" >&2
            exit 2
          fi
          owner="${repository%%/*}"
          repo_name="${repository#*/}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo_name=$repo_name" >> "$GITHUB_OUTPUT"
          if [[ "$repository" == "$GITHUB_REPOSITORY" ]]; then
            echo "cross_repo=false" >> "$GITHUB_OUTPUT"
          else
            echo "cross_repo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint target repository write token
        id: target_token
        if: ${{ steps.target.outputs.cross_repo == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo_name }}
          permission-contents: write
          permission-pull-requests: read

      - name: Resolve target default branch
        id: default_branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target.outputs.cross_repo == 'true' && steps.target_token.outputs.token || github.token }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          default_branch=$(gh api "repos/$TARGET_REPOSITORY" --jq '.default_branch')
          test -n "$default_branch"
          echo "value=$default_branch" >> "$GITHUB_OUTPUT"

      - name: Fence Operation-bound Vertical legacy Feature persistence
        id: legacy_fence
        if: ${{ inputs.persist }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          WORKER_RESULT_JSON: ${{ inputs.worker_result_json }}
        run: |
          set -euo pipefail
          source_run_url=$(python - <<'PY'
          import json, os
          payload=json.loads(os.environ['WORKER_RESULT_JSON'])
          rows=[
              str(item.get('uri') or '')
              for item in payload.get('evidence', [])
              if isinstance(item, dict) and item.get('type') == 'runtime-run'
          ]
          if len(rows) == 1:
              print(rows[0])
          PY
          )
          prefix="https://github.com/$CONTROL_REPOSITORY/actions/runs/"
          case "$source_run_url" in
            "$prefix"*) source_run_id="${source_run_url#${prefix}}" ;;
            *) echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [[ ! "$source_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title=$(gh api "repos/$CONTROL_REPOSITORY/actions/runs/$source_run_id" --jq '.display_title')
          if [[ "$title" =~ ^AI-SDLC\ gh-aw\ dispatch-[A-Za-z0-9._:-]+$ ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Operation-bound Vertical run detected; legacy Feature persistence is fenced"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted control plane
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: runtime
          persist-credentials: false

      - name: Checkout target workspace
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.target.outputs.repository }}
          token: ${{ steps.target.outputs.cross_repo == 'true' && steps.target_token.outputs.token || github.token }}
          ref: ${{ inputs.target_ref }}
          path: workspace
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        with:
          python-version: '3.12'
      - if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        run: pip install -r runtime/requirements-dev.txt

      - name: Validate target branch
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          DEFAULT_BRANCH: ${{ steps.default_branch.outputs.value }}
        run: |
          git -C workspace check-ref-format --branch "$TARGET_REF" >/dev/null
          if [[ "$TARGET_REF" == "$DEFAULT_BRANCH" ]]; then
            echo "gh-aw autonomous result persistence must target a non-default branch" >&2
            exit 2
          fi

      - name: Materialize and validate worker result
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        shell: bash
        env:
          WORKER_RESULT_JSON: ${{ inputs.worker_result_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(os.environ['WORKER_RESULT_JSON'])
          Path('gh-aw-worker-result.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python runtime/scripts/gh_aw_adapter.py result-to-event \
            gh-aw-worker-result.json \
            --output proposed-event.yaml

      - name: Resolve canonical state paths
        id: paths
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          event = yaml.safe_load(open('proposed-event.yaml'))
          feature = event['feature_id']
          event_id = event['id']
          print(f'manifest_path=state/features/{feature}.yaml')
          print(f'event_path=state/events/{feature}/{event_id}.yaml')
          PY

      - name: Resolve trusted implementation candidate
        id: candidate
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target.outputs.cross_repo == 'true' && steps.target_token.outputs.token || github.token }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          read -r status pr_url < <(python - <<'PY'
          import json
          result = json.load(open('gh-aw-worker-result.json'))
          pulls = [a.get('uri') for a in result.get('artifacts', []) if a.get('type') == 'pull-request']
          if result.get('status') != 'COMPLETED':
              print(result.get('status', ''), '')
          elif len(pulls) != 1:
              raise SystemExit('COMPLETED gh-aw Developer result must contain exactly one pull-request artifact')
          else:
              print('COMPLETED', pulls[0])
          PY
          )
          if [ "$status" != "COMPLETED" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prefix="https://github.com/$TARGET_REPOSITORY/pull/"
          case "$pr_url" in
            "$prefix"*) ;;
            *) echo "worker pull-request artifact is outside trusted target repository" >&2; exit 2 ;;
          esac
          pr_number="${pr_url#${prefix}}"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "worker pull-request artifact is not a canonical PR URL" >&2
            exit 2
          fi
          canonical=$(gh api "repos/$TARGET_REPOSITORY/pulls/$pr_number" --jq '.html_url')
          head_sha=$(gh api "repos/$TARGET_REPOSITORY/pulls/$pr_number" --jq '.head.sha')
          test "$canonical" = "$pr_url"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Bind trusted candidate to proposed Event
        if: ${{ (!inputs.persist || steps.legacy_fence.outputs.allowed == 'true') && steps.candidate.outputs.present == 'true' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          test -f "workspace/$MANIFEST_PATH"
          python runtime/scripts/gh_aw_candidate_event.py \
            "workspace/$MANIFEST_PATH" proposed-event.yaml \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --output proposed-event.with-candidate.yaml
          mv proposed-event.with-candidate.yaml proposed-event.yaml

      - name: Build persistence plan
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          EVENT_PATH: ${{ steps.paths.outputs.event_path }}
          TARGET_REF: ${{ inputs.target_ref }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          test -f "workspace/$MANIFEST_PATH"
          test ! -L "workspace/$MANIFEST_PATH"
          python runtime/scripts/ingest_feature_event.py \
            "workspace/$MANIFEST_PATH" proposed-event.yaml \
            --event-path "$EVENT_PATH" \
            --repository "$REPOSITORY" \
            --manifest-path "$MANIFEST_PATH" \
            --target-ref "$TARGET_REF" \
            --output persistence-plan.json

      - name: Materialize proposed Feature state
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          EVENT_PATH: ${{ steps.paths.outputs.event_path }}
        run: |
          mkdir -p -- "workspace/$(dirname -- "$EVENT_PATH")"
          cp -- proposed-event.yaml "workspace/$EVENT_PATH"
          MANIFEST_PATH="$MANIFEST_PATH" python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('persistence-plan.json').read_text(encoding='utf-8'))
          target = Path('workspace') / os.environ['MANIFEST_PATH']
          target.write_text(plan['plan']['manifest']['content'], encoding='utf-8')
          PY
          python runtime/scripts/validate_feature_manifest.py "workspace/$MANIFEST_PATH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.persist || steps.legacy_fence.outputs.allowed == 'true' }}
        with:
          name: ai-sdlc-gh-aw-result
          path: |
            gh-aw-worker-result.json
            proposed-event.yaml
            persistence-plan.json

      - name: Persist validated result
        if: ${{ inputs.persist && steps.legacy_fence.outputs.allowed == 'true' }}
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          DEFAULT_BRANCH: ${{ steps.default_branch.outputs.value }}
          MANIFEST_PATH: ${{ steps.paths.outputs.manifest_path }}
          EVENT_PATH: ${{ steps.paths.outputs.event_path }}
        run: |
          python runtime/scripts/verify_git_write_precondition.py \
            --repo-dir workspace \
            --target-ref "$TARGET_REF" \
            --default-branch "$DEFAULT_BRANCH"

          git -C workspace config user.name "ai-sdlc[bot]"
          git -C workspace config user.email "ai-sdlc[bot]@users.noreply.github.com"
          git -C workspace add -- "$MANIFEST_PATH" "$EVENT_PATH"
          if git -C workspace diff --cached --quiet; then
            echo "No gh-aw result changes to persist"
            exit 0
          fi
          git -C workspace commit -m "chore(ai-sdlc): ingest gh-aw worker result"
          git -C workspace push origin "HEAD:$TARGET_REF"
