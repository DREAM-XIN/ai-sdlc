name: Validate v0.3 Effect Safety Live Ledger

on:
  pull_request:
    branches:
      - main
      - verification/v03-live-persist-ack-loss-221
    paths:
      - '.github/workflows/v03-effect-safety-live-ledger.yml'
      - 'scripts/v03_effect_safety_live_ledger.py'
      - 'scripts/validate_v03_effect_safety_live_ledger.py'
      - 'scripts/v03_lost_ack_live_runner.py'
      - 'scripts/v03_persist_ack_loss_live_runner.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile closed live evidence ledger
        run: python -m py_compile scripts/v03_effect_safety_live_ledger.py scripts/validate_v03_effect_safety_live_ledger.py
      - name: Prove provenance binding, closed scenario set and anti-overclaim
        run: PYTHONPATH=scripts python scripts/validate_v03_effect_safety_live_ledger.py
