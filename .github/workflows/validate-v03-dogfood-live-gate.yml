name: Synthetic AWF preservation proof (no model)
on:
  pull_request:
    paths:
      - '.github/workflows/validate-v03-dogfood-live-gate.yml'
      - 'scripts/validate_v03_detector_protocol_replay.mjs'
permissions:
  contents: read
jobs:
  synthetic-awf-preservation:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 581 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install pinned CLI and isolated image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 120 https://github.com/github/copilot-cli/releases/download/v1.0.90/copilot-linux-x64.tar.gz -o "$RUNNER_TEMP/v03-joined-copilot.tar.gz"
          echo "7ebcce0f8a76b826e34c76f214361916b130ca9cf1571adf267fbda38f92b4b6  $RUNNER_TEMP/v03-joined-copilot.tar.gz" | sha256sum --check --status
          python3 - <<'PY'
          import os, tarfile
          from pathlib import Path, PurePosixPath
          dest = Path(os.environ["RUNNER_TEMP"]) / "v03-joined-copilot"
          dest.mkdir(mode=0o700)
          with tarfile.open(Path(os.environ["RUNNER_TEMP"]) / "v03-joined-copilot.tar.gz", "r:gz") as archive:
              entries = archive.getmembers()
              assert 0 < len(entries) <= 64 and sum(e.size for e in entries) <= 524288000
              for entry in entries:
                  path = PurePosixPath(entry.name)
                  assert not path.is_absolute() and ".." not in path.parts and "\\" not in entry.name
                  assert entry.isdir() or entry.isfile()
                  assert 0 <= entry.size <= 314572800
              archive.extractall(dest, filter="data")
          assert (dest / "copilot").is_file() and not (dest / "copilot").is_symlink()
          PY
          docker pull ghcr.io/github/gh-aw-firewall/agent:0.28.23@sha256:2c78aaba1c108e130e2d6d01e4f2cca334ea04c53e6f258913ac34173fe7e3b2
      - name: Prepare pinned actual AWF preservation fixture
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --location --silent --show-error --max-time 120 https://github.com/github/gh-aw-firewall/releases/download/v0.28.23/awf-bundle.js -o "$RUNNER_TEMP/awf-bundle.js"
          test "$(wc -c < "$RUNNER_TEMP/awf-bundle.js")" = 1229802
          echo "cf611445d648fe8ec03eb7b1e6e47ae4870d375f88e449adce7176c256f7f3b8  $RUNNER_TEMP/awf-bundle.js" | sha256sum --check --status
          docker pull ghcr.io/github/gh-aw-firewall/squid:0.28.23@sha256:02ffc56dd40158223064ef03a78c2d9717473c93723b4e403d455ea6f0b09ae0
          docker pull ghcr.io/github/gh-aw-firewall/api-proxy:0.28.23@sha256:c15c3d1208df10c5b588a3657be53742aa982ae0909d1eb1812525268794ca64
          test ! -e /tmp/gh-aw/awf-native-proof
          mkdir -p /tmp/gh-aw
          mkdir -m 700 /tmp/gh-aw/awf-native-proof
          cp -a "$RUNNER_TEMP/v03-joined-copilot" /tmp/gh-aw/awf-native-proof/copilot
          cp scripts/validate_v03_detector_protocol_replay.mjs /tmp/gh-aw/awf-native-proof/replay.mjs
      - name: Verify actual AWF native preservation with synthetic protocol
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/gh-aw/awf-native-proof/replay.mjs awf-host "$RUNNER_TEMP/awf-bundle.js"
