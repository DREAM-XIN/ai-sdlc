version: 0.3.0
status: planning
base_version: 0.2.0
tracking_issue: '#205'
final_manifest: release/v0.3.0.yaml
release_theme: ai-operated-sdlc
canonical_api_version: ai-sdlc.operator/v1
operation_event_version: ai-sdlc.operation-event/v1
evidence_ledger: release/v0.3.0-evidence.yaml
release_ready: false

release_spec_amendments:
  - issue: '#219'
    proposal_pr: '#224'
    reviewed_head: e809f587ce3c52cb18468a49700c8eb07b9123bd
    independent_review_id: '4896122306'
    disposition: PASS_FOR_AMENDMENT_FREEZE

release_intent: >-
  Productize the deterministic AI-SDLC control kernel behind a durable typed
  Operator surface while preserving lifecycle authority, independent role
  execution, immutable candidate evidence, explicit external-launch and
  Feature-Persist linearization, and trusted GitHub-backed audit.

required_release_slice:
  starting_condition: installed-project-with-eligible-feature
  lifecycle:
    - ai-client-capability-status-and-inbox
    - durable-operation-start-or-discovery
    - developer
    - independent-code-review
    - durable-review-remediation-when-required
    - independent-re-review
    - qa-verification
    - needs-user-or-done
  user_experience:
    repeated_continue_messages_required: false
    routine_manual_github_operations_after_installation: false
    session_survival_required: true

client_contract:
  canonical_api: ai-sdlc.operator/v1
  required_supported_ai_client_adapters: 2
  materially_independent: true
  common_conformance_subset:
    - system.capabilities
    - feature.status
    - operator.inbox
    - operation.status
    - decision.list
    - notification.list
  both_require:
    - api-version-semantics
    - structured-error-semantics
    - identity-propagation
    - unsupported-capability-behavior
  minimum_write_capable_adapters: 1
  required_write_slice:
    - operation.start
    - operation.cancel
    - decision.respond
    - notification.ack

worker_result_contract:
  arbitrary_executable_feature_events: forbidden
  trusted_translation_required: true
  trusted_context_fields:
    - operation-id
    - operation-generation
    - semantic-effect-key
    - external-dispatch-key
    - dispatch-id
    - target-repository
    - feature-id
    - expected-revision
    - target-ref
    - candidate-pr-number-when-applicable
    - candidate-head-sha-when-applicable
    - task-id
    - role
    - runtime-receipt-identity
  reviewer_qa_candidate_head_sha_required: true
  current_head_revalidation_before_persist: true
  head_change_invalidates_stale_candidate_evidence: true
  head_change_requires_fresh_exact_candidate_bound_work: true
  head_change_alone_authorizes_new_external_dispatch: false
  fresh_candidate_external_dispatch_requires_effect_lineage_clearance: true
  required_translators:
    - developer-result-translator
    - review-verdict-translator
    - verification-verdict-translator

operation_store:
  authority: orchestration-only
  trusted_location: control-repository-protected-state-ref
  target_feature_branch_write_access: forbidden
  append_only_journal: required
  deterministic_projection: required
  git_ref_compare_and_set: required
  state_ref_selected_by_feature_branch: forbidden
  operation_generation_fencing: required
  one_active_generation_per_feature: true

external_semantic_reservation:
  required: true
  generation_independent_identity: true
  identity_fields:
    - target-repository
    - feature-id
    - expected-revision
    - current-stage
    - task-identity
    - role
    - candidate-head-sha-when-candidate-bound
  operation_generation_in_identity: false
  stable_external_dispatch_key: required
  reservation_survives_generation_takeover: true
  invariant: >-
    One exact semantic reservation has at most one durable external dispatch
    identity even when Operation ownership moves across generations. Cross-revision
    continuity is additionally governed by Effect Lineage.

effect_lineage:
  required: true
  stable_across_when_causal_work_same:
    - operation-generation
    - feature-revision
    - candidate-projection
    - operation-restart-or-takeover
  exact_semantic_effect_key_remains_revision_stage_candidate_bound: true
  trusted_causal_work_identity_required: true
  causal_work_id_from_durable_lifecycle_or_task_provenance: true
  required_relations:
    - predecessor
    - blocks_on
    - supersedes
    - adopts
  launch_eligible_members_shape: ordered-chain
  lineage_gate_before_new_exact_reservation: true
  unresolved_predecessor_blocks_new_external_identity: true
  successor_proposal_has_independent_external_identity: false
  concurrent_active_descendants: forbidden
  candidate_or_revision_change_alone_proves_new_effect: false
  schema_version_required: true
  conceptual_schema_identifiers:
    - ai-sdlc.effect-lineage/v1
    - ai-sdlc.effect-lineage-event/v1
  exact_schema_names_implementation_reviewable: true

semantic_dispatch_claim:
  generation_specific_ownership: true
  references_generation_independent_reservation: true
  claim_before_launch_processing: true
  equivalent_retry_returns_existing_reservation_or_claim: true

launch_linearization:
  required: true
  linearization_event: dispatch.launch.authorized
  durable_before_external_call: true
  binds:
    - operation-id
    - operation-generation
    - semantic-effect-key
    - external-dispatch-key
    - dispatch-id
    - feature-id
    - expected-revision
    - stage
    - role
    - candidate-head-sha-when-applicable
  ordering:
    cancellation_or_supersession_before_linearization: launch-forbidden
    linearization_before_cancellation_or_supersession: exact-authorized-launch-may-complete
  post_cancel_rule: >-
    A launch linearized before cancellation may still execute using the exact
    existing external dispatch key, but its eventual result does not gain
    automatic lifecycle Persist authority.
  stale_generation_new_launch: forbidden

external_dispatch_recovery:
  stable_external_dispatch_key: required
  trusted_launch_receipt_lookup: required
  lookup_states:
    - NOT_LAUNCHED
    - LAUNCHED
    - UNKNOWN
  not_launched_behavior: retry-same-key-under-existing-fences
  not_launched_after_durable_launch_authorization_revokes_authority: false
  launch_authorized_not_launched_successor_behavior: same-existing-key-or-blocked
  stronger_no_duplicate_proof_required_for_authorized_predecessor_retirement: true
  launched_behavior: adopt-existing-receipt-no-relaunch
  unknown_behavior: blocked-no-speculative-relaunch
  missing_local_worker_dispatched_event_does_not_prove_absence: true

unknown_reservation_takeover:
  required: true
  unresolved_reservation_survives_operation_generation: true
  new_generation_inherits_same_semantic_effect_key: true
  new_generation_inherits_same_external_dispatch_key: true
  new_key_for_same_semantic_task_while_unknown: forbidden
  generation_change_alone_can_retire_unknown: false
  revision_or_candidate_change_alone_can_retire_unknown: false
  unresolved_state: BLOCKED

unknown_resolution:
  allowed_outcomes:
    - CORRELATE_EXISTING_RECEIPT
    - PROVE_NOT_LAUNCHED
    - RETIRE_OBSOLETE_NO_DUPLICATE_PROVEN
    - REMAIN_BLOCKED
  generic_retry_or_ignore_bypass: forbidden
  generation_revision_candidate_or_restart_bypass: forbidden
  bounded_trusted_resolution_authority: required
  exact_state_policy_and_evidence_binding: required
  stale_resolution_rejected: true
  prove_not_launched_successor_activation_requires_no_executable_launch_authorization: true
  launch_authorized_not_launched_is_revocation_proof: false
  resolution_itself_dispatches: false

legacy_effect_migration:
  no_lineage_unresolved_behavior: fail-closed
  safe_lineage_attachment_when_provable: allowed
  ambiguous_overlap_state: LEGACY_UNRESOLVED_LINEAGE
  mixed_old_new_semantic_writers: forbidden

persist_linearization:
  required: true
  persist_requested_record: required
  final_generation_cancel_fence_before_feature_write: required
  candidate_head_revalidation_when_applicable: required
  linearization_event: persist.linearized
  linearization_receipt: required
  rules:
    cancellation_before_linearization: reject-feature-write
    linearization_before_cancellation: exact-inflight-write-may-complete
    cancellation_after_linearization: no-subsequent-automatic-progression
    feature_write_ack_loss: query-exact-event-receipt-before-retry
  launch_authorization_does_not_imply_persist_authorization: true

operation_cancel:
  distinct_from_feature_cancel: true
  reports_already_linearized_work: required
  after_cancel:
    unlinearized_external_launches: forbidden
    launch_linearized_exact_dispatch: may-complete
    unlinearized_feature_persist: forbidden
    persist_linearized_exact_write: may-complete
    late_worker_result_auto_persist: forbidden

operation_states:
  top_level:
    - RUNNING
    - WAITING_EXTERNAL
    - NEEDS_USER
    - BLOCKED
    - DONE
    - CANCELLED
  waiting_external:
    - WAITING_WORKER
    - WAITING_CI
    - WAITING_PR
    - WAITING_CALLBACK
  needs_user:
    - NEEDS_CLARIFICATION
    - NEEDS_AUTHORIZATION
    - NEEDS_ACCEPTANCE
    - NEEDS_CREDENTIAL_SETUP
  terminal:
    - DONE
    - CANCELLED
  recoverable_suspended:
    - BLOCKED

authorization_model:
  trusted_sources:
    - protected-default-branch-configuration
    - installation-level-configuration
    - trusted-control-repository-policy
  feature_branch_can_tighten: true
  feature_branch_can_expand: false
  generic_natural_language_approval_is_sufficient: false
  decision_binding:
    - decision-id
    - decision-type
    - feature-id
    - operation-id
    - operation-generation
    - expected-revision
    - target-ref
    - candidate-head-sha-when-applicable
    - allowed-choice
    - trusted-policy-ref-or-digest
    - responder-identity
    - expiry

notification_outbox:
  required: true
  required_types:
    - decision.requested
    - operation.blocked
    - operation.completed
    - authorization.expiring
  new_session_discovery:
    - unfinished-operations
    - pending-decisions
    - unread-notifications
  bounded_ack_operation: notification.ack

acceptance_policy:
  default_standard_feature:
    ai_recommendation_allowed: true
    ai_recommendation_is_human_acceptance_evidence: false
    human_product_decision_required: true

