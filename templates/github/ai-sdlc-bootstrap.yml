name: AI-SDLC Bootstrap

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Existing branch/ref to receive the Feature Manifest
        required: true
        type: string
      bootstrap_path:
        description: Repository-relative Feature Bootstrap YAML path
        required: true
        type: string
      manifest_path:
        description: Feature Manifest path under state/features/
        required: true
        type: string
      persist:
        description: Commit and push the generated Feature Manifest
        required: true
        default: false
        type: boolean
      allow_default_branch:
        description: Explicitly permit persistence to the default branch
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      # Installer must replace this placeholder with a reviewed full AI-SDLC commit SHA.
      - name: Bootstrap AI-SDLC Feature Manifest
        id: control
        uses: DREAM-XIN/ai-sdlc/.github/actions/control@REPLACE_WITH_AI_SDLC_FULL_SHA # ai-sdlc-install-placeholder
        with:
          operation: bootstrap
          repository: ${{ github.repository }}
          target_ref: ${{ inputs.target_ref }}
          manifest_path: ${{ inputs.manifest_path }}
          bootstrap_path: ${{ inputs.bootstrap_path }}
          persist: ${{ inputs.persist }}
          allow_default_branch: ${{ inputs.allow_default_branch }}
          default_branch: ${{ github.event.repository.default_branch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.control.outputs.bootstrap_manifest_path != '' }}
        with:
          name: ai-sdlc-bootstrap-manifest
          path: ${{ steps.control.outputs.bootstrap_manifest_path }}

      - name: Propagate invalid bootstrap result
        if: ${{ steps.control.outputs.exit_code != '0' }}
        shell: bash
        run: exit "${{ steps.control.outputs.exit_code }}"
