name: Validate Production Decision Feature Gateway

on:
  push:
    branches:
      - runtime/decision-feature-gateway-246
    paths:
      - '.github/workflows/operator-decision-feature-gateway-production.yml'
      - 'scripts/operator_production_feature_event_gateway.py'
      - 'scripts/operator_configured_feature_event_gateway.py'
      - 'scripts/operator_exact_feature_event_gateway.py'
      - 'scripts/validate_operator_production_feature_event_gateway.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/operator-decision-feature-gateway-production.yml'
      - 'scripts/operator_production_feature_event_gateway.py'
      - 'scripts/operator_configured_feature_event_gateway.py'
      - 'scripts/operator_exact_feature_event_gateway.py'
      - 'scripts/validate_operator_production_feature_event_gateway.py'

permissions:
  contents: read

jobs:
  production-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate production Decision Event scope
        run: python scripts/validate_operator_production_feature_event_gateway.py
