name: Operator Production Composition Evidence
run-name: Operator production composition evidence ${{ github.sha }}

on:
  push:
    branches:
      - runtime/operator-production-composition-244
    paths:
      - '.github/workflows/operator-production-composition-evidence.yml'
      - '.github/workflows/operator-production-composition.yml'
      - '.github/workflows/operator-mcp-production-launcher.yml'
      - '.github/workflows/operator-runtime-config.yml'
      - '.github/workflows/operator-v03-write-runtime.yml'
      - 'scripts/operator_production_*.py'
      - 'scripts/operator_v03_write_runtime.py'
      - 'scripts/operator_mcp.py'
      - 'scripts/operator_mcp_production.py'
      - 'scripts/operator_mcp_conformance.py'
      - 'scripts/operator_conformance.py'
      - 'scripts/validate_operator_production_*.py'
      - 'scripts/validate_operator_runtime_config.py'
      - 'scripts/validate_operator_v03_write_runtime.py'
      - 'scripts/validate_operator_mcp*.py'
      - 'spec/operator/runtime-config.schema.json'
      - 'examples/operator/production-runtime-config.yaml'

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate MCP canonical boundary and composition
        run: python scripts/validate_operator_mcp.py
      - name: Validate durable target scoping
        run: python scripts/validate_operator_production_scope.py
      - name: Validate trusted runtime config
        run: python scripts/validate_operator_runtime_config.py
      - name: Validate strict backed MCP launcher
        run: python scripts/validate_operator_mcp_production_launcher.py
      - name: Validate v0.3 write-ready vertical runtime
        run: python scripts/validate_operator_v03_write_runtime.py
      - name: Publish non-review implementation evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TARGET_PR: '245'
        run: |
          python - <<'PY'
          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          body = (
              '<!-- ai-sdlc-operator-production-composition-evidence -->\n'
              '**Implementation evidence only — not Code Review / Gate evidence.**\n\n'
              f'Exact head: `{os.environ["HEAD_SHA"]}`\n'
              f'Workflow run: `{os.environ["RUN_ID"]}`\n\n'
              'Passed in one job:\n'
              '- MCP canonical/conformance + production composition\n'
              '- durable Operation target-scope adversarial checks\n'
              '- closed trusted runtime config contract\n'
              '- strict backed MCP launcher boundary\n'
              '- v0.3 vertical write-ready runtime and frozen four-write slice\n\n'
              'This comment does not approve, review, merge, or claim release dogfood.'
          )
          payload = json.dumps({'body': body}).encode()
          req = request.Request(
              f'{api}/repos/{repo}/issues/{os.environ["TARGET_PR"]}/comments',
              data=payload,
              method='POST',
          )
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('Authorization', f'Bearer {os.environ["GITHUB_TOKEN"]}')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')
          req.add_header('Content-Type', 'application/json')
          with request.urlopen(req, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f'failed to publish implementation evidence: HTTP {response.status}')
          PY
