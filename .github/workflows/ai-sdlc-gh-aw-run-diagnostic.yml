name: Verify provider-backed historical Worker credential revocation
on:
  push:
    branches: ['dogfood/gh-aw-diagnose-key-revocation-20261008']
    paths: ['dogfood/gh-aw-key-revocation.yaml', '.github/workflows/ai-sdlc-gh-aw-run-diagnostic.yml']
permissions:
  contents: write
jobs:
  verify-key-fence:
    if: >-
      ${{ github.repository == 'DREAM-XIN/ai-sdlc' && github.ref_name == 'dogfood/gh-aw-diagnose-key-revocation-20261008' && github.event.head_commit.message == 'dogfood: verify revoked historical Worker key' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify exact bounded diagnostic trigger
        run: |
          python - <<'PY'
          import yaml
          expected = {"version": "0.1.0", "purpose": "verify-revoked-historical-worker-key", "historical_run_id": 37204777409}
          assert yaml.safe_load(open("dogfood/gh-aw-key-revocation.yaml")) == expected
          PY
      - name: Observe old-key rejection and distinct recovery-key acceptance
        env:
          OLD_APP_KEY: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          RECOVERY_APP_KEY: ${{ secrets.AI_SDLC_DOGFOOD_RECOVERY_APP_PRIVATE_KEY }}
          RECOVERY_CLIENT_ID: ${{ vars.AI_SDLC_DOGFOOD_RECOVERY_APP_CLIENT_ID }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile, time
          from urllib import request, error
          expected_old_public = "2765aa5be8fe724421236d1ff15fb6ebaccc51b7476d82c27ead7e366cb32636"
          client_id = "Iv23libojxnnuF43petx"
          if os.environ.get("RECOVERY_CLIENT_ID") != client_id:
              raise SystemExit("distinct recovery client-id binding is missing")
          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("unexpected GitHub credential-probe redirect")
          opener = request.build_opener(NoRedirect())
          def b64(raw):
              return base64.urlsafe_b64encode(raw).rstrip(b"=")
          def observe(key):
              if not key:
                  raise SystemExit("both key inputs must be present for the bounded revocation diagnostic")
              raw = key.encode("utf-8")
              public = subprocess.run(["openssl", "pkey", "-pubout", "-outform", "DER"], input=raw, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True).stdout
              fingerprint = hashlib.sha256(public).hexdigest()
              now = int(time.time())
              header = b64(b'{"alg":"RS256","typ":"JWT"}')
              payload = b64(json.dumps({"iat": now - 60, "exp": now + 300, "iss": client_id}, separators=(",", ":")).encode())
              unsigned = header + b"." + payload
              with tempfile.NamedTemporaryFile() as keyfile:
                  keyfile.write(raw)
                  keyfile.flush()
                  signed = subprocess.run(["openssl", "dgst", "-sha256", "-sign", keyfile.name], input=unsigned, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True).stdout
              jwt = (unsigned + b"." + b64(signed)).decode("ascii")
              req = request.Request("https://api.github.com/app", method="GET", headers={"Authorization": "Bearer " + jwt, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "ai-sdlc-bounded-worker-credential-fence"})
              try:
                  with opener.open(req, timeout=30) as response:
                      status = response.status
                      body = json.loads(response.read().decode())
                      headers = response.headers
                  app_id = body.get("id")
                  slug = body.get("slug")
              except error.HTTPError as exc:
                  status, headers, app_id, slug = exc.code, exc.headers, None, None
                  exc.close()
              return {"public_key_sha256": fingerprint, "http_status": status, "app_id": app_id, "app_slug": slug, "github_request_id": headers.get("X-GitHub-Request-Id"), "github_date": headers.get("Date")}
          old = observe(os.environ.get("OLD_APP_KEY", ""))
          if old["public_key_sha256"] != expected_old_public:
              raise SystemExit("historical secret value changed; do not reinterpret the pinned key")
          new = observe(os.environ.get("RECOVERY_APP_KEY", ""))
          valid = old["http_status"] == 401 and new["http_status"] == 200 and new["app_id"] == 4576406 and new["app_slug"] == "dream-xin-ai-sdlc-runtime-operator" and new["public_key_sha256"] != expected_old_public and all(item.get("github_request_id") and item.get("github_date") for item in (old, new))
          doc = {
              "schema_version": "ai-sdlc.v03-historical-worker-key-revocation-observation/v1",
              "repository": "dream-xin/ai-sdlc",
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "historical_run_id": 37204777409,
              "historical_workflow_blob_sha": "e618477192ef8cde47cf36a9b162aee1069f3eef",
              "baseline_run_id": 37723691424,
              "baseline_source_sha": "0bb45670495271a4c4019bba7a7313d338de0272",
              "old_credential_identity": "AI_SDLC_RUNTIME_APP_PRIVATE_KEY",
              "recovery_credential_identity": "AI_SDLC_DOGFOOD_RECOVERY_APP_PRIVATE_KEY",
              "client_id": client_id,
              "old_key": old,
              "recovery_key": new,
              "status": "REVOCATION_OBSERVED" if valid else "BLOCKED",
              "provider_invalidation": valid,
              "future_attempts_fenced": False,
              "recovery_authority": False,
              "release_eligible": False,
          }
          with open("dogfood/gh-aw-key-revocation-observation.json", "w", encoding="utf-8") as f:
              json.dump(doc, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(doc, sort_keys=True))
          if not valid:
              raise SystemExit("no provider-backed key revocation observation")
          PY
      - name: Persist only successful non-release revocation observation
        run: |
          set -euo pipefail
          git config user.name 'ai-sdlc[bot]'
          git config user.email 'ai-sdlc[bot]@users.noreply.github.com'
          git add -- dogfood/gh-aw-key-revocation-observation.json
          git commit -m 'dogfood: record bounded provider key revocation observation'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate cryptographic probe using generated test keys and no provider calls
        run: |
          python - <<'PY'
          import ast, base64, contextlib, hashlib, io, json, os, pathlib, subprocess, tempfile, time
          from unittest.mock import patch
          from urllib import request, error
          raw = pathlib.Path(".github/workflows/ai-sdlc-gh-aw-run-diagnostic.yml").read_text()
          section = raw.split("      - name: Observe old-key rejection and distinct recovery-key acceptance", 1)[1].split("      - name: Persist only", 1)[0]
          python_source = section.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          python_source = "\n".join(line[10:] for line in python_source.splitlines())
          ast.parse(python_source)
          real_old = "2765aa5be8fe724421236d1ff15fb6ebaccc51b7476d82c27ead7e366cb32636"
          old_key = subprocess.run(["openssl", "genpkey", "-algorithm", "RSA", "-pkeyopt", "rsa_keygen_bits:2048"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True).stdout
          new_key = subprocess.run(["openssl", "genpkey", "-algorithm", "RSA", "-pkeyopt", "rsa_keygen_bits:2048"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True).stdout
          public = lambda key: subprocess.run(["openssl", "pkey", "-pubout", "-outform", "DER"], input=key, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True).stdout
          old_public = hashlib.sha256(public(old_key)).hexdigest()
          source = python_source.replace(real_old, old_public)
          def decode(value):
              return base64.urlsafe_b64decode(value + "=" * (-len(value) % 4))
          class Response:
              status = 200
              headers = {"X-GitHub-Request-Id": "TEST:0001", "Date": "Thu, 08 Oct 2026 03:00:00 GMT"}
              def __init__(self, app_id):
                  self.data = {"id": app_id, "slug": "dream-xin-ai-sdlc-runtime-operator"}
              def __enter__(self): return self
              def __exit__(self, *args): pass
              def read(self): return json.dumps(self.data).encode()
          def run_case(*, old_status=401, new_status=200, app_id=4576406, same_key=False, old_missing=False, new_missing=False, fingerprint_changed=False, redirect=False):
              calls = []
              keys = [old_key, old_key if same_key else new_key]
              class FakeOpener:
                  def open(self, req, timeout):
                      assert req.full_url == "https://api.github.com/app" and req.get_method() == "GET" and timeout == 30
                      auth = req.get_header("Authorization")
                      assert auth.startswith("Bearer ")
                      jwt = auth[7:]
                      header, payload, signature = jwt.split(".")
                      assert json.loads(decode(header)) == {"alg": "RS256", "typ": "JWT"}
                      claims = json.loads(decode(payload))
                      assert claims["iss"] == "Iv23libojxnnuF43petx"
                      assert abs(claims["iat"] - (int(time.time()) - 60)) <= 5
                      assert abs(claims["exp"] - (int(time.time()) + 300)) <= 5
                      key = keys[len(calls)]
                      pem = subprocess.run(["openssl", "pkey", "-pubout"], input=key, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=True).stdout
                      with tempfile.NamedTemporaryFile() as pub, tempfile.NamedTemporaryFile() as sig:
                          pub.write(pem); pub.flush()
                          sig.write(decode(signature)); sig.flush()
                          verified = subprocess.run(["openssl", "dgst", "-sha256", "-verify", pub.name, "-signature", sig.name], input=(header + "." + payload).encode(), stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                      assert verified.returncode == 0
                      calls.append(jwt)
                      if redirect:
                          raise RuntimeError("unexpected GitHub credential-probe redirect")
                      status = old_status if len(calls) == 1 else new_status
                      if status != 200:
                          raise error.HTTPError(req.full_url, status, "synthetic provider response", Response.headers, None)
                      return Response(app_id)
              env = {"PATH": os.environ["PATH"], "OLD_APP_KEY": "" if old_missing else old_key.decode(), "RECOVERY_APP_KEY": "" if new_missing else keys[1].decode(), "RECOVERY_CLIENT_ID": "Iv23libojxnnuF43petx", "GITHUB_SHA": "a" * 40, "GITHUB_RUN_ID": "1"}
              case_source = source.replace(old_public, "0" * 64) if fingerprint_changed else source
              captured = io.StringIO()
              namespace = {}
              success = True
              original = os.getcwd()
              with tempfile.TemporaryDirectory() as tmp:
                  try:
                      os.chdir(tmp)
                      with patch.dict(os.environ, env, clear=True), patch("urllib.request.build_opener", return_value=FakeOpener()), contextlib.redirect_stdout(captured):
                          try:
                              exec(compile(case_source, "<bounded-revocation-probe>", "exec"), namespace)
                          except (SystemExit, RuntimeError):
                              success = False
                      path = pathlib.Path("dogfood/gh-aw-key-revocation-observation.json")
                      doc = json.loads(path.read_text()) if path.exists() else None
                  finally:
                      os.chdir(original)
              assert old_key.decode() not in captured.getvalue() and new_key.decode() not in captured.getvalue()
              assert all(jwt not in captured.getvalue() for jwt in calls)
              if doc:
                  assert doc["recovery_authority"] is False and doc["future_attempts_fenced"] is False and doc["release_eligible"] is False
                  assert doc["provider_invalidation"] is success
              return success, doc, namespace
          # Prepare the output directory inside the test process without changing the probe.
          mkdir_original = tempfile.TemporaryDirectory
          class WithOutputDirectory(mkdir_original):
              def __enter__(self):
                  p = super().__enter__()
                  pathlib.Path(p, "dogfood").mkdir()
                  return p
          with patch("tempfile.TemporaryDirectory", WithOutputDirectory):
              ok, doc, namespace = run_case()
              assert ok and doc["status"] == "REVOCATION_OBSERVED"
              for args in ({"old_status": 200}, {"old_status": 403}, {"new_status": 401}, {"app_id": 1}, {"same_key": True}, {"old_missing": True}, {"new_missing": True}, {"fingerprint_changed": True}, {"redirect": True}):
                  assert run_case(**args)[0] is False
          try:
              namespace["NoRedirect"]().redirect_request(None, None, 302, "", {}, "https://example.invalid/")
          except RuntimeError:
              pass
          else:
              raise AssertionError("provider redirect must be rejected")
          print("Credential revocation diagnostic validation: PASS (JWT signatures/claims, exact GET, rejection cases, no secret output, redirects)")
          PY
