name: Materialize trusted v0.3 Vertical policy state

on:
  workflow_dispatch:

permissions: {}

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject non-main materialization
        run: |
          echo 'Trusted Vertical policy materialization is authorized only from refs/heads/main.' >&2
          exit 1

  materialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate trusted installation configuration
        env:
          ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          APP_CLIENT_ID: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          test -n "${APP_CLIENT_ID:-}"
          test -n "${APP_PRIVATE_KEY:-}"
          test -n "${APP_INTEGRATION_ID:-}"
          case "$APP_INTEGRATION_ID" in
            *[!0-9]*|'') echo "AI_SDLC_OPERATOR_APP_INTEGRATION_ID must be a positive integer" >&2; exit 1 ;;
          esac
          test "$APP_INTEGRATION_ID" -gt 0

      - name: Create bounded Operator writer token
        id: writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_SDLC_RUNTIME_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_SDLC_RUNTIME_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-metadata: read

      - name: Checkout exact trusted main with bounded writer credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.writer-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install trusted runtime dependencies
        run: pip install -r requirements-dev.txt

      - name: Prove trusted-main raw writers are quiesced
        run: PYTHONPATH=scripts python scripts/validate_v03_vertical_writer_fence_authority.py

      - name: Probe protection API authority (read-only)
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          STATE_REF: refs/heads/ai-sdlc-operator-state
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ['AI_SDLC_OPERATOR_ADMIN_TOKEN']
          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['STATE_REF'].removeprefix('refs/heads/')
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ai-sdlc-protection-diagnostic',
          }

          def get(path):
              request = Request(f'{api}{path}', headers=headers, method='GET')
              try:
                  with urlopen(request, timeout=15) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except HTTPError as exc:
                  return exc.code, None
              except (URLError, TimeoutError, OSError):
                  return 0, None
              except Exception:
                  return 0, None

          def shape(value):
              if isinstance(value, list):
                  return 'list'
              if isinstance(value, dict):
                  return 'dict'
              if value is None:
                  return 'none'
              return type(value).__name__

          def rules(value):
              if not isinstance(value, dict) or not isinstance(value.get('rules'), list):
                  return []
              return [row for row in value['rules'] if isinstance(row, dict)]

          classic_status, classic = get(
              f'/repos/{repository}/branches/{quote(branch, safe="")}/protection'
          )
          print(
              'protection_probe classic_branch_protection '
              f'status={classic_status} shape={shape(classic)}'
          )

          branch_status, branch_rows = get(
              f'/repos/{repository}/rules/branches/{quote(branch, safe="")}?per_page=100&page=1'
          )
          print(
              'protection_probe branch_rules '
              f'status={branch_status} shape={shape(branch_rows)} '
              f'count={len(branch_rows) if isinstance(branch_rows, list) else -1}'
          )

          ruleset_ids = sorted({
              row.get('ruleset_id')
              for row in (branch_rows if isinstance(branch_rows, list) else [])
              if isinstance(row, dict)
              and isinstance(row.get('ruleset_id'), int)
              and row.get('type') in {'creation', 'update', 'deletion', 'non_fast_forward'}
          })

          for ruleset_id in ruleset_ids:
              detail_path = f'/repos/{repository}/rulesets/{ruleset_id}?includes_parents=true'
              detail_status, detail = get(detail_path)
              detail_rules = rules(detail)
              updates = [row for row in detail_rules if row.get('type') == 'update']
              update_shape = 'not-applicable'
              if updates:
                  if len(updates) != 1:
                      update_shape = 'multiple'
                  elif 'parameters' not in updates[0]:
                      update_shape = 'omitted'
                  elif updates[0].get('parameters') == {'update_allows_fetch_and_merge': False}:
                      update_shape = 'strict-false'
                  else:
                      update_shape = 'other'
              print(
                  'protection_probe ruleset_detail '
                  f'id={ruleset_id} status={detail_status} shape={shape(detail)} '
                  f'update_shape={update_shape} '
                  f'updated_at_present={bool(isinstance(detail, dict) and detail.get("updated_at"))}'
              )

              if detail_status != 200 or not isinstance(detail, dict) or update_shape != 'omitted':
                  continue

              history_path = f'/repos/{repository}/rulesets/{ruleset_id}/history?per_page=1&page=1'
              history_status, history = get(history_path)
              summary = history[0] if isinstance(history, list) and len(history) == 1 and isinstance(history[0], dict) else None
              version_id = summary.get('version_id') if isinstance(summary, dict) else None
              print(
                  'protection_probe ruleset_history '
                  f'id={ruleset_id} status={history_status} shape={shape(history)} '
                  f'count={len(history) if isinstance(history, list) else -1} '
                  f'version_id_valid={isinstance(version_id, int) and version_id > 0} '
                  f'updated_matches_detail={bool(isinstance(summary, dict) and summary.get("updated_at") == detail.get("updated_at"))}'
              )

              if history_status != 200 or not isinstance(version_id, int) or version_id <= 0:
                  continue

              version_path = f'/repos/{repository}/rulesets/{ruleset_id}/history/{version_id}'
              version_status, version = get(version_path)
              state = version.get('state') if isinstance(version, dict) else None
              state_rules = rules(state)
              state_updates = [row for row in state_rules if row.get('type') == 'update']
              state_update_shape = 'missing'
              if len(state_updates) == 1:
                  if state_updates[0].get('parameters') == {'update_allows_fetch_and_merge': False}:
                      state_update_shape = 'strict-false'
                  elif 'parameters' not in state_updates[0]:
                      state_update_shape = 'omitted'
                  else:
                      state_update_shape = 'other'
              identity_fields = (
                  'id', 'name', 'target', 'source_type', 'source',
                  'enforcement', 'conditions', 'bypass_actors',
              )
              identity_matches = bool(
                  isinstance(state, dict)
                  and all(state.get(field) == detail.get(field) for field in identity_fields)
              )
              print(
                  'protection_probe ruleset_version '
                  f'id={ruleset_id} status={version_status} shape={shape(version)} '
                  f'version_id_matches={bool(isinstance(version, dict) and version.get("version_id") == version_id)} '
                  f'updated_matches_detail={bool(isinstance(version, dict) and version.get("updated_at") == detail.get("updated_at"))} '
                  f'state_shape={shape(state)} state_update_shape={state_update_shape} '
                  f'identity_matches_detail={identity_matches}'
              )

              final_detail_status, final_detail = get(detail_path)
              stable_fields = (
                  'id', 'name', 'target', 'source_type', 'source',
                  'enforcement', 'conditions', 'bypass_actors', 'rules',
              )
              final_detail_stable = bool(
                  isinstance(final_detail, dict)
                  and all(final_detail.get(field) == detail.get(field) for field in stable_fields)
              )
              final_rules = rules(final_detail)
              final_updates = [row for row in final_rules if row.get('type') == 'update']
              final_update_omitted = bool(
                  len(final_updates) == 1 and 'parameters' not in final_updates[0]
              )
              print(
                  'protection_probe final_ruleset_detail '
                  f'id={ruleset_id} status={final_detail_status} shape={shape(final_detail)} '
                  f'stable_fields={final_detail_stable} '
                  f'updated_matches_detail={bool(isinstance(final_detail, dict) and final_detail.get("updated_at") == detail.get("updated_at"))} '
                  f'update_omitted={final_update_omitted}'
              )

              final_history_status, final_history = get(history_path)
              final_summary = (
                  final_history[0]
                  if isinstance(final_history, list) and len(final_history) == 1 and isinstance(final_history[0], dict)
                  else None
              )
              print(
                  'protection_probe final_ruleset_history '
                  f'id={ruleset_id} status={final_history_status} shape={shape(final_history)} '
                  f'count={len(final_history) if isinstance(final_history, list) else -1} '
                  f'version_matches={bool(isinstance(final_summary, dict) and final_summary.get("version_id") == version_id)} '
                  f'updated_matches_detail={bool(isinstance(final_summary, dict) and final_summary.get("updated_at") == detail.get("updated_at"))}'
              )

          print('protection_probe complete=true')
          PY

      - name: Classify or recover protected Vertical policy state
        id: policy-state
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.writer-token.outputs.app-slug }}
          STATE_REF: refs/heads/ai-sdlc-operator-state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${AI_SDLC_OPERATOR_APP_SLUG:-}"
          PYTHONPATH=scripts python scripts/recover_v03_vertical_policy_state.py

      - name: Materialize reviewed Vertical policy bundle
        if: steps.policy-state.outputs.policy_action == 'materialize'
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.writer-token.outputs.app-slug }}
          STATE_REF: refs/heads/ai-sdlc-operator-state
          GIT_AUTHOR_NAME: AI-SDLC Trusted Release Controller
          GIT_AUTHOR_EMAIL: trusted-release-controller@ai-sdlc.invalid
          GIT_COMMITTER_NAME: AI-SDLC Trusted Release Controller
          GIT_COMMITTER_EMAIL: trusted-release-controller@ai-sdlc.invalid
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${AI_SDLC_OPERATOR_APP_SLUG:-}"
          PYTHONPATH=scripts python scripts/materialize_v03_vertical_policy_state.py

      - name: Post-verify stable live protected authority
        env:
          AI_SDLC_OPERATOR_ADMIN_TOKEN: ${{ secrets.AI_SDLC_OPERATOR_ADMIN_TOKEN }}
          AI_SDLC_OPERATOR_APP_INTEGRATION_ID: ${{ vars.AI_SDLC_OPERATOR_APP_INTEGRATION_ID }}
          AI_SDLC_OPERATOR_APP_SLUG: ${{ steps.writer-token.outputs.app-slug }}
          STATE_REF: refs/heads/ai-sdlc-operator-state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${AI_SDLC_OPERATOR_APP_SLUG:-}"
          PYTHONPATH=scripts python scripts/postverify_v03_vertical_policy_state.py

      - name: Upload durable materialization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-vertical-policy-materialization
          path: |
            evidence/v03-vertical-writer-fence-proof.json
            evidence/v03-vertical-policy-materialization.json
          if-no-files-found: warn

      - name: Publish materialization receipt to Issue 263
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib import request

          evidence_path = Path('evidence/v03-vertical-policy-materialization.json')
          evidence = (
              json.loads(evidence_path.read_text(encoding='utf-8'))
              if evidence_path.is_file()
              else {}
          )
          lines = [
              '<!-- ai-sdlc-v03-vertical-policy-materialization -->',
              f"Trusted-main Vertical policy materialization job: **{os.environ['JOB_STATUS']}**",
              f"Run: `{os.environ['RUN_ID']}`",
              f"Installation head: `{os.environ['HEAD_SHA']}`",
          ]
          if evidence:
              lines.extend([
                  f"Materialization commit: `{evidence.get('materialization_commit_sha', '')}`",
                  f"Post-write verified state ref: `{evidence.get('post_write_verified_state_ref_sha', '')}`",
                  f"Policy bundle digest: `{evidence.get('policy_bundle_digest', '')}`",
                  f"Protection policy digest: `{(evidence.get('post_write_protection') or {}).get('policy_digest', '')}`",
                  f"Effect Lineage required: **{str(bool(evidence.get('effect_lineage_required'))).lower()}**",
                  f"Writer-surface proof digest: `{(evidence.get('writer_fence_quiescence_proof') or {}).get('writer_surface_proof_digest', '')}`",
                  f"Decision authority: `{evidence.get('decision_authority', '')}`",
              ])
          else:
              lines.append('No durable post-write materialization evidence was retained; Issue #263 remains unresolved.')
          payload = json.dumps({'body': '\n'.join(lines)}).encode()
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          repo = os.environ['GITHUB_REPOSITORY']
          req = request.Request(
              f'{api}/repos/{repo}/issues/263/comments',
              data=payload,
              method='POST',
          )
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('Authorization', f"Bearer {os.environ['GITHUB_TOKEN']}")
          req.add_header('X-GitHub-Api-Version', '2022-11-28')
          req.add_header('Content-Type', 'application/json')
          with request.urlopen(req, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f'failed to publish Issue #263 receipt: HTTP {response.status}')
          PY
