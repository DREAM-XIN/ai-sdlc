name: Provision trusted v0.3 dogfood fixtures
on:
  workflow_dispatch:

env:
    HAS_COPILOT_GITHUB_TOKEN: ${{ github.token != '' }}
    HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    HAS_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY != '' }}
    HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    HAS_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    HAS_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY != '' }}
    HAS_ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY != '' }}
    HAS_MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY != '' }}

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  reject-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt

      - name: Verify upstream effect-safety evidence before fixture writes
        env:
          AI_SDLC_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence
          PYTHONPATH=scripts python scripts/v03_dogfood_live_gate.py --scenario happy_path > evidence/upstream.json
      - name: Provision three isolated fixed fixtures without Worker or Store effects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for scenario in happy_path review_remediation session_recovery; do
            PYTHONPATH=scripts python scripts/provision_v03_dogfood_fixture.py --scenario "$scenario" --output "evidence/$scenario-fixture.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v03-dogfood-fixtures
          path: evidence/
          if-no-files-found: error
