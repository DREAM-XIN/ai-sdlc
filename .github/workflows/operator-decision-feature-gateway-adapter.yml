name: Validate Bounded Decision Feature Gateway Adapter

on:
  push:
    branches:
      - runtime/decision-feature-gateway-246
    paths:
      - '.github/workflows/operator-decision-feature-gateway-adapter.yml'
      - 'scripts/operator_decision_feature_gateway_adapter.py'
      - 'scripts/validate_operator_decision_feature_gateway_adapter.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/operator-decision-feature-gateway-adapter.yml'
      - 'scripts/operator_decision_feature_gateway_adapter.py'
      - 'scripts/validate_operator_decision_feature_gateway_adapter.py'

permissions:
  contents: read

jobs:
  bounded-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate bounded Decision gateway adapter
        run: python scripts/validate_operator_decision_feature_gateway_adapter.py
