name: Validate Operator v0.3 Write Runtime

on:
  push:
    branches:
      - runtime/operator-production-composition-244
    paths:
      - '.github/workflows/operator-v03-write-runtime.yml'
      - 'scripts/operator_v03_write_runtime.py'
      - 'scripts/operator_production_bundle.py'
      - 'scripts/operator_production_store_backends.py'
      - 'scripts/operator_production_write_bundle.py'
      - 'scripts/validate_operator_v03_write_runtime.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/operator-v03-write-runtime.yml'
      - 'scripts/operator_v03_write_runtime.py'
      - 'scripts/operator_production_bundle.py'
      - 'scripts/operator_production_store_backends.py'
      - 'scripts/operator_production_write_bundle.py'
      - 'scripts/validate_operator_v03_write_runtime.py'

permissions:
  contents: read

jobs:
  v03-write-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate v0.3 vertical write-ready runtime
        run: python scripts/validate_operator_v03_write_runtime.py
