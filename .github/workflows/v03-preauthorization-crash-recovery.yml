name: Validate v0.3 Pre-Authorization Crash Recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v03-preauthorization-crash-recovery.yml'
      - 'scripts/validate_v03_preauthorization_crash_recovery.py'
      - 'scripts/validate_v03_real_runtime_lost_ack_orchestration.py'
      - 'scripts/v03_real_runtime_lost_ack_orchestration.py'
      - 'scripts/operator_vertical_executor.py'
      - 'scripts/operator_vertical_reconcile.py'
      - 'scripts/operator_vertical_recovery.py'
      - 'scripts/operator_vertical_store.py'
      - 'scripts/operator_effect_lineage_integration.py'
      - 'scripts/operator_effect_lineage_fences.py'
      - 'scripts/operator_effect_resolution.py'
      - 'scripts/operator_effect_rollout.py'
      - 'scripts/operator_store.py'
      - 'scripts/operator_store_backends.py'
      - 'scripts/operator_store_git.py'
      - 'scripts/operator_store_model.py'
  push:
    branches: [verification/v0.3-real-runtime-effect-safety-221]
    paths:
      - '.github/workflows/v03-preauthorization-crash-recovery.yml'
      - 'scripts/validate_v03_preauthorization_crash_recovery.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_v03_preauthorization_crash_recovery.py
