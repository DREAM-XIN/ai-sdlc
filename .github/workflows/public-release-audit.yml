name: Public Release Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/validate_public_history.py'
      - 'scripts/audit_public_actions_history.py'
      - 'scripts/validate_public_release_audit_examples.py'
      - '.github/workflows/public-release-audit.yml'
      - 'docs/public-release-readiness.md'
  pull_request:
    paths:
      - 'scripts/validate_public_history.py'
      - 'scripts/audit_public_actions_history.py'
      - 'scripts/validate_public_release_audit_examples.py'
      - '.github/workflows/public-release-audit.yml'
      - 'docs/public-release-readiness.md'

permissions:
  contents: read
  actions: read

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/validate_public_release_audit_examples.py

  audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch all publishable Git refs
        shell: bash
        run: |
          git fetch --all --tags --prune
          git fetch --force origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge'

      - name: Scan current tracked tree
        run: python scripts/validate_public_readiness.py

      - name: Scan complete reachable Git history
        id: history
        continue-on-error: true
        run: |
          python scripts/validate_public_history.py \
            --json-output public-history-audit.json \
            --markdown-output public-history-audit.md

      - name: Audit retained Actions logs and artifacts
        id: actions_audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_public_actions_history.py \
            --json-output public-actions-audit.json \
            --markdown-output public-actions-audit.md

      - name: Publish audit summary and enforce gate
        if: always()
        shell: bash
        env:
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
          ACTIONS_OUTCOME: ${{ steps.actions_audit.outcome }}
        run: |
          {
            echo '# AI-SDLC Public Release Audit'
            echo
            echo "Repository: \`${GITHUB_REPOSITORY}\`"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            if [[ -f public-history-audit.md ]]; then cat public-history-audit.md; fi
            echo
            if [[ -f public-actions-audit.md ]]; then cat public-actions-audit.md; fi
            echo
            echo '## Decision'
            echo
            if [[ "$HISTORY_OUTCOME" == 'success' && "$ACTIONS_OUTCOME" == 'success' ]]; then
              echo '**PUBLIC-READY-AUDIT: PASS**'
            else
              echo '**PUBLIC-READY-AUDIT: BLOCKED**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$HISTORY_OUTCOME" = 'success'
          test "$ACTIONS_OUTCOME" = 'success'
