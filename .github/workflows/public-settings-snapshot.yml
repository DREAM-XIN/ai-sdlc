name: Public Settings Snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/snapshot_public_settings.py'
      - '.github/workflows/public-settings-snapshot.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/snapshot_public_settings.py'
      - '.github/workflows/public-settings-snapshot.yml'

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Capture sanitized repository settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/snapshot_public_settings.py
