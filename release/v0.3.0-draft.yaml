version: 0.3.0
status: planning
base_version: 0.2.0
tracking_issue: '#205'
final_manifest: release/v0.3.0.yaml
release_theme: ai-operated-sdlc
canonical_api_version: ai-sdlc.operator/v1
operation_event_version: ai-sdlc.operation-event/v1

release_intent: >-
  Productize the deterministic AI-SDLC control kernel behind a durable typed
  Operator surface while preserving lifecycle authority, independent role
  execution, immutable candidate evidence, and trusted GitHub-backed audit.

required_release_slice:
  starting_condition: installed-project-with-eligible-feature
  lifecycle:
    - ai-client-capability-status-and-inbox
    - durable-operation-start-or-discovery
    - developer
    - independent-code-review
    - durable-review-remediation-when-required
    - independent-re-review
    - qa-verification
    - needs-user-or-done
  user_experience:
    repeated_continue_messages_required: false
    routine_manual_github_operations_after_installation: false
    session_survival_required: true

client_contract:
  canonical_api: ai-sdlc.operator/v1
  required_supported_ai_client_adapters: 2
  materially_independent: true
  common_conformance_subset:
    - system.capabilities
    - feature.status
    - operator.inbox
    - operation.status
    - decision.list
    - notification.list
  both_require:
    - api-version-semantics
    - structured-error-semantics
    - identity-propagation
    - unsupported-capability-behavior
  minimum_write_capable_adapters: 1
  required_write_slice:
    - operation.start
    - operation.cancel
    - decision.respond
    - notification.ack

worker_result_contract:
  arbitrary_executable_feature_events: forbidden
  trusted_translation_required: true
  trusted_context_fields:
    - operation-id
    - operation-generation
    - dispatch-id
    - target-repository
    - feature-id
    - expected-revision
    - target-ref
    - candidate-pr-number-when-applicable
    - candidate-head-sha-when-applicable
    - task-id
    - role
    - runtime-receipt-identity
  reviewer_qa_candidate_head_sha_required: true
  current_head_revalidation_before_persist: true
  head_change_requires_new_semantic_dispatch: true
  required_translators:
    - developer-result-translator
    - review-verdict-translator
    - verification-verdict-translator

operation_store:
  authority: orchestration-only
  trusted_location: control-repository-protected-state-ref
  target_feature_branch_write_access: forbidden
  append_only_journal: required
  deterministic_projection: required
  git_ref_compare_and_set: required
  state_ref_selected_by_feature_branch: forbidden
  operation_generation_fencing: required
  one_active_generation_per_feature: true

semantic_dispatch:
  claim_before_launch: true
  identity_fields:
    - target-repository
    - feature-id
    - expected-revision
    - current-stage
    - task-identity
    - role
    - operation-generation
    - candidate-head-sha-when-candidate-bound
  invariant: >-
    At most one active valid Worker dispatch may exist for one target repository,
    Feature revision, stage, semantic task, role, Operation generation, and
    candidate head when applicable.

launch_fence:
  required: true
  check_immediately_before_external_side_effect: true
  verifies:
    - active-operation-still-current
    - operation-generation-current
    - operation-not-cancelled
    - operation-not-superseded
    - dispatch-claim-still-active
    - candidate-head-still-current-when-applicable
    - trusted-policy-and-credential-preconditions
  stale_generation_launch: forbidden

external_dispatch_recovery:
  stable_external_dispatch_key: required
  trusted_launch_receipt_lookup: required
  lookup_states:
    - NOT_LAUNCHED
    - LAUNCHED
    - UNKNOWN
  not_launched_behavior: retry-same-key-after-current-launch-fence
  launched_behavior: adopt-existing-receipt-no-relaunch
  unknown_behavior: blocked-no-speculative-relaunch

persist_linearization:
  required: true
  persist_requested_record: required
  final_generation_cancel_fence_before_feature_write: required
  candidate_head_revalidation_when_applicable: required
  linearization_receipt: required
  rules:
    cancellation_before_linearization: reject-feature-write
    cancellation_after_linearization: exact-inflight-write-may-complete
    feature_write_ack_loss: query-exact-event-receipt-before-retry

operation_states:
  top_level:
    - RUNNING
    - WAITING_EXTERNAL
    - NEEDS_USER
    - BLOCKED
    - DONE
    - CANCELLED
  waiting_external:
    - WAITING_WORKER
    - WAITING_CI
    - WAITING_PR
    - WAITING_CALLBACK
  needs_user:
    - NEEDS_CLARIFICATION
    - NEEDS_AUTHORIZATION
    - NEEDS_ACCEPTANCE
    - NEEDS_CREDENTIAL_SETUP
  terminal:
    - DONE
    - CANCELLED
  recoverable_suspended:
    - BLOCKED

authorization_model:
  trusted_sources:
    - protected-default-branch-configuration
    - installation-level-configuration
    - trusted-control-repository-policy
  feature_branch_can_tighten: true
  feature_branch_can_expand: false
  generic_natural_language_approval_is_sufficient: false
  decision_binding:
    - decision-id
    - decision-type
    - feature-id
    - operation-id
    - operation-generation
    - expected-revision
    - target-ref
    - candidate-head-sha-when-applicable
    - allowed-choice
    - trusted-policy-ref-or-digest
    - responder-identity
    - expiry

notification_outbox:
  required: true
  required_types:
    - decision.requested
    - operation.blocked
    - operation.completed
    - authorization.expiring
  new_session_discovery:
    - unfinished-operations
    - pending-decisions
    - unread-notifications
  bounded_ack_operation: notification.ack

acceptance_policy:
  default_standard_feature:
    ai_recommendation_allowed: true
    ai_recommendation_is_human_acceptance_evidence: false
    human_product_decision_required: true

required_workstreams:
  - id: operator-canonical-api-and-ai-client-adapters
    status: proposed
    includes:
      - transport-independent-typed-api
      - exact-api-versioning
      - capability-discovery
      - structured-error-model
      - identity-and-idempotency-contract
      - operator-inbox
      - two-supported-materially-independent-ai-client-adapters
      - one-write-capable-release-slice-adapter
      - canonical-conformance-tests
  - id: durable-operation-store-and-fencing
    status: proposed
    includes:
      - append-only-operation-events
      - deterministic-operation-projection
      - protected-control-state-ref
      - git-ref-cas
      - active-operation-generation
      - semantic-dispatch-claim
      - launch-fence
      - external-dispatch-key
      - trusted-launch-receipt-lookup
      - candidate-head-sha-binding
      - callback-correlation
  - id: operator-vertical-loop
    status: proposed
    includes:
      - developer-dispatch
      - trusted-developer-result-translation
      - independent-reviewer-dispatch
      - trusted-review-verdict-translation
      - durable-developer-remediation
      - independent-re-review
      - qa-dispatch
      - trusted-verification-verdict-translation
  - id: operator-recovery-concurrency-and-linearization
    status: proposed
    includes:
      - stale-revision-reread-and-replan
      - duplicate-request-and-callback-suppression
      - candidate-head-change-invalidation
      - claim-before-launch-crash-recovery
      - cancel-supersede-launch-fencing
      - persist-cancel-linearization
      - persist-ack-loss-recovery
      - concurrent-resume-safety
  - id: operator-decisions-authorization-notifications
    status: proposed
    includes:
      - bounded-decision-object
      - exact-revision-ref-sha-generation-binding
      - trusted-authorization-policy-resolution
      - operation-cancel-feature-cancel-separation
      - notification-outbox
      - new-session-discovery
  - id: v0-3-planning-manifest-validation
    status: proposed
    includes:
      - deterministic-draft-schema-or-validator
      - repository-ci-wiring
      - spec-manifest-consistency-checks

required_tests:
  tool_contract:
    - api-version-negotiation
    - capability-discovery
    - operator-inbox-without-prior-operation-id
    - invalid-schema-rejection
    - structured-error-codes
    - idempotency
    - expected-revision-rejection
  two_ai_client_conformance:
    minimum_supported_materially_independent_adapters: 2
    minimum_write_capable_adapters: 1
  authorization_adversarial:
    - feature-policy-expansion-rejected
    - broader-credential-scope-rejected
    - developer-gate-pass-rejected
    - reviewer-qa-prohibited-write-rejected
    - stale-authorization-replay-rejected
    - wrong-ref-authorization-replay-rejected
    - wrong-sha-authorization-replay-rejected
    - wrong-generation-authorization-replay-rejected
    - expired-decision-rejected
  operation_replay_and_races:
    - duplicate-callback
    - out-of-order-callback
    - duplicate-worker-completion
    - concurrent-operation-start-or-resume
    - concurrent-semantic-dispatch-claim
    - candidate-head-change-result-arrival-race
    - cancel-after-claim-before-launch
    - claim-committed-runner-crash-before-launch-receipt
    - cancel-before-persist-requested
    - cancel-between-persist-requested-and-linearized
    - cancel-after-persist-linearized-before-feature-write-confirmed
    - feature-write-success-acknowledgement-loss
    - projection-rebuild
    - client-session-loss-and-resume

required_dogfood:
  happy_path:
    status: pending
    requirement: vertical-loop-without-repeated-user-continue
  review_remediation:
    status: pending
    requirement: reviewer-change-request-through-remediation-re-review-and-qa
  session_recovery:
    status: pending
    requirement: new-session-discovers-durable-operation-and-user-items
  failure_injection:
    status: pending
    required_cases:
      - stale-revision
      - duplicate-callback
      - candidate-head-race
      - cancel-after-claim-before-launch
      - claim-before-launch-crash
      - concurrent-resume
      - cancel-persist-linearization-races
      - persist-acknowledgement-loss
  external_transport_matrix:
    status: pending-release-decision
    requirement: preserve-v0.2-public-private-trust-boundaries

known_release_blockers:
  - id: arbitrary-worker-event-mutation
    status: unresolved
  - id: missing-role-specific-trusted-translators
    status: unresolved
  - id: reviewer-qa-not-bound-to-exact-candidate-head
    status: unresolved
  - id: candidate-head-not-revalidated-before-persist
    status: unresolved
  - id: feature-branch-policy-escalation
    status: unresolved
  - id: authorization-not-exactly-bound
    status: unresolved
  - id: duplicate-semantic-worker-dispatch
    status: unresolved
  - id: multiple-active-operation-generations
    status: unresolved
  - id: stale-claim-can-cross-launch-after-cancel-or-supersede
    status: unresolved
  - id: claim-before-launch-crash-recovery-gap
    status: unresolved
  - id: unknown-launch-status-can-speculatively-relaunch
    status: unresolved
  - id: cancel-persist-linearization-gap
    status: unresolved
  - id: cancellation-before-linearization-can-still-persist
    status: unresolved
  - id: operation-store-not-append-only-rebuildable-cas-protected
    status: unresolved
  - id: callback-replay-side-effects
    status: unresolved
  - id: operation-cancel-feature-cancel-ambiguity
    status: unresolved
  - id: approval-misclassified-as-external-wait
    status: unresolved
  - id: new-session-discovery-gap
    status: unresolved
  - id: offline-user-stalls-durable-execution
    status: unresolved
  - id: fewer-than-two-supported-ai-client-adapters
    status: unresolved
  - id: no-write-capable-ai-client-release-slice
    status: unresolved
  - id: typed-api-version-or-capability-gap
    status: unresolved
  - id: decision-data-minimization-gap
    status: unresolved
  - id: ai-can-synthesize-human-acceptance-evidence
    status: unresolved
  - id: v0-3-draft-manifest-unvalidated
    status: unresolved
  - id: v0-2-authority-invariant-regression
    status: unresolved

release_invariants:
  lifecycle_authority:
    - operator-cannot-edit-authoritative-feature-manifest-directly
    - workers-cannot-emit-arbitrary-executable-feature-events
    - workers-cannot-pass-or-waive-gates
    - expected-revision-remains-lifecycle-write-precondition
    - lifecycle-mutations-remain-feature-event-plus-trusted-persist
  candidate_evidence:
    - reviewer-and-qa-bind-to-exact-candidate-head-sha
    - current-head-is-revalidated-before-gate-persist
    - head-change-requires-new-semantic-dispatch
  orchestration:
    - operation-state-does-not-become-feature-lifecycle-truth
    - operation-journal-is-append-only-and-rebuildable
    - state-writes-use-git-ref-cas
    - one-active-operation-generation-per-feature
    - semantic-dispatch-claimed-before-worker-launch
    - launch-requires-current-generation-fence
    - claim-before-launch-crash-is-recoverable-without-duplicate-side-effects
