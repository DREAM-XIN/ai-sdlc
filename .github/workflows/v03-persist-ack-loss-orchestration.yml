name: Validate v0.3 Persist ACK Loss Orchestration
run-name: v0.3 persist-ack-loss orchestration ${{ github.sha }}

on:
  push:
    branches:
      - verification/v0.3-real-runtime-effect-safety-221
    paths:
      - '.github/workflows/v03-persist-ack-loss-orchestration.yml'
      - 'scripts/v03_effect_safety_release_evidence.py'
      - 'scripts/v03_real_runtime_fault_injection.py'
      - 'scripts/validate_v03_persist_ack_loss_orchestration.py'
      - 'scripts/render_v03_persist_ack_loss_deterministic_evidence.py'
      - 'scripts/operator_store.py'
      - 'scripts/operator_store_backends.py'
      - 'scripts/operator_store_model.py'
      - 'scripts/operator_vertical_executor.py'
      - 'scripts/operator_vertical_reconcile.py'
      - 'scripts/operator_vertical_store.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v03-persist-ack-loss-orchestration.yml'
      - 'scripts/v03_effect_safety_release_evidence.py'
      - 'scripts/v03_real_runtime_fault_injection.py'
      - 'scripts/validate_v03_persist_ack_loss_orchestration.py'
      - 'scripts/render_v03_persist_ack_loss_deterministic_evidence.py'

permissions:
  contents: read

jobs:
  persist-ack-loss-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: pip install --quiet 'PyYAML>=6,<7' 'jsonschema>=4.23,<5'
      - name: Validate process-crash Persist ACK-loss recovery
        run: python scripts/validate_v03_persist_ack_loss_orchestration.py
      - name: Render PENDING deterministic Persist ACK-loss evidence
        run: python scripts/render_v03_persist_ack_loss_deterministic_evidence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v03-persist-ack-loss-deterministic-evidence
          path: evidence/v03-persist-ack-loss-deterministic.json
          if-no-files-found: error
