- id: F-GHAW-ROLE-ROUTING-0001-DESIGN-REMEDIATION-1
  kind: remediation
  stage: design
  role: architect
  source_stage: design-review
  feedback: Introduce a validated metadata-driven credential-source abstraction so
    secret-backed and trusted GitHub-token-backed profile readiness can be generated
    without profile/provider-name-specific branches; define alias compatibility and
    positive/negative tests while preserving secret non-serialization and eight-profile
    compatibility.
  status: DONE
  runtime: manual
- id: F-GHAW-ROLE-ROUTING-0001-CODE-REMEDIATION-1
  kind: remediation
  stage: implementation
  role: developer
  source_stage: code-review
  feedback: Preserve routing selection semantics but make durable routing audit evidence
    explicitly record the complete ordered candidate list independently from evaluated
    decisions; add deterministic preferred/fallback/no-ready and non-secret regressions
    without expanding scope or adding provider/profile-name-specific branches.
  status: TODO
  runtime: manual
