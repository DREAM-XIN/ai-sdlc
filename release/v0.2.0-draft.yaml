version: 0.2.0
status: stabilization-draft
base_version: 0.1.0

release_intent: >-
  Stabilize autonomous and cross-repository execution without changing the
  durable lifecycle authority model established by v0.1.

candidate_capabilities:
  - feature-context-propagation
  - automated-pr-review-and-verification-lifecycle
  - durable-review-remediation
  - provider-runtime-model-separation
  - effective-model-audit-metadata
  - trusted-issue-command-bridge
  - feature-event-artifact-lifecycle
  - explicit-event-persist-command
  - cross-repository-autonomous-gh-aw-dispatch
  - semantic-dispatch-idempotency
  - exact-command-and-worker-receipts
  - runtime-app-least-privilege-delegation
  - cross-repository-runtime-installation-preflight
  - target-installation-contract-preflight
  - workflow-profile-aware-task-context
  - compiled-worker-allowlist
  - gemini-engine-0.52.0-materialization

implemented_stabilization_fixes:
  - id: target-installation-contract-preflight
    issue: '#162'
    pull_request: '#168'
    merge_commit: d6eb9199f825d8d6dbc9eae9d88d06b5e48168ae
    evidence:
      - protocol-ci: '31264982213'
      - private-target-a-installation-check: passed
      - private-target-b-installation-check: passed
  - id: workflow-profile-aware-task-context
    issue: '#163'
    pull_request: '#164'
    merge_commit: 6b8540eedc5274b52fa2c1b83c62851074600244
    evidence:
      - protocol-ci: '31262874139'
  - id: gemini-0.52-current-main-rematerialization
    supersedes_pull_request: '#81'
    pull_request: '#170'
    merge_commit: 6e1ff19141ceda35db3c912e0739d0d8f9afeb62
    evidence:
      - protocol-ci: '31265718779'
      - strict-worker-compile: '31265719113'

current_blockers:
  - id: feature-context-dogfood
    issue: '#128'
    description: >-
      Current remediation content is reviewed and correctly scoped, but normal
      green repository validation evidence is still required. Review and
      verification lifecycle state must reach DONE through the normal path.
  - id: private-target-a-repeated-dogfood
    target: private-dogfood-target-a
    stage: review
    description: >-
      Requirement and implementation are DONE with green repository validation
      evidence. Independent review/code-gate and verification remain before the
      small-change workflow can reach DONE.
  - id: private-target-b-repeated-dogfood
    target: private-dogfood-target-b
    stage: requirement-review
    description: >-
      The low-risk CI-baseline Feature correctly failed closed when compilation
      exposed a security-sensitive compatibility issue. That work is split to a
      high-risk standard Feature with a completed requirement awaiting
      independent requirement review.

repeated_dogfood_candidates:
  - target: private-dogfood-target-a
    characteristics:
      - desktop-and-mobile-client
      - typescript-shared-packages
      - native-build-verification
    current_state: review-ready
  - target: private-dogfood-target-b
    characteristics:
      - java-spring-backend
      - vue-vite-frontend
      - browser-and-mobile-clients
      - relational-database
      - containerized-local-stack
      - security-sensitive
    current_state: requirement-review-ready

release_invariants:
  lifecycle_authority:
    - workers-cannot-edit-authoritative-feature-manifests
    - workers-cannot-pass-or-waive-gates
    - workers-cannot-merge-or-release
  transport:
    - target-command-surface-remains-provider-neutral
    - target-runtime-credentials-are-repository-scoped
    - default-branch-autonomous-targets-are-rejected
  installation:
    - target-project-adapter-and-required-context-are-validated-before-first-feature
    - ai-sdlc-caller-workflows-use-full-immutable-control-plane-shas
    - runtime-app-access-preflight-remains-separate-from-target-contract-preflight
  persistence:
    - lifecycle-mutations-use-feature-events-and-trusted-persist
    - expected-revision-remains-an-optimistic-write-precondition
  execution:
    - arbitrary-worker-workflow-selection-is-rejected
    - task-context-is-compatible-with-the-active-workflow-profile
    - duplicate-semantic-dispatch-does-not-create-duplicate-pr-side-effects

release_policy:
  change_version_file_only_when_candidate_is_ready: true
  production_caller_pin: full-commit-sha
  forbid_feature_specific_recovery_workflows: true
  require_green_repository_validation: true
  require_repeated_cross_repo_dogfood: true
