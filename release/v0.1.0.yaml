version: 0.1.0
status: release-candidate

normative_schemas:
  - spec/workflow.schema.json
  - spec/task.schema.json
  - spec/artifact.schema.json
  - spec/gate.schema.json
  - spec/runtime.schema.json
  - spec/evidence.schema.json
  - spec/task-package.schema.json
  - spec/task-execution.schema.json
  - spec/feature-manifest.schema.json
  - spec/feature-event.schema.json
  - spec/feature-bootstrap.schema.json
  - spec/dispatch-policy.schema.json
  - spec/commander-plan.schema.json
  - spec/github-persistence-plan.schema.json
  - spec/project-adapter.schema.json

workflow_profiles:
  - profiles/small-change.yaml
  - profiles/standard-feature.yaml
  - profiles/high-risk.yaml

reference_entry_points:
  commander: scripts/commander.py
  orchestrator: scripts/orchestrator_state.py
  transition: scripts/apply_feature_event.py
  inbox: scripts/ingest_feature_event.py
  persistence: scripts/github_persistence.py
  project_adapter: scripts/project_adapter.py
  git_write_precondition: scripts/verify_git_write_precondition.py
  gh_aw_adapter: scripts/gh_aw_adapter.py

required_docs:
  - README.md
  - docs/architecture.md
  - docs/protocol-versioning.md
  - docs/project-adapter.md
  - docs/feature-bootstrap-event-inbox.md
  - docs/optimistic-concurrency.md
  - docs/cross-repository-installation.md
  - docs/security-model.md
  - docs/integrations/gh-aw.md
  - runtimes/gh-aw/README.md

required_ci_validators:
  - scripts/validate.py
  - scripts/validate_feature_examples.py
  - scripts/validate_orchestrator_examples.py
  - scripts/validate_dispatch_examples.py
  - scripts/validate_feature_transition.py
  - scripts/validate_github_persistence.py
  - scripts/validate_bootstrap_inbox.py
  - scripts/validate_commander.py
  - scripts/validate_github_commander_transport.py
  - scripts/validate_github_workflow_security.py
  - scripts/validate_project_adapter.py
  - scripts/validate_cross_repo_transport.py
  - scripts/validate_git_write_precondition.py
  - scripts/validate_action_security.py
  - scripts/validate_gh_aw_adapter.py
  - scripts/validate_gh_aw_workflow_security.py
  - scripts/validate_release_readiness.py

reference_runtimes:
  manual:
    - chatgpt-web
  autonomous_reference:
    - gh-aw
  routing_only:
    - agent-orchestrator

known_release_blockers:
  - id: second-repository-dogfood
    issue: '#52'
    description: StarringV6Test cross-repository install must pass after private Actions Access is enabled.
  - id: autonomous-runtime-dogfood
    issue: '#6'
    description: A real compiled gh-aw worker must execute one bounded work unit and return durable PR/evidence state before autonomous runtime support is declared complete.

release_policy:
  publish_tag_after_blockers_clear: true
  production_caller_pin: full-commit-sha
